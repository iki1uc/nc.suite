  animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

.fade-in {
  animation: fadeIn 0.35s ease both;
}

.home-pulse {
  animation: homePulse 2.2s ease-in-out infinite;
}

.pyramid-layer {
  clip-path: polygon(6% 0, 94% 0, 100% 100%, 0 100%);
  transition: transform 0.25s ease, filter 0.25s ease, outline-color 0.25s ease;
}

.pyramid-layer:hover {
  transform: translateY(-2px);
  filter: brightness(1.08);
}

.pyramid-layer:focus-visible, .control-btn:focus-visible {
  outline: 3px solid var(--cyan);
  outline-offset: 3px;
}

.hover\:border-\[var\(--cyan\)\]:hover {
  border-color: var(--cyan);
}

.hover\:border-\[var\(--gold\)\]:hover {
  border-color: var(--gold);
}

.hover\:border-\[var\(--purple\)\]:hover {
  border-color: var(--purple);
}

@media (min-width: 420px) {
  .min-\[420px\]\:block {
    display: block;
  }
}

@media (min-width: 640px) {
  .sm\:hidden {
    display: none;
  }

  .sm\:min-h-\[58px\] {
    min-height: 58px;
  }

  .sm\:max-w-none {
    max-width: none;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:gap-3 {
    gap: 0.75rem;
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .sm\:py-8 {
    padding-top: 2rem;
    padding-bottom: 2rem;
  }

  .sm\:pt-9 {
    padding-top: 2.25rem;
  }

  .sm\:text-\[14px\] {
    font-size: 14px;
  }

  .sm\:text-\[15px\] {
    font-size: 15px;
  }

  .sm\:text-\[30px\] {
    font-size: 30px;
  }

  .sm\:text-\[34px\] {
    font-size: 34px;
  }

  .sm\:text-\[48px\] {
    font-size: 48px;
  }

  .sm\:text-\[62px\] {
    font-size: 62px;
  }
}
