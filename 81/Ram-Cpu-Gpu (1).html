.text-\[var\(--ink\)\] {
  color: var(--ink);
}

.text-black {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.text-white {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.line-through {
  text-decoration-line: line-through;
}

.ring-2 {
  --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);
  --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(2px + var(--tw-ring-offset-width)) var(--tw-ring-color);
  box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
}

.transition {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-all {
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.duration-500 {
  transition-duration: 500ms;
}

:root{
  --bg:#0a0a0f;
  --surface:#12121c;
  --surface2:#181826;
  --line:#2b2b3d;
  --ink:#f4f0e4;
  --muted:#a9a7b8;
  --gold:#e7b84a;
  --cyan:#35d7e8;
  --magenta:#ef4d9c;
  --green:#5fe1a4;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a0a0f;
    --surface:#12121c;
    --surface2:#181826;
    --line:#2b2b3d;
    --ink:#f4f0e4;
    --muted:#a9a7b8;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

button{
  font:inherit
}

.mono{
  font-family:inherit
}

.gold{
  color:var(--gold)
}

.cyan{
  color:var(--cyan)
}

.magenta{
  color:var(--magenta)
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px
}

.card:hover{
  border-color:#4a4a65
}

.chip{
  border:1px solid var(--line);
  border-radius:999px;
  padding:5px 10px;
  font-size:11px;
  letter-spacing:.08em
}

.flow-node{
  min-width:108px
}

.log-scroll{
  scrollbar-color:#3a3a55 transparent
}

@keyframes pulseGlow{
  0%,100%{
    box-shadow:0 0 0 rgba(231,184,74,0)
  }

  50%{
    box-shadow:0 0 28px rgba(231,184,74,.35)
  }
}

.frozen{
  animation:pulseGlow 1.8s ease-in-out infinite
}

@keyframes rise{
  from{
    opacity:0;
    transform:translateY(8px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.rise{
  animation:rise .35s ease both
}

@keyframes spinSlow{
  to{
    transform:rotate(360deg)
  }
}

.spin{
  animation:spinSlow 7s linear infinite
}

.last\:border-0:last-child {
  border-width: 0px;
}

.hover\:bg-white\/5:hover {
  background-color: rgb(255 255 255 / 0.05);
}

.hover\:brightness-110:hover {
  --tw-brightness: brightness(1.1);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

@media (min-width: 640px) {
  .sm\:grid {
    display: grid;
  }

  .sm\:grid-cols-\[72px_1fr_130px\] {
    grid-template-columns: 72px 1fr 130px;
  }

  .sm\:items-center {
    align-items: center;
  }

  .sm\:justify-self-end {
    justify-self: end;
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pt-8 {
    padding-top: 2rem;
  }

  .sm\:text-4xl {
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .sm\:text-\[72px\] {
    font-size: 72px;
  }

  .sm\:text-base {
    font-size: 1rem;
    line-height: 1.5rem;
  }

  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:block {
    display: block;
  }

  .lg\:hidden {
    display: none;
  }

  .lg\:grid-cols-\[\.9fr_1\.1fr\] {
    grid-template-columns: .9fr 1.1fr;
  }

  .lg\:grid-cols-\[1\.35fr_\.65fr\] {
    grid-template-columns: 1.35fr .65fr;
  }

  .lg\:grid-cols-\[1\.55fr_\.85fr\] {
    grid-template-columns: 1.55fr .85fr;
  }

  .lg\:flex-row {
    flex-direction: row;
  }

  .lg\:items-end {
    align-items: flex-end;
  }

  .lg\:items-center {
    align-items: center;
  }

  .lg\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .lg\:text-\[88px\] {
    font-size: 88px;
  }
}
