:root {
  --bg: #050509;
  --surface: #0c0c15;
  --surface2: #12121e;
  --line: #29293a;
  --text: #f6f1de;
  --muted: #a9a9b8;
  --gold: #f2c94c;
  --teal: #80cbc4;
  --red: #ff3b24;
  --green: #46ffb4;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
}

button {
  font: inherit;
  cursor: pointer;
}

.app-shell {
  min-height: 100vh;
  width: 100%;
  padding: var(--safe-area-inset-top) 18px 28px;
  background: radial-gradient(circle at 88% 8%, rgba(242,201,76,.13), transparent 28%), radial-gradient(circle at 8% 32%, rgba(128,203,196,.09), transparent 30%), var(--bg);
  overflow-x: clip;
}

.topbar {
  max-width: 1180px;
  margin: 0 auto;
  height: 58px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  font-weight: 800;
  letter-spacing: .12em;
  font-size: 13px;
}

.brand {
  display: flex;
  gap: 10px;
  align-items: center;
}

.brand-dot {
  width: 12px;
  height: 12px;
  background: var(--red);
  display: inline-block;
  box-shadow: 4px 4px 0 var(--gold);
}

.top-status {
  color: var(--teal);
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.pulse {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 5px rgba(70,255,180,.12);
}

.hero {
  max-width: 1180px;
  margin: 0 auto;
  padding: 56px 0 38px;
}

.eyebrow {
  color: var(--gold);
  font-size: 12px;
  letter-spacing: .18em;
  font-weight: 800;
}

.hero h1 {
  font-size: clamp(62px, 11vw, 138px);
  line-height: .82;
  letter-spacing: -.07em;
  margin: 20px 0 16px;
  font-weight: 950;
}

.hero h1 span {
  color: var(--gold);
}

.subtitle {
  font-size: clamp(20px, 3vw, 32px);
  line-height: 1.25;
  max-width: 820px;
  margin: 0;
}

.subtitle strong {
  color: var(--teal);
}

.formula {
  margin-top: 28px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.formula code {
  background: var(--gold);
  color: #050509;
  font-weight: 900;
  padding: 10px 14px;
  font-size: 18px;
}

.formula span {
  color: var(--muted);
}

.hero-actions {
  display: flex;
  gap: 12px;
  margin-top: 30px;
  flex-wrap: wrap;
}

.hero-actions button, .tester-foot button {
  border: 0;
  background: var(--green);
  color: #04140c;
  font-weight: 850;
  padding: 13px 17px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.hero-actions .ghost {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--text);
}

.hero-actions button:active, .hero-actions button:hover {
  transform: translateY(-1px);
}

.progress {
  margin-top: 34px;
  border-top: 1px solid var(--line);
  padding-top: 18px;
  display: grid;
  grid-template-columns: 150px 1fr 130px;
  gap: 18px;
  align-items: center;
}

.progress > div:first-child {
  display: flex;
  flex-direction: column;
}

.progress b {
  font-size: 24px;
}

.progress span {
  color: var(--muted);
  font-size: 12px;
}

.bar {
  height: 9px;
  background: #1c1c29;
  overflow: hidden;
}

.bar i {
  display: block;
  height: 100%;
  background: var(--green);
  transition: width .35s ease;
}

.progress-note {
  text-align: right;
  color: var(--gold);
  font-weight: 800;
  letter-spacing: .08em;
}

.section-head {
  max-width: 1180px;
  margin: 34px auto 22px;
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 30px;
}

.kicker {
  color: var(--gold);
  font-weight: 850;
  letter-spacing: .14em;
  font-size: 12px;
  margin: 0 0 10px;
}

.section-head h2 {
  font-size: clamp(34px, 5vw, 58px);
  line-height: .95;
  letter-spacing: -.04em;
  margin: 0;
}

.section-head h2 span {
  color: var(--teal);
}

.section-copy {
  max-width: 360px;
  color: var(--muted);
  line-height: 1.55;
  margin: 0;
}

.mess-grid {
  max-width: 1180px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
}

.mess-card {
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--line);
}

.mess-card.is-clean {
  border-color: rgba(70,255,180,.55);
  background: linear-gradient(180deg, rgba(70,255,180,.08), var(--surface));
}

.mess-card.is-mess {
  border-top: 4px solid var(--red);
}

.card-button {
  width: 100%;
  height: 100%;
  background: transparent;
  border: 0;
  color: var(--text);
  text-align: left;
  padding: 18px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.card-top {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.tag {
  font-size: 10px;
  letter-spacing: .16em;
  font-weight: 850;
  color: var(--muted);
}

.state {
  font-size: 10px;
  font-weight: 900;
  padding: 5px 7px;
  letter-spacing: .1em;
}

.state.mess {
  background: var(--red);
  color: white;
}

.state.clean {
  background: var(--green);
  color: #04140c;
}

.card-icon {
  color: var(--gold);
  margin: 24px 0 12px;
}

.mess-card.is-clean .card-icon {
  color: var(--green);
}

.card-button h3 {
  font-size: 21px;
  line-height: 1.05;
  margin: 0 0 12px;
}

.card-text {
  color: var(--muted);
  line-height: 1.5;
  font-size: 14px;
  margin: 0;
  min-height: 108px;
}

.card-rule {
  margin-top: auto;
  padding-top: 18px;
  border-top: 1px dashed var(--line);
  font-family: ui-monospace, monospace;
  font-size: 11px;
  line-height: 1.4;
  color: var(--teal);
  width: 100%;
}

.card-cta {
  margin-top: 16px;
  color: var(--gold);
  font-weight: 800;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.path, .tester {
  max-width: 1180px;
  margin: 72px auto 0;
}

.section-head.compact {
  margin: 0 0 22px;
}

.steps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 12px;
}

.step {
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 22px;
  text-align: left;
  display: flex;
  gap: 16px;
  align-items: flex-start;
}

.step.active {
  border-color: var(--gold);
  background: #17130a;
}

.step-num {
  color: var(--gold);
  font-weight: 950;
  font-size: 26px;
  line-height: 1;
}

.step h3 {
  margin: 0 0 9px;
  font-size: 22px;
  letter-spacing: -.02em;
}

.step p {
  color: var(--muted);
  line-height: 1.5;
  font-size: 14px;
  margin: 0 0 12px;
}

.step small {
  color: var(--teal);
  font-weight: 700;
}

.step svg {
  margin-left: auto;
  color: var(--gold);
  flex: 0 0 auto;
}

.architecture {
  margin-top: 12px;
  border: 1px solid var(--line);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  font-family: ui-monospace, monospace;
  font-size: 13px;
}

.architecture strong {
  color: var(--green);
}

.tester {
  background: var(--surface2);
  border: 1px solid var(--line);
  padding: 28px;
}

.tester-head {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 20px;
}

.tester-head h2 {
  font-size: clamp(30px, 4vw, 46px);
  margin: 0 0 8px;
}

.tester-head p:last-child {
  color: var(--muted);
  margin: 0;
}

.score {
  text-align: right;
  flex: 0 0 auto;
}

.score strong {
  font-size: 52px;
  line-height: 1;
  color: var(--gold);
}

.score strong span {
  font-size: 24px;
  color: var(--muted);
}

.score small {
  display: block;
  letter-spacing: .15em;
  color: var(--muted);
  font-size: 10px;
  margin-top: 5px;
}

.test-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  gap: 12px;
  margin-top: 24px;
}

.test-card {
  border: 1px solid var(--line);
  background: #0a0a13;
  color: var(--text);
  padding: 18px;
  text-align: left;
  min-height: 172px;
  display: flex;
  flex-direction: column;
}

.test-card.pass {
  border-color: var(--green);
  background: rgba(70,255,180,.08);
}

.test-card.fail {
  border-color: var(--red);
  background: rgba(255,59,36,.08);
}

.test-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 850;
}

.test-top svg {
  color: var(--green);
}

.test-card.fail .test-top svg {
  color: var(--red);
}

.idle-dot {
  width: 10px;
  height: 10px;
  border: 2px solid var(--muted);
  border-radius: 50%;
}

.expect {
  font-size: 22px;
  font-weight: 800;
  margin: 20px 0 5px;
}

.proof {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
  margin: 0;
  font-family: ui-monospace, monospace;
}

.result-label {
  margin-top: auto;
  padding-top: 18px;
  font-size: 13px;
  letter-spacing: .08em;
}

.test-card.pass .result-label {
  color: var(--green);
}

.test-card.fail .result-label {
  color: var(--red);
}

.tester-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 18px;
  gap: 12px;
  flex-wrap: wrap;
}

.tester-foot .text-btn {
  background: transparent;
  border: 0;
  color: var(--text);
  padding: 8px 0;
}

.tester-foot span {
  color: var(--muted);
  font-size: 13px;
}

.notice {
  max-width: 1180px;
  margin: 24px auto 0;
  padding: 14px 16px;
  border-left: 3px solid var(--gold);
  background: #151208;
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 14px;
}

.notice-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gold);
  flex: 0 0 auto;
}

footer {
  max-width: 1180px;
  margin: 28px auto 0;
  border-top: 1px solid var(--line);
  padding-top: 18px;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  color: var(--muted);
  font-size: 12px;
  flex-wrap: wrap;
}

footer div {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

footer strong {
  color: var(--text);
}

@media (max-width: 900px) {
  .mess-grid {
    grid-template-columns: repeat(2, minmax(0,1fr));
  }

  .card-text {
    min-height: 0;
  }

  .test-grid {
    grid-template-columns: repeat(2, minmax(0,1fr));
  }

  .steps {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 600px) {
  .app-shell {
    padding-left: 14px;
    padding-right: 14px;
  }

  .top-status {
    display: none;
  }

  .hero {
    padding-top: 38px;
  }

  .section-head {
    flex-direction: column;
    align-items: flex-start;
  }

  .section-copy {
    max-width: none;
  }

  .mess-grid, .test-grid {
    grid-template-columns: 1fr;
  }

  .progress {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .progress-note {
    text-align: left;
  }

  .tester {
    padding: 20px 16px;
  }

  .tester-head {
    flex-direction: column;
  }

  .score {
    text-align: left;
  }

  .formula {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  footer {
    flex-direction: column;
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050509;
  }
}
