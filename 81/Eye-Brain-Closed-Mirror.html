:root{
  --bg:#050509;
  --surface:#0c0c15;
  --surface2:#11111e;
  --line:#29293c;
  --gold:#F2C94C;
  --cyan:#4DA3FF;
  --green:#3dff8e;
  --silver:#d7dce6;
  --text:#f2f4f6;
  --muted:#a9aeba;
  --red:#ff5d73;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#030307;
    --surface:#0a0a12;
    --surface2:#101019;
    --line:#2b2b3f;
    --text:#f5f6f8;
    --muted:#adb1bd;
  }
}

*{
  box-sizing:border-box
}

html{
  background:var(--bg);
  color:var(--text)
}

body{
  margin:0;
  min-width:320px;
  background:var(--bg);
  color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  font-size:16px;
  line-height:1.6
}

button,input,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 20px 28px;
  background:radial-gradient(circle at 10% 4%,rgba(77,163,255,.12),transparent 28%),radial-gradient(circle at 90% 18%,rgba(242,201,76,.1),transparent 30%),var(--bg)
}

.top{
  max-width:1180px;
  margin:0 auto;
  padding:42px 0 28px;
  border-bottom:1px solid var(--line)
}

.eyebrow{
  font-size:12px;
  letter-spacing:.18em;
  color:var(--cyan);
  font-weight:800;
  display:flex;
  align-items:center;
  gap:9px
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 5px rgba(61,255,142,.12)
}

h1{
  font-size:clamp(42px,7vw,84px);
  line-height:.92;
  letter-spacing:-.055em;
  margin:20px 0 14px;
  font-weight:900
}

h1 span{
  color:var(--gold)
}

.lead{
  font-size:21px;
  color:var(--muted);
  margin:0
}

.header-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:24px
}

.header-meta span{
  border:1px solid var(--line);
  padding:7px 11px;
  border-radius:999px;
  font-size:12px
}

.gold-text{
  color:var(--gold)!important;
  border-color:rgba(242,201,76,.45)!important
}

.explain{
  max-width:1180px;
  margin:24px auto;
  display:grid;
  grid-template-columns:1fr 44px 1fr 1.1fr;
  gap:12px;
  align-items:stretch
}

.explain-no,.explain-yes,.rule{
  padding:20px;
  border:1px solid var(--line);
  background:var(--surface)
}

.explain-yes{
  border-color:var(--gold);
  background:#15110a
}

.explain span{
  display:block;
  color:var(--muted);
  font-size:12px
}

.explain strong{
  font-size:16px;
  letter-spacing:.08em
}

.explain p{
  margin:8px 0 0;
  color:var(--muted);
  font-size:14px
}

.explain-arrow{
  display:grid;
  place-items:center;
  color:var(--gold);
  font-size:28px
}

.rule{
  display:flex;
  gap:13px;
  align-items:flex-start;
  color:var(--green)
}

.rule p{
  margin:2px 0 0;
  color:var(--muted)
}

.work-grid{
  max-width:1180px;
  margin:0 auto;
  display:grid;
  grid-template-columns:minmax(0,2fr) minmax(280px,.75fr);
  gap:16px
}

.mirror-work,.eye-panel,.depth-section,.codes,.log-section{
  border:1px solid var(--line);
  background:var(--surface)
}

.mirror-work{
  padding:24px
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:start
}

.kicker{
  font-size:11px;
  letter-spacing:.2em;
  color:var(--cyan);
  font-weight:800;
  margin:0
}

.section-head h2,.depth-section h2,.codes-head h2,.log-head h2{
  font-size:30px;
  line-height:1.1;
  margin:5px 0
}

.mirror-mark{
  color:var(--silver);
  border:1px solid var(--line);
  padding:6px 9px;
  font-size:12px
}

.mirror-stage{
  display:grid;
  grid-template-columns:1fr 74px 1fr;
  gap:10px;
  margin:22px 0
}

.side{
  min-height:270px;
  padding:20px;
  position:relative;
  overflow:hidden
}

.original{
  background:#101623;
  border:1px solid rgba(77,163,255,.32)
}

.mirror-side{
  background:linear-gradient(135deg,#292d34,#171920 58%,#2f3239);
  border:1px solid #a7b0bb;
  transition:transform .35s ease
}

.mirror-side.is-flipped{
  transform:scaleX(-1)
}

.side-label{
  font-size:11px;
  letter-spacing:.15em;
  color:var(--muted)
}

.side h3{
  font-size:23px;
  margin:12px 0
}

.side p{
  font-size:14px;
  color:#c8ccd4
}

.mini{
  margin-top:20px;
  padding:12px;
  border:1px solid rgba(255,255,255,.18);
  font-size:13px
}

.eye-mini{
  display:block;
  margin-top:15px;
  color:var(--gold);
  font-size:12px
}

.mirror-line{
  display:grid;
  place-items:center;
  color:var(--silver);
  text-align:center;
  font-size:11px;
  letter-spacing:.14em
}

.mirror-line span{
  opacity:.45
}

.mirror-actions{
  display:flex;
  gap:10px
}

.primary,.secondary{
  border:0;
  padding:13px 16px;
  font-weight:900;
  display:flex;
  align-items:center;
  gap:8px
}

.primary{
  background:var(--gold);
  color:#111
}

.secondary{
  background:transparent;
  color:var(--text);
  border:1px solid var(--silver)
}

.depth-levels{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:14px
}

.level{
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  padding:12px;
  text-align:left;
  display:flex;
  flex-direction:column
}

.level span{
  color:var(--cyan)
}

.level small{
  color:var(--muted)
}

.level.active{
  border-color:var(--gold);
  background:#171204
}

.level-detail{
  margin-top:12px;
  display:flex;
  gap:12px;
  color:var(--gold);
  padding:14px;
  border-top:1px solid var(--line)
}

.level-detail p{
  margin:3px 0 0;
  color:var(--muted)
}

.eye-panel{
  padding:26px;
  background:#09090f
}

.eye-visual{
  height:170px;
  border:1px solid var(--line);
  background:#05050a;
  position:relative;
  display:grid;
  place-items:center;
  overflow:hidden;
  margin-bottom:20px
}

.eye-visual span{
  font-size:58px;
  color:#2c2c3c
}

.eye-visual i{
  position:absolute;
  bottom:14px;
  color:var(--gold);
  font-style:normal
}

.lid{
  position:absolute;
  left:0;
  right:0;
  height:70px;
  background:#13131d;
  z-index:2
}

.lid-top{
  top:0;
  border-bottom:2px solid var(--gold)
}

.lid-bottom{
  bottom:0;
  border-top:2px solid var(--gold)
}

.eye-panel h2{
  font-size:31px;
  margin:5px 0 12px
}

.eye-copy{
  font-size:17px
}

.dont-open{
  width:100%;
  margin-top:18px;
  border:1px solid var(--gold);
  background:transparent;
  color:var(--gold);
  padding:13px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  font-weight:900
}

.respect{
  display:flex;
  gap:8px;
  align-items:flex-start;
  color:var(--green);
  font-size:13px;
  margin:16px 0 0
}

.depth-section{
  max-width:1180px;
  margin:16px auto;
  padding:26px
}

.depth-head{
  display:flex;
  justify-content:space-between;
  gap:30px
}

.fx-box{
  min-width:180px;
  border:1px solid var(--gold);
  padding:14px 18px;
  text-align:right;
  background:#171204
}

.fx-box span,.fx-box small{
  display:block;
  color:var(--gold);
  font-size:12px
}

.fx-box strong{
  font-size:42px;
  line-height:1
}

.slider{
  width:100%;
  margin:30px 0 8px;
  accent-color:var(--gold);
  height:8px
}

.slider-scale{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px
}

.status{
  margin-top:18px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px;
  border:1px solid var(--line)
}

.status span{
  margin-left:auto;
  color:var(--muted);
  font-size:13px
}

.status.home{
  color:var(--green);
  border-color:var(--green)
}

.status.tot{
  color:var(--red);
  border-color:var(--red)
}

.status.way{
  color:var(--cyan)
}

.codes{
  max-width:1180px;
  margin:16px auto;
  padding:26px
}

.codes-head{
  display:flex;
  justify-content:space-between;
  gap:30px;
  align-items:end
}

.codes-head p{
  color:var(--muted);
  margin:0
}

.code-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:24px
}

.code-panel{
  border:1px solid var(--line);
  background:#07070d;
  display:flex;
  flex-direction:column;
  min-width:0
}

.code-panel.py{
  border-top:3px solid var(--green)
}

.code-panel.js{
  border-top:3px solid var(--gold)
}

.code-panel.css{
  border-top:3px solid var(--cyan)
}

.code-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px
}

.code-head h3{
  font-size:15px;
  margin:0
}

.code-badge{
  font-size:11px;
  color:var(--gold);
  letter-spacing:.15em
}

.copy-btn{
  border:1px solid var(--gold);
  background:transparent;
  color:var(--gold);
  padding:8px 10px;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  font-weight:800
}

.code-note{
  font-size:12px;
  color:var(--muted);
  padding:0 14px 10px;
  margin:0
}

.code-panel textarea{
  width:100%;
  height:410px;
  resize:vertical;
  border:0;
  border-top:1px solid var(--line);
  background:#08080e;
  color:#d7dce6;
  padding:15px;
  font-family:inherit;
  font-size:12.5px;
  line-height:1.55;
  outline:none;
  white-space:pre
}

.log-section{
  max-width:1180px;
  margin:16px auto;
  padding:26px
}

.log-head{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.log-head button{
  border:1px solid var(--line);
  background:transparent;
  color:var(--muted);
  padding:9px 12px
}

.log-list{
  list-style:none;
  margin:18px 0 0;
  padding:0;
  border-top:1px solid var(--line)
}

.log-list li{
  display:grid;
  grid-template-columns:90px 1fr;
  gap:16px;
  padding:12px 0;
  border-bottom:1px solid #1a1a28;
  font-size:14px
}

.log-list time{
  color:var(--cyan)
}

footer{
  max-width:1180px;
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  gap:20px;
  color:var(--muted);
  font-size:12px;
  letter-spacing:.12em;
  padding-top:8px
}

@media(max-width:800px){
  .shell{
    padding-left:14px;
    padding-right:14px
  }

  .top{
    padding-top:28px
  }

  h1{
    font-size:46px
  }

  .explain{
    grid-template-columns:1fr
  }

  .explain-arrow{
    transform:rotate(90deg);
    height:32px
  }

  .work-grid{
    grid-template-columns:1fr
  }

  .mirror-stage{
    grid-template-columns:1fr
  }

  .mirror-line{
    display:flex;
    gap:8px;
    justify-content:center
  }

  .mirror-line span{
    transform:rotate(90deg)
  }

  .mirror-actions{
    flex-direction:column
  }

  .depth-levels{
    grid-template-columns:1fr
  }

  .depth-head,.codes-head,.log-head{
    align-items:flex-start;
    flex-direction:column
  }

  .fx-box{
    width:100%;
    text-align:left
  }

  .code-grid{
    grid-template-columns:1fr
  }

  .code-panel textarea{
    height:340px
  }

  .log-list li{
    grid-template-columns:1fr;
    gap:2px
  }

  .status{
    flex-wrap:wrap
  }

  .status span{
    margin-left:0
  }

  footer{
    flex-direction:column;
    gap:5px
  }
}

@media(max-width:430px){
  .top{
    padding-top:22px
  }

  h1{
    font-size:40px
  }

  .lead{
    font-size:18px
  }

  .mirror-work,.eye-panel,.depth-section,.codes,.log-section{
    padding:18px 14px
  }

  .section-head h2,.depth-section h2,.codes-head h2,.log-head h2{
    font-size:26px
  }

  .side{
    min-height:230px
  }

  .slider-scale{
    font-size:10px
  }
}

  seil: "1 Seil reicht."

  if (x === HOME) return "HOME 40 — angekommen.";

  // Gespiegelt, aber gleiche Tiefe.

}
