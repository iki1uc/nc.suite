:root{
  --bg:#07090b;
  --surface:#10161a;
  --surface2:#151d21;
  --line:#263238;
  --text:#eef3f1;
  --muted:#93a39d;
  --gold:#f5c33a;
  --cyan:#4be3d2;
  --green:#7ee787
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text)
}

body{
  font-family:Consolas,"Courier New",monospace;
  overflow-x:clip
}

button,input,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  background:radial-gradient(900px 320px at 85% 0%,rgba(245,195,58,.10),transparent 60%),radial-gradient(700px 300px at 0% 20%,rgba(75,227,210,.08),transparent 55%),var(--bg)
}

.topbar{
  max-width:1240px;
  margin:0 auto;
  padding:18px 22px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line)
}

.brand{
  font-size:22px;
  letter-spacing:.08em;
  font-weight:800
}

.brand em{
  color:var(--gold);
  font-style:normal
}

.dot{
  display:inline-block;
  width:10px;
  height:10px;
  background:var(--cyan);
  border-radius:50%;
  margin-right:10px;
  box-shadow:0 0 14px var(--cyan)
}

.topmeta{
  display:flex;
  gap:16px;
  align-items:center;
  color:var(--muted);
  font-size:12px;
  letter-spacing:.12em
}

.topmeta b{
  color:var(--gold)
}

.live{
  color:var(--cyan)
}

.wrap{
  max-width:1240px;
  margin:0 auto;
  padding:24px 22px 30px
}

.hero{
  display:grid;
  grid-template-columns:1.65fr .9fr;
  gap:22px;
  padding:22px 0 28px;
  border-bottom:1px solid var(--line)
}

.eyebrow{
  color:var(--cyan);
  font-size:11px;
  letter-spacing:.18em;
  margin:0 0 12px
}

.hero h1{
  font-size:clamp(38px,5.4vw,68px);
  line-height:.96;
  letter-spacing:-.04em;
  margin:0
}

.hero h1 span{
  color:var(--gold)
}

.lede{
  color:var(--muted);
  max-width:650px;
  line-height:1.6;
  margin:18px 0 22px
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px
}

.btn{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  padding:12px 16px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-weight:800;
  letter-spacing:.04em
}

.btn:hover{
  border-color:var(--cyan);
  transform:translateY(-1px)
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed
}

.btn.primary{
  background:var(--gold);
  color:#14100a;
  border-color:var(--gold)
}

.btn.gold{
  border-color:var(--gold);
  color:var(--gold)
}

.btn.ghost{
  background:transparent
}

.fixbox{
  margin-top:20px;
  background:#15120a;
  border:1px solid #4a3c12;
  padding:13px 14px;
  display:flex;
  gap:11px;
  color:var(--gold);
  max-width:680px
}

.fixbox div{
  display:flex;
  flex-direction:column;
  gap:4px
}

.fixbox span{
  color:#d6c997;
  font-size:12px;
  line-height:1.5
}

.fixbox code{
  background:#000;
  padding:1px 5px;
  color:#fff
}

.burro-card{
  background:var(--surface);
  border:1px solid var(--line);
  padding:18px;
  display:flex;
  flex-direction:column
}

.burro{
  height:104px;
  border:1px solid var(--gold);
  display:grid;
  place-items:center;
  font-size:26px;
  font-weight:900;
  letter-spacing:.16em;
  color:var(--gold);
  background:linear-gradient(135deg,#241c05,#10161a)
}

.burro.hop{
  animation:hop .45s ease-in-out 3
}

.burro-row{
  display:flex;
  justify-content:space-between;
  padding:12px 0 0;
  font-size:12px;
  color:var(--muted)
}

.burro-row b{
  color:var(--text)
}

.goldtext{
  color:var(--gold)!important
}

.burro-card p{
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
  margin-top:16px
}

@keyframes hop{
  50%{
    transform:translateY(-12px) scale(1.03)
  }
}

.meters{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin:22px 0
}

.meter{
  border:1px solid var(--line);
  background:var(--surface);
  padding:16px
}

.meter.big{
  min-height:118px
}

.meter-head{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  letter-spacing:.1em;
  color:var(--muted)
}

.meter-head b{
  color:var(--text);
  font-size:16px
}

.meter-head svg{
  vertical-align:-2px
}

.bar{
  height:9px;
  background:#0a0e10;
  margin:14px 0 10px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  background:var(--cyan);
  transition:width .4s
}

.hypebar i{
  background:linear-gradient(90deg,var(--cyan),var(--gold))
}

.meter-sub{
  font-size:12px;
  color:var(--muted);
  line-height:1.5
}

.meter-sub b{
  color:var(--text)
}

.ok{
  color:var(--green)!important
}

input[type=range]{
  width:100%;
  accent-color:var(--gold);
  margin:12px 0 5px
}

.range-labels{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  color:var(--muted)
}

.homezone{
  color:var(--gold)
}

.grid{
  display:grid;
  grid-template-columns:1.05fr .9fr 1.05fr;
  gap:16px;
  align-items:start
}

.panel{
  background:var(--surface);
  border:1px solid var(--line);
  padding:18px
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px
}

.panel-head h2,.panel-head h3{
  font-size:13px;
  letter-spacing:.1em;
  margin:0;
  display:flex;
  align-items:center;
  gap:7px
}

.panel-head>span{
  font-size:11px;
  color:var(--muted)
}

.panel-head.small{
  margin-top:22px
}

.suppressed{
  color:var(--gold)!important
}

.suppressed b{
  font-size:14px
}

.wheel-wrap{
  position:relative;
  width:300px;
  height:300px;
  margin:18px auto 8px
}

.pointer{
  position:absolute;
  left:50%;
  top:-7px;
  transform:translateX(-50%);
  color:var(--gold);
  z-index:3;
  font-size:20px
}

.wheel{
  width:100%;
  height:100%;
  border:1px solid #3a4a4d;
  border-radius:50%;
  position:relative;
  touch-action:none;
  cursor:grab;
  background:radial-gradient(circle,#10161a 0 42%,#0a0e10 42%);
  transition:transform .25s ease-out
}

.wheel:active{
  cursor:grabbing
}

.node{
  position:absolute;
  left:50%;
  top:50%;
  width:48px;
  height:48px;
  margin:-24px;
  border:1px solid var(--line);
  border-radius:50%;
  background:#1a2428;
  color:var(--text);
  font-weight:800;
  font-size:11px
}

.node.active{
  background:var(--gold);
  color:#111;
  border-color:var(--gold);
  box-shadow:0 0 22px rgba(245,195,58,.5)
}

.hub{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:96px;
  height:96px;
  border:1px solid var(--cyan);
  border-radius:50%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  background:#0b1113
}

.hub small{
  font-size:9px;
  color:var(--muted)
}

.hub b{
  font-size:18px;
  color:var(--cyan)
}

.hub span{
  font-size:9px;
  color:var(--gold)
}

.hint{
  color:var(--muted);
  font-size:12px;
  line-height:1.6
}

.cmdbox{
  margin-top:18px;
  border-top:1px solid var(--line);
  padding-top:14px
}

.cmdbox label{
  font-size:11px;
  letter-spacing:.12em;
  color:var(--muted)
}

.cmdrow{
  display:flex;
  margin-top:9px
}

.cmdrow input{
  flex:1;
  min-width:0;
  background:#090d0f;
  border:1px solid var(--line);
  color:var(--text);
  padding:11px
}

.cmdrow button{
  background:var(--gold);
  color:#111;
  border:0;
  padding:0 14px;
  display:flex;
  align-items:center;
  gap:3px;
  font-weight:900
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px
}

.chips button{
  background:transparent;
  border:1px solid var(--line);
  color:var(--muted);
  padding:6px 9px;
  font-size:11px
}

.chips button:hover{
  color:var(--gold);
  border-color:var(--gold)
}

.steps{
  list-style:none;
  padding:0;
  margin:0
}

.steps li{
  display:flex;
  gap:11px;
  align-items:center;
  padding:9px 0;
  border-bottom:1px solid #1c282c
}

.steps .num{
  color:var(--muted);
  font-size:11px
}

.steps li div{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:2px
}

.steps li div span{
  font-size:11px;
  color:var(--muted)
}

.steps li.done{
  color:var(--green)
}

.steps li.now{
  color:var(--gold)
}

.steps li em{
  font-style:normal;
  color:var(--muted)
}

.pulse{
  animation:pulse 1s infinite
}

@keyframes pulse{
  50%{
    opacity:.3
  }
}

.vitals{
  margin-top:4px
}

.vital{
  margin:11px 0
}

.vital>div{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--muted)
}

.vital b{
  color:var(--text)
}

.vbar{
  height:5px;
  background:#090d0f;
  margin-top:5px
}

.vbar i{
  display:block;
  height:100%;
  background:var(--cyan);
  transition:width .4s
}

.log-note{
  font-size:12px;
  line-height:1.55;
  color:var(--muted);
  margin:-4px 0 13px
}

.loglist{
  display:flex;
  flex-direction:column;
  gap:1px;
  max-height:470px;
  overflow:auto
}

.logline{
  display:grid;
  grid-template-columns:58px 1fr;
  gap:9px;
  padding:8px 6px;
  border-bottom:1px solid #1c282c;
  font-size:12px;
  line-height:1.45
}

.logline>span{
  color:var(--muted);
  font-size:11px
}

.logline p{
  margin:0
}

.logline.home{
  color:var(--gold);
  background:#1a1608
}

.logline.hype{
  color:var(--gold)
}

.logline.cmd{
  color:var(--cyan)
}

.dedup-demo{
  margin-top:14px;
  border:1px dashed #4a4c45;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:5px;
  font-size:11px;
  color:var(--muted)
}

.dedup-demo b{
  color:var(--text)
}

.export{
  margin-top:14px
}

.export label{
  font-size:11px;
  letter-spacing:.1em;
  color:var(--muted)
}

.export textarea{
  width:100%;
  margin-top:8px;
  background:#090d0f;
  color:#d8e2df;
  border:1px solid var(--line);
  padding:10px;
  resize:vertical
}

.export button{
  margin-top:8px;
  background:transparent;
  border:1px solid var(--cyan);
  color:var(--cyan);
  padding:9px 11px;
  display:flex;
  gap:7px;
  align-items:center
}

footer{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.12em;
  padding:22px 0 4px
}

@media(max-width:900px){
  .hero{
    grid-template-columns:1fr
  }

  .meters{
    grid-template-columns:1fr
  }

  .grid{
    grid-template-columns:1fr
  }
}

@media(max-width:560px){
  .topbar{
    padding-left:14px;
    padding-right:14px
  }

  .topmeta span:first-child{
    display:none
  }

  .wrap{
    padding:18px 14px 26px
  }

  .hero{
    padding-top:12px
  }

  .hero-actions .btn{
    flex:1;
    justify-content:center
  }

  .burro-card{
    order:2
  }

  .wheel-wrap{
    width:280px;
    height:280px
  }

  .wheel .node{
    transform-origin:center
  }

  .loglist{
    max-height:380px
  }

  footer{
    flex-direction:column;
    gap:6px
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#07090b;
    --surface:#10161a;
    --text:#eef3f1
  }
}
