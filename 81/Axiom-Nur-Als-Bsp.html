:root{
  --bg:#050509;
  --surface:#0d0d18;
  --surface2:#121222;
  --line:#3b2c55;
  --ink:#f2edf8;
  --muted:#aaa6bd;
  --gold:#F2C94C;
  --teal:#80CBC4;
  --violet:#CE93D8;
  --violet-strong:#a55fc0;
}

*{
  box-sizing:border-box
}

html{
  background:var(--bg);
  color:var(--ink)
}

body{
  margin:0;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  background:var(--bg)
}

button{
  font:inherit
}

.app-shell{
  min-height:100vh;
  background:radial-gradient(circle at 88% 0,rgba(206,147,216,.14),transparent 34%),var(--bg);
  padding-top:var(--safe-area-inset-top)
}

.top-strip{
  max-width:1280px;
  margin:0 auto;
  padding:10px 18px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  color:#fff;
  font-size:11px;
  letter-spacing:.16em;
  font-weight:800
}

.top-strip span:nth-child(2){
  color:var(--teal)
}

main{
  width:min(1280px,100%);
  margin:0 auto;
  padding:10px 18px 34px
}

.banner{
  border:2px dashed var(--violet);
  background:linear-gradient(120deg,rgba(206,147,216,.22),rgba(128,203,196,.08) 58%,rgba(242,201,76,.05));
  padding:34px;
  display:flex;
  justify-content:space-between;
  gap:28px;
  overflow:hidden
}

.eyebrow{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--violet);
  font-size:11px;
  letter-spacing:.2em;
  font-weight:800
}

.banner h1{
  font-size:clamp(38px,6vw,74px);
  line-height:.92;
  letter-spacing:-.04em;
  margin:15px 0;
  color:#fff
}

.banner h1 em{
  font-style:normal;
  color:var(--violet);
  font-size:.62em
}

.banner p{
  max-width:620px;
  color:#ddd7e9;
  line-height:1.6
}

.banner-actions{
  display:flex;
  align-items:center;
  gap:18px;
  margin-top:22px
}

.banner-actions button{
  border:1px solid var(--gold);
  background:var(--gold);
  color:#17120a;
  padding:11px 14px;
  font-weight:800;
  cursor:pointer
}

.banner-actions button:hover{
  background:#fff;
  border-color:#fff
}

.banner-actions span{
  color:var(--teal);
  font-size:12px;
  letter-spacing:.14em
}

.form-card{
  min-width:215px;
  background:#080810;
  border:1px solid var(--violet);
  padding:18px;
  display:flex;
  flex-direction:column
}

.form-card>span{
  color:var(--violet);
  font-size:10px;
  letter-spacing:.2em
}

.form-card strong{
  font-size:30px;
  line-height:1.15;
  color:#fff;
  margin:18px 0 8px
}

.form-card small{
  color:var(--gold);
  font-size:15px
}

.form-note{
  margin-top:auto;
  padding-top:16px;
  border-top:1px dashed #4b3d63;
  color:var(--muted);
  font-size:11px;
  line-height:1.6
}

.notice{
  margin:16px 0 28px;
  border-left:3px solid var(--teal);
  background:#0c1717;
  padding:12px 14px;
  color:#dceeee;
  font-size:13px
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--teal);
  margin-right:8px
}

.section-head,.score-head,.group-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:15px
}

.kicker{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--gold);
  font-size:11px;
  letter-spacing:.18em;
  font-weight:800;
  margin:0 0 7px
}

.section-head h2,.score-head h2,.group-head h2{
  font-size:24px;
  margin:0;
  color:#fff
}

.section-head>p,.score-head>p{
  max-width:390px;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  margin:0;
  text-align:right
}

.nine-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:11px
}

.tile{
  position:relative;
  min-height:180px;
  border:1px dashed var(--violet);
  background:var(--surface);
  color:var(--ink);
  padding:22px 16px 14px;
  text-align:left;
  display:flex;
  flex-direction:column;
  justify-content:center;
  cursor:pointer;
  overflow:hidden
}

.tile:hover,.tile.is-active{
  border-style:solid;
  background:#1a1429;
  box-shadow:0 0 0 2px rgba(206,147,216,.28)
}

.tile.gap{
  border-color:#514464;
  background:repeating-linear-gradient(0deg,transparent 0 11px,rgba(255,255,255,.025) 11px 12px),#080810
}

.bsp-badge{
  position:absolute;
  right:10px;
  top:10px;
  background:var(--violet);
  color:#170b1d;
  font-size:9px;
  letter-spacing:.14em;
  font-weight:900;
  padding:5px 7px
}

.bsp-badge.static{
  position:static;
  align-self:flex-start
}

.tile .pos{
  position:absolute;
  left:14px;
  top:12px;
  color:var(--teal);
  font-size:10px;
  letter-spacing:.16em
}

.tile>strong{
  font-size:21px;
  color:#fff;
  margin-top:18px
}

.tile>span:not(.bsp-badge):not(.pos){
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
  margin-top:5px
}

.tile .filename{
  color:#eee;
  word-break:break-all
}

.tile-link{
  margin-top:16px!important;
  color:var(--gold)!important;
  display:flex;
  align-items:center;
  gap:4px;
  font-weight:800
}

.detail{
  margin:14px 0 34px;
  border:1px solid #2d4a47;
  background:#0a1314;
  padding:18px;
  display:flex;
  justify-content:space-between;
  gap:20px
}

.detail h3{
  font-size:20px;
  margin:0 0 6px
}

.detail p{
  color:var(--muted);
  margin:0;
  line-height:1.5
}

.detail-meta{
  text-align:right
}

.detail-meta span{
  display:block;
  color:var(--muted);
  font-size:10px
}

.detail-meta strong{
  color:var(--violet)
}

.groups{
  display:grid;
  grid-template-columns:1fr 1.35fr 1fr;
  gap:14px
}

.group{
  border-top:2px solid var(--violet);
  padding-top:14px
}

.group .count{
  border:1px dashed var(--violet);
  color:var(--violet);
  padding:6px 8px;
  font-size:10px;
  height:-moz-fit-content;
  height:fit-content
}

.mini-card{
  position:relative;
  border:1px dashed var(--violet);
  background:var(--surface2);
  padding:18px;
  min-height:180px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end
}

.mini-card h3{
  font-size:15px;
  line-height:1.3;
  word-break:break-all;
  margin:8px 0;
  color:#fff
}

.mini-card p{
  font-size:11px;
  line-height:1.5;
  color:var(--muted);
  margin:0
}

.mini-card>span:last-child{
  color:var(--gold);
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:14px;
  font-size:11px
}

.mini-kicker{
  color:var(--teal)!important;
  font-size:9px!important;
  letter-spacing:.16em
}

.example-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}

.data-list{
  display:grid;
  gap:10px
}

.mini-card.data{
  flex-direction:row;
  align-items:center;
  justify-content:flex-start;
  gap:14px;
  min-height:102px;
  color:var(--teal)
}

.mini-card.data h3{
  font-size:13px
}

.mini-card.data .bsp-badge{
  position:absolute
}

.scoreboard{
  margin-top:38px;
  border:1px solid var(--line);
  background:#0c0c18;
  padding:20px
}

.score-head{
  margin-bottom:12px
}

.table-wrap{
  overflow-x:auto
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
  min-width:680px
}

th{
  color:var(--muted);
  text-align:left;
  padding:11px 8px;
  border-bottom:1px solid var(--line);
  font-size:10px;
  letter-spacing:.12em
}

td{
  padding:13px 8px;
  border-bottom:1px solid #222236;
  word-break:break-all
}

td.rank{
  color:var(--gold);
  font-weight:900
}

.rank span{
  display:block;
  color:var(--violet);
  font-size:9px;
  margin-top:3px
}

.pos-cell{
  color:var(--teal)
}

.pos-cell span{
  display:block;
  color:var(--violet);
  font-size:9px
}

.best{
  background:rgba(206,147,216,.09)
}

td strong{
  color:#fff
}

.score-foot{
  display:flex;
  justify-content:space-between;
  gap:12px;
  color:var(--muted);
  font-size:11px;
  padding-top:14px;
  flex-wrap:wrap
}

footer{
  margin-top:26px;
  border-top:1px solid var(--line);
  padding:16px 0;
  display:flex;
  justify-content:space-between;
  gap:16px;
  color:var(--muted);
  font-size:11px
}

@media (max-width:900px){
  .groups{
    grid-template-columns:1fr
  }

  .example-grid{
    grid-template-columns:1fr
  }

  .banner{
    flex-direction:column;
    padding:24px
  }

  .form-card{
    min-width:0
  }

  .section-head,.score-head,.group-head{
    align-items:start;
    flex-direction:column
  }

  .section-head>p{
    text-align:left
  }
}

@media (max-width:600px){
  main{
    padding-left:12px;
    padding-right:12px
  }

  .top-strip{
    font-size:8px;
    gap:6px
  }

  .top-strip span:nth-child(2){
    display:none
  }

  .banner{
    padding:18px
  }

  .banner h1{
    font-size:42px
  }

  .banner-actions{
    flex-wrap:wrap
  }

  .nine-grid{
    grid-template-columns:1fr 1fr
  }

  .tile{
    min-height:172px;
    padding:22px 12px 12px
  }

  .tile>strong{
    font-size:17px
  }

  .tile .filename{
    font-size:9px
  }

  .detail{
    flex-direction:column
  }

  .scoreboard{
    padding:12px
  }

  .score-foot{
    flex-direction:column
  }

  footer{
    flex-direction:column
  }

  .tile:last-child{
    grid-column:1/-1
  }
}

@media (prefers-color-scheme:dark){
  :root{
    --bg:#050509;
    --surface:#0d0d18
  }
}
