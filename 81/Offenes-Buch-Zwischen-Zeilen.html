:root {
  --bg: #050805;
  --surface: #0a100a;
  --surface-2: #0e180e;
  --line: #243324;
  --ink: #e8f3e5;
  --dim: #8da68d;
  --gold: #fd3;
  --cyan: #3fd;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050805;
    --surface: #0a100a;
  }
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

button, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.shell {
  min-height: 100vh;
  padding: max(var(--safe-area-inset-top), 22px) 18px 28px;
  background: radial-gradient(circle at 88% 0, rgba(255,221,51,.08), transparent 28%), var(--bg);
  overflow-x: clip;
}

.top {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  border-bottom: 2px solid var(--gold);
  padding: 16px 0 20px;
}

.eyebrow {
  color: var(--cyan);
  font-size: 11px;
  letter-spacing: .18em;
  margin: 0 0 8px;
}

h1 {
  font-size: clamp(42px, 7vw, 78px);
  line-height: .86;
  letter-spacing: -.06em;
  margin: 0;
  color: #fff;
}

.subtitle {
  color: var(--gold);
  margin: 12px 0 0;
  font-size: 15px;
}

.seal {
  width: 76px;
  height: 76px;
  border: 1px solid var(--gold);
  border-radius: 50%;
  display: grid;
  place-content: center;
  text-align: center;
  flex: 0 0 auto;
  transform: rotate(5deg);
}

.seal span {
  font-size: 32px;
  color: var(--gold);
  line-height: 1;
}

.seal small {
  font-size: 7px;
  letter-spacing: .16em;
  color: var(--dim);
}

.intro {
  max-width: 1280px;
  margin: 18px auto 0;
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  justify-content: space-between;
  align-items: center;
}

.intro > p {
  margin: 0;
  font-size: 14px;
}

.layers-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  font-size: 11px;
  color: var(--dim);
}

.gold {
  color: var(--gold);
}

.cyan {
  color: var(--cyan);
}

.grid {
  max-width: 1280px;
  margin: 20px auto 0;
  display: grid;
  grid-template-columns: minmax(0, .9fr) minmax(0, 1.35fr);
  gap: 16px;
  align-items: start;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 18px;
  min-width: 0;
}

.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
  margin-bottom: 15px;
}

.panel-head h2 {
  margin: 0;
  font-size: 14px;
  letter-spacing: .12em;
  color: var(--gold);
}

.panel-head span {
  font-size: 11px;
  color: var(--dim);
  text-align: right;
}

label {
  display: block;
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--cyan);
  margin: 14px 0 7px;
}

textarea {
  width: 100%;
  resize: vertical;
  background: #040704;
  color: var(--ink);
  border: 1px solid var(--line);
  padding: 11px;
  outline: none;
  line-height: 1.5;
}

textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(255,221,51,.12);
}

.hint {
  font-size: 11px;
  line-height: 1.6;
  color: var(--dim);
  margin: 10px 0;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 14px 0;
}

button {
  border: 1px solid var(--line);
  background: #101a10;
  color: var(--ink);
  padding: 10px 12px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

button:hover {
  border-color: var(--gold);
}

.primary {
  background: var(--gold);
  color: #111;
  border-color: var(--gold);
  font-weight: 800;
}

.primary:hover {
  background: #ffe94d;
}

.toggles {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  padding-top: 13px;
  border-top: 1px dashed var(--line);
}

.layer-btn {
  font-size: 11px;
  padding: 8px 9px;
}

.layer-btn.active {
  color: var(--gold);
  border-color: rgba(255,221,51,.6);
}

.layer-btn.plain {
  color: #fff;
}

.layer-btn.all {
  color: var(--cyan);
  border-color: rgba(51,255,221,.5);
}

.explain {
  margin-top: 18px;
  background: var(--surface-2);
  border-left: 3px solid var(--gold);
  padding: 14px;
  display: flex;
  gap: 10px;
  color: var(--gold);
}

.explain p {
  margin: 0;
  font-size: 13px;
  line-height: 1.65;
}

.book-panel {
  padding-bottom: 12px;
}

.book-page {
  min-height: 360px;
  background: #071007;
  border: 1px solid #263b26;
  padding: 28px 24px 18px;
  box-shadow: 0 18px 50px rgba(0,0,0,.35);
}

.closed-note {
  min-height: 220px;
  display: grid;
  place-content: center;
  text-align: center;
  color: var(--dim);
}

.closed-note p {
  color: #fff;
  font-size: 22px;
  margin: 0 0 6px;
}

.closed-note span {
  font-size: 12px;
}

.line-block {
  margin: 14px 0;
}

.above, .below, .between {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: baseline;
  font-size: 11px;
  min-height: 18px;
}

.above {
  color: var(--cyan);
}

.below {
  color: var(--dim);
}

.tag {
  font-size: 8px;
  letter-spacing: .14em;
  border: 1px solid var(--line);
  padding: 3px 5px;
  color: var(--dim);
  white-space: nowrap;
}

.visible-line {
  font-size: clamp(20px, 3vw, 29px);
  line-height: 1.35;
  margin: 8px 0;
  color: #fff;
  overflow-wrap: anywhere;
}

.between {
  margin: 4px 0 5px;
}

.triplets {
  color: var(--gold);
  font-size: 15px;
  letter-spacing: .12em;
  overflow-wrap: anywhere;
}

.line-rule {
  height: 1px;
  background: #1b2c1b;
  margin-top: 20px;
}

.page-foot {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 22px;
  border-top: 1px solid var(--line);
  padding-top: 13px;
  font-size: 11px;
  color: var(--dim);
}

.ok {
  color: var(--cyan);
}

.key-ring {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  padding: 14px 2px 4px;
  font-size: 11px;
  color: var(--dim);
}

.key-ring > div {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.key-ring b {
  width: 24px;
  height: 24px;
  display: grid;
  place-content: center;
  border: 1px solid var(--line);
  color: var(--ink);
  font-size: 11px;
}

.key-ring b.active {
  border-color: var(--gold);
  color: var(--gold);
}

.decode-intro {
  font-size: 12px;
  line-height: 1.6;
  color: var(--dim);
  margin: 0;
}

.decoded {
  min-height: 92px;
  border: 1px solid var(--line);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.decoded.filled {
  border-color: var(--cyan);
}

.decoded strong {
  font-size: 20px;
  color: var(--cyan);
  overflow-wrap: anywhere;
}

.decoded small {
  color: var(--dim);
  font-size: 11px;
}

.formula {
  margin-top: 14px;
  border-top: 1px dashed var(--line);
  padding-top: 12px;
  font-size: 11px;
  line-height: 1.7;
  color: var(--dim);
}

.formula p {
  margin: 0;
}

.formula b {
  color: var(--ink);
}

.log-panel {
  grid-column: 1 / -1;
}

.log {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 24px;
}

.log li {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid #162216;
  font-size: 12px;
}

.log time {
  color: var(--gold);
}

.log span {
  color: var(--dim);
}

@media (max-width: 760px) {
  .shell {
    padding-left: 12px;
    padding-right: 12px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .top {
    align-items: center;
  }

  .seal {
    width: 58px;
    height: 58px;
  }

  .seal span {
    font-size: 25px;
  }

  .book-page {
    padding: 22px 15px 16px;
  }

  .log {
