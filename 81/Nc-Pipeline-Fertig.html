:root{
  --bg:#05080c;
  --surface:#0a1118;
  --surface2:#0d1821;
  --line:#243241;
  --text:#f2ede5;
  --muted:#95a5ad;
  --gold:#f7c45a;
  --orange:#ff6a21;
  --red:#ff2e30;
  --green:#49d983;
}

*{
  box-sizing:border-box
}

html{
  background:var(--bg)
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace
}

button{
  font:inherit
}

.shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 14px 18px;
  max-width:1080px;
  margin:auto;
  position:relative;
  overflow-x:clip
}

.shell:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle at 88% 0,rgba(255,60,25,.19),transparent 28%),radial-gradient(circle at 8% 15%,rgba(247,196,90,.08),transparent 22%)
}

.top{
  padding:22px 2px 18px;
  border-bottom:1px solid var(--line);
  position:relative
}

.eyebrow{
  font-size:11px;
  letter-spacing:.18em;
  color:var(--gold);
  display:flex;
  align-items:center;
  gap:8px
}

.eyebrow em{
  font-style:normal;
  color:#fff;
  background:var(--red);
  padding:3px 6px;
  border-radius:99px
}

.live{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 5px rgba(73,217,131,.14)
}

h1{
  font-size:clamp(31px,7vw,58px);
  line-height:.98;
  letter-spacing:-.055em;
  margin:14px 0 4px
}

.top p{
  font-size:clamp(15px,3.5vw,25px);
  color:#e8d9b8;
  margin:0;
  line-height:1.25
}

.top p span{
  color:var(--orange)
}

.sub{
  margin-top:17px;
  display:inline-block;
  background:#172332;
  border:1px solid #344658;
  color:#c8d7df;
  padding:8px 10px;
  border-radius:4px;
  font-size:12px
}

.volcano{
  position:absolute;
  right:18px;
  top:calc(var(--safe-area-inset-top) + 18px);
  width:76px;
  height:50px;
  overflow:hidden;
  opacity:.9
}

.volcano span{
  position:absolute;
  bottom:0;
  left:12px;
  color:var(--red);
  font-size:50px;
  line-height:1;
  text-shadow:0 0 22px var(--orange)
}

.volcano i{
  position:absolute;
  width:8px;
  height:8px;
  background:var(--gold);
  border-radius:50%;
  left:35px;
  top:3px;
  box-shadow:0 0 18px 5px var(--orange)
}

.volcano b{
  position:absolute;
  width:20px;
  height:4px;
  background:var(--orange);
  left:28px;
  top:14px;
  transform:rotate(-20deg);
  filter:blur(1px)
}

.status{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:16px 0
}

.card{
  border:1px solid var(--line);
  background:linear-gradient(145deg,#0b141c,#0a0f13);
  padding:15px;
  min-height:112px;
  position:relative;
  overflow:hidden
}

.card:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  background:var(--green)
}

.card.gold:before{
  background:var(--gold)
}

.card.hype:before{
  background:var(--orange)
}

.card-top{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.13em
}

.card strong{
  display:block;
  font-size:34px;
  margin:20px 0 2px;
  letter-spacing:-.06em
}

.card p{
  margin:0;
  font-size:11px;
  line-height:1.45;
  color:#c4cfd2
}

.card.green{
  box-shadow:0 0 0 1px rgba(73,217,131,.12)
}

.card.hype{
  box-shadow:0 0 24px rgba(255,106,33,.09)
}

.pulse-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--green);
  animation:pulse 1.6s infinite
}

@keyframes pulse{
  50%{
    transform:scale(1.5);
    opacity:.45
  }
}

.layout{
  display:grid;
  grid-template-columns:1.55fr .95fr;
  gap:12px;
  align-items:start
}

.panel{
  border:1px solid var(--line);
  background:var(--surface);
  box-shadow:0 18px 45px rgba(0,0,0,.2)
}

.section-head{
  padding:14px 14px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--line)
}

.section-head>span:first-child{
  font-weight:800;
  letter-spacing:.12em;
  font-size:12px
}

.section-head small{
  color:var(--muted);
  font-size:10px
}

.count{
  margin-left:auto;
  color:#111;
  background:var(--gold);
  padding:4px 7px;
  font-weight:800;
  border-radius:99px
}

.steps{
  list-style:none;
  margin:0;
  padding:6px
}

.steps li{
  display:grid;
  grid-template-columns:32px 58px 1fr 20px;
  gap:9px;
  align-items:center;
  padding:11px 8px;
  border-bottom:1px solid #152029;
  transition:.2s
}

.steps li:last-child{
  border-bottom:0
}

.index{
  color:var(--gold);
  font-size:10px
}

.steps time{
  color:var(--muted);
  font-size:10px
}

.steps b{
  display:block;
  color:#fff;
  font-size:13px
}

.steps div span{
  display:block;
  color:#9db0b6;
  font-size:11px;
  margin-top:2px;
  line-height:1.4
}

.check{
  color:var(--green);
  font-style:normal
}

.steps li.flash{
  background:linear-gradient(90deg,rgba(255,46,48,.26),rgba(247,196,90,.18));
  border-left:3px solid var(--orange);
  box-shadow:inset 0 0 25px rgba(255,106,33,.12)
}

.fire{
  margin:13px;
  width:calc(100% - 26px);
  border:0;
  background:linear-gradient(90deg,#ff2e30,#ff6a21);
  color:white;
  padding:13px 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  font-weight:900;
  letter-spacing:.05em;
  cursor:pointer
}

.fire:hover{
  filter:brightness(1.12)
}

.fire:disabled{
  opacity:.75;
  cursor:wait
}

.fire small{
  display:block;
  font-weight:400;
  font-size:10px;
  color:#ffe2c7;
  text-align:left
}

.spin{
  animation:spin 1s linear infinite
}

@keyframes spin{
  to{
    transform:rotate(360deg)
  }
}

.replay-note{
  margin:-3px 14px 14px;
  color:var(--muted);
  font-size:10px
}

.side{
  display:grid;
  gap:12px
}

.log{
  padding:8px 14px
}

.log-line{
  display:grid;
  grid-template-columns:52px 1fr;
  gap:8px;
  padding:10px 0;
  border-bottom:1px dashed #1f303c;
  font-size:11px;
  line-height:1.45;
  color:#c9d4d7
}

.log-line:last-child{
  border:0
}

.log-line time{
  color:var(--muted)
}

.gold-line{
  color:var(--gold);
  font-weight:800
}

.log-foot{
  padding:10px 14px;
  border-top:1px solid var(--line);
  font-size:10px;
  color:var(--muted)
}

.torso{
  padding-bottom:14px
}

.torso-lead{
  padding:13px 14px 0;
  margin:0;
  color:#ffe1a5
}

.torso-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:13px 14px
}

.torso-grid div{
  border:1px solid #30404b;
  background:var(--surface2);
  padding:11px
}

.torso-grid div:last-child{
  grid-column:span 2
}

.torso-grid small{
  display:block;
  color:var(--gold);
  font-size:9px;
  letter-spacing:.12em
}

.torso-grid strong{
  display:block;
  margin-top:6px;
  font-size:14px
}

.torso-grid strong span{
  color:var(--muted);
  font-weight:400
}

.torso-text{
  padding:0 14px;
  color:#aebdc1;
  font-size:11px;
  line-height:1.6;
  margin:0
}

.formula{
  margin:13px 14px 0;
  padding:11px;
  background:#231407;
  border:1px solid #69401c;
  color:var(--gold);
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:800
}

footer{
  margin-top:14px;
  padding:16px 2px 8px;
  border-top:1px solid var(--line);
  font-size:11px;
  line-height:1.6;
  color:var(--muted)
}

footer b{
  color:#fff
}

@media(max-width:700px){
  .shell{
    padding-left:11px;
    padding-right:11px
  }

  .volcano{
    width:54px;
    height:36px;
    right:11px
  }

  .volcano span{
    font-size:35px;
    left:8px
  }

  .volcano i{
    left:24px
  }

  .volcano b{
    left:19px
  }

  .status{
    gap:7px
  }

  .card{
    padding:11px;
    min-height:106px
  }

  .card strong{
    font-size:28px;
    margin-top:14px
  }

  .card p{
    font-size:10px
  }

  .card-top{
    font-size:9px
  }

  .layout{
    grid-template-columns:1fr
  }

  .steps li{
    grid-template-columns:28px 50px 1fr 16px;
    gap:7px
  }

  .steps b{
    font-size:12px
  }

  .section-head small{
    display:none
  }

  .top{
    padding-top:16px
  }
}

@media(max-width:390px){
  h1{
    font-size:30px
  }

  .card{
    padding:9px
  }

  .card strong{
    font-size:24px
  }

  .status{
    gap:5px
  }

  .steps li{
    padding:10px 5px
  }

  .log-line{
    grid-template-columns:45px 1fr
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#05080c;
    --surface:#0a1118;
    --surface2:#0d1821;
    --text:#f2ede5
  }
}
