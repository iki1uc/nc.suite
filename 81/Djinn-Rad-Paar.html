    --surface-2:#120726;
  }

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  min-height:100%
}

body{
  background:var(--surface);
  color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:clip
}

button,input,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.mono{
  font-family:ui-monospace,Menlo,Consolas,monospace
}

@keyframes floatY{
  0%,100%{
    transform:translateY(0) rotate(-3deg)
  }

  50%{
    transform:translateY(-14px) rotate(3deg)
  }
}

@keyframes glow{
  0%,100%{
    filter:drop-shadow(0 0 14px rgba(255,215,0,.55))
  }

  50%{
    filter:drop-shadow(0 0 28px rgba(255,215,0,.95))
  }
}

@keyframes twinkle{
  0%,100%{
    opacity:.2
  }

  50%{
    opacity:1
  }
}

@keyframes puff{
  0%{
    transform:translate(-50%,0) scale(.5);
    opacity:0
  }

  20%{
    opacity:.7
  }

  100%{
    transform:translate(-50%,-150px) scale(2);
    opacity:0
  }
}

@keyframes pop{
  0%{
    transform:scale(.86);
    opacity:0
  }

  100%{
    transform:scale(1);
    opacity:1
  }
}

@keyframes gem{
  0%,100%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.14)
  }
}

@keyframes shimmer{
  0%{
    transform:translateX(-100%)
  }

  100%{
    transform:translateX(100%)
  }
}

@keyframes sparkFly{
  0%{
    transform:translate(0,0) scale(.5) rotate(0);
    opacity:1
  }

  100%{
    transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(540deg);
    opacity:0
  }
}

@keyframes flashOut{
  to{
    opacity:0
  }
}

@keyframes pulseRose{
  0%,100%{
    box-shadow:0 0 10px var(--rose)
  }

  50%{
    box-shadow:0 0 24px var(--rose)
  }
}

.sparkle{
  position:fixed;
  pointer-events:none;
  z-index:90;
  font-size:20px;
  animation:sparkFly 1.3s ease-out forwards
}

.flash{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:95;
  background:radial-gradient(circle,rgba(255,215,0,.68) 0%,rgba(168,85,247,.28) 32%,transparent 70%);
  animation:flashOut .9s ease-out forwards
}

.djinn{
  animation:floatY 4s ease-in-out infinite
}

.lampSvg{
  animation:glow 3s ease-in-out infinite
}

.pop{
  animation:pop .35s ease-out
}

.shimmer{
  position:relative;
  overflow:hidden
}

.shimmer::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:shimmer 2s linear infinite
}

.scroll-thin::-webkit-scrollbar{
  width:6px;
  height:6px
}

.scroll-thin::-webkit-scrollbar-thumb{
  background:rgba(255,215,0,.32);
  border-radius:3px
