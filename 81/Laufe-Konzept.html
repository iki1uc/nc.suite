  color: rgb(154 163 154 / var(--tw-text-opacity, 1));
}

.text-\[\#d6e0d0\]{
  --tw-text-opacity: 1;
  color: rgb(214 224 208 / var(--tw-text-opacity, 1));
}

.text-\[var\(--gold\)\]{
  color: var(--gold);
}

.text-\[var\(--green\)\]{
  color: var(--green);
}

.text-\[var\(--muted\)\]{
  color: var(--muted);
}

.text-\[var\(--red\)\]{
  color: var(--red);
}

.text-\[var\(--text\)\]{
  color: var(--text);
}

.text-black{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.text-white{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.accent-\[\#f2c94c\]{
  accent-color: #f2c94c;
}

.opacity-70{
  opacity: 0.7;
}

.opacity-80{
  opacity: 0.8;
}

.shadow-xl{
  --tw-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
  --tw-shadow-colored: 0 20px 25px -5px var(--tw-shadow-color), 0 8px 10px -6px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.ring-4{
  --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);
  --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(4px + var(--tw-ring-offset-width)) var(--tw-ring-color);
  box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
}

.ring-white\/60{
  --tw-ring-color: rgb(255 255 255 / 0.6);
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.transition{
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-all{
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.duration-500{
  transition-duration: 500ms;
}

:root{
  --bg:#050805;
  --surface:#0b120c;
  --surface2:#111b12;
  --line:#2a3a28;
  --gold:#f2c94c;
  --text:#eef3e6;
  --muted:#9db09a;
  --red:#ff4d4d;
  --green:#4ade80;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#050805;
    --surface:#0b120c;
    --text:#eef3e6;
  }
}

*{
  box-sizing:border-box;
}

html{
  background:var(--bg);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

button{
  font-family:inherit;
}

@keyframes twinkle{
  0%,100%{
    opacity:.25
  }

  50%{
    opacity:1
  }
}

@keyframes drift{
  from{
    transform:translateX(-2%)
  }

  to{
    transform:translateX(2%)
  }
}

@keyframes hissPulse{
  0%,100%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.03)
  }
}

@keyframes spinSlow{
  to{
    transform:rotate(360deg)
  }
}

.stars{
  background-image:radial-gradient(1px 1px at 20px 30px, #fff 50%, transparent), radial-gradient(1px 1px at 90px 80px, var(--gold) 50%, transparent), radial-gradient(2px 2px at 160px 40px, #fff 50%, transparent), radial-gradient(1px 1px at 240px 110px, #fff 50%, transparent), radial-gradient(1px 1px at 320px 30px, var(--gold) 50%, transparent);
  background-size:360px 160px;
  animation:twinkle 3.2s infinite;
}

.nebula{
  background:radial-gradient(ellipse at 18% 18%, rgba(242,201,76,.22), transparent 42%), radial-gradient(ellipse at 82% 72%, rgba(56,189,248,.16), transparent 45%), radial-gradient(ellipse at 62% 18%, rgba(168,85,247,.18), transparent 40%);
  animation:drift 9s ease-in-out infinite alternate;
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}

@media (min-width: 640px){
  .sm\:mt-3{
    margin-top: 0.75rem;
  }

  .sm\:block{
    display: block;
  }

  .sm\:hidden{
    display: none;
  }

  .sm\:h-11{
    height: 2.75rem;
  }

  .sm\:min-h-\[148px\]{
    min-height: 148px;
  }

  .sm\:w-11{
    width: 2.75rem;
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:gap-3{
    gap: 0.75rem;
  }

  .sm\:p-4{
    padding: 1rem;
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pt-7{
    padding-top: 1.75rem;
  }

  .sm\:text-2xl{
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .sm\:text-6xl{
    font-size: 3.75rem;
    line-height: 1;
  }

  .sm\:text-\[12px\]{
    font-size: 12px;
  }

  .sm\:text-\[13px\]{
    font-size: 13px;
  }

  .sm\:text-\[15px\]{
    font-size: 15px;
  }

  .sm\:text-\[44px\]{
    font-size: 44px;
  }

  .sm\:text-xs{
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 768px){
  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px){
  .lg\:grid-cols-\[1fr_300px\]{
    grid-template-columns: 1fr 300px;
  }
}
