:root {
  --bg: #000;
  --surface: #031105;
  --surface-2: #071a09;
  --green: #00ff41;
  --green-dim: #7df19e;
  --line: #167b32;
  --muted: #8da896;
}

* {
  box-sizing: border-box;
}

html {
  background: #000;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--green);
  font-family: "Courier New", Courier, monospace;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: .45;
}

.shell {
  min-height: 100vh;
  padding: var(--safe-area-inset-top) 18px 28px;
  max-width: 1160px;
  margin: 0 auto;
  background:
    linear-gradient(rgba(0,255,65,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,65,.035) 1px, transparent 1px),
    #000;
  background-size: 28px 28px;
}

.top {
  border-bottom: 2px solid var(--green);
  padding: 28px 0 18px;
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
}

.eyebrow {
  color: var(--green-dim);
  font-size: 12px;
  letter-spacing: .18em;
  margin: 0 0 9px;
}

h1 {
  font-size: clamp(25px, 4vw, 50px);
  line-height: .98;
  letter-spacing: -.04em;
  margin: 0;
}

.parents {
  max-width: 360px;
  margin: 0;
  line-height: 1.5;
  font-size: 14px;
}

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(280px, .75fr);
  gap: 22px;
  padding: 30px 0;
  border-bottom: 1px solid var(--line);
}

.section-label {
  margin: 0 0 16px;
  font-size: 12px;
  letter-spacing: .18em;
  color: var(--green-dim);
}

.big-output {
  font-size: clamp(30px, 5vw, 64px);
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: -.055em;
  word-break: break-all;
  text-shadow: 0 0 22px rgba(0,255,65,.28);
}

.formula {
  font-size: 20px;
  margin: 24px 0 7px;
}

.formula-detail {
  color: var(--green-dim);
  margin: 0;
  font-size: 17px;
  line-height: 1.6;
}

.formula-detail strong {
  color: var(--green);
}

.proof {
  margin: 22px 0 0;
  border-left: 3px solid var(--green);
  padding-left: 12px;
  font-weight: 700;
}

.controls {
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 20px;
  display: grid;
  gap: 20px;
  align-content: start;
}

.control {
  display: block;
}

.control-top {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 11px;
}

.control-top strong {
  font-size: 21px;
}

.control input[type="range"] {
  width: 100%;
  accent-color: var(--green);
}

.number-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 6px;
}

.number-row input {
  width: 88px;
  background: #000;
  border: 1px solid var(--line);
  color: var(--green);
  padding: 7px 8px;
  outline: none;
}

.number-row input:focus, button:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}

.zeugen-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.zeugen-actions button, .check-button, .run-button {
  border: 1px solid var(--green);
  background: #000;
  color: var(--green);
  padding: 11px;
  font-weight: 700;
}

.zeugen-actions button:hover, .check-button:hover, .run-button:hover {
  background: var(--green);
  color: #000;
}

.grid-two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-top: 18px;
}

.panel {
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 22px;
  min-width: 0;
}

.panel-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}

.panel-head h2 {
  margin: 0;
  font-size: 20px;
  letter-spacing: .04em;
}

.panel-head span {
  color: var(--muted);
  font-size: 12px;
  text-align: right;
}

.panel-intro {
  color: var(--green-dim);
  line-height: 1.55;
  margin: 0 0 16px;
}

.zeugen-list {
  border-top: 1px solid var(--line);
}

.zeugen-row {
  display: grid;
  grid-template-columns: 1fr 1.35fr auto;
  gap: 12px;
  align-items: center;
  padding: 13px 8px;
  border-bottom: 1px solid var(--line);
  color: var(--green-dim);
}

.zeugen-row.active {
  color: var(--green);
  background: rgba(0,255,65,.08);
  font-weight: 700;
}

.zeugen-row strong {
  font-size: 20px;
}

.note {
  color: var(--muted);
  line-height: 1.55;
  font-size: 13px;
}

.runner-visual {
  padding: 16px 0 8px;
}

.track {
  height: 2px;
  background: var(--line);
  position: relative;
  margin: 20px 8px 0;
}

.runner-dot {
  position: absolute;
  top: -13px;
  color: var(--green);
  font-size: 26px;
  transition: left .04s linear;
}

.track-labels {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
  margin-top: 15px;
}

.runner-line {
  font-weight: 700;
  font-size: 19px;
  margin: 18px 0 4px;
}

.step-line {
  min-height: 44px;
  margin: 0;
  color: var(--green-dim);
  line-height: 1.5;
}

.step-meta {
  display: flex;
  justify-content: space-between;
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin: 8px 0 16px;
}

.step-meta strong {
  font-size: 24px;
}

.run-button {
  width: 100%;
  padding: 14px;
  letter-spacing: .12em;
}

.arrival {
  background: rgba(0,255,65,.1);
  border: 1px solid var(--green);
  padding: 12px;
  margin: 14px 0 0;
  line-height: 1.5;
}

.parent-boxes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.parent-boxes > div {
  border: 1px solid var(--line);
  padding: 18px 14px;
  display: grid;
  gap: 8px;
}

.parent-boxes span {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .14em;
}

.parent-boxes strong {
  font-size: 18px;
  word-break: break-all;
}

.check-button {
  width: 100%;
  margin-top: 16px;
}

.check-result {
  min-height: 58px;
  color: var(--muted);
  line-height: 1.5;
}

.check-result.show {
  color: var(--green);
}

.station-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.station-part {
  border: 1px solid var(--line);
  background: #000;
  color: var(--green);
  padding: 18px 8px;
  display: grid;
  gap: 5px;
}

.station-part strong {
  font-size: 31px;
}

.station-part.selected {
  background: var(--green);
  color: #000;
}

.station-explain {
  min-height: 82px;
  line-height: 1.6;
  color: var(--green-dim);
  margin: 18px 0 0;
}

.ctrl-mini {
  margin-top: 18px;
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 22px;
}

.tool-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
}

.tool {
  min-height: 58px;
  border: 1px solid var(--line);
  background: #000;
  color: var(--green);
  padding: 11px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  text-align: left;
}

.tool.active {
  background: var(--green);
  color: #000;
}

.tool-detail {
  margin-top: 16px;
  border-top: 1px solid var(--line);
  padding-top: 16px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 22px;
  align-items: baseline;
}

.tool-detail p {
  margin: 0;
  color: var(--green-dim);
  line-height: 1.5;
}

.tool-detail small {
  color: var(--muted);
}

.output-box {
  margin-top: 18px;
  background: #010801;
  border: 2px solid var(--green);
  padding: 24px;
  box-shadow: 0 0 28px rgba(0,255,65,.12);
}

.output-head {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .15em;
  margin-bottom: 18px;
}

.output-box pre {
  margin: 0;
  font: inherit;
  font-size: clamp(20px, 4vw, 34px);
  font-weight: 700;
  overflow-wrap: anywhere;
}

.output-box > p {
  margin: 8px 0 0;
}

.output-note {
  color: var(--green-dim);
}

footer {
  border-top: 1px solid var(--line);
  margin-top: 26px;
  padding: 20px 0 0;
  color: var(--muted);
  line-height: 1.7;
  font-size: 13px;
}

@media (max-width: 700px) {
  .shell {
    padding-left: 13px;
    padding-right: 13px;
  }

  .top {
    display: block;
    padding-top: 20px;
  }

  .parents {
    margin-top: 16px;
  }

  .hero, .grid-two {
    grid-template-columns: 1fr;
  }

  .hero {
    padding: 22px 0;
  }

  .panel-head {
    display: block;
  }

  .panel-head span {
    display: block;
    margin-top: 5px;
    text-align: left;
  }

  .zeugen-row {
    grid-template-columns: 1fr auto;
  }

  .zeugen-row span:nth-child(2) {
    display: none;
  }

  .tool-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .tool-detail {
    grid-template-columns: 1fr;
    gap: 6px;
  }

  .parent-boxes {
    grid-template-columns: 1fr;
  }

  .station-explain {
    min-height: 110px;
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000;
    --green: #00ff41;
  }
}
