@media (prefers-color-scheme: dark){
  :root{
    --bg:#050805;
    --surface:#0b100b;
    --surface-2:#101a10;
    --line:#263324;
    --ink:#edf3ea;
    --muted:#9db39d;
  }
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--ink)
}

body{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

button:focus-visible,input:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px
}

@keyframes dropOut{
  0%{
    transform:translateY(0) rotate(0deg);
    opacity:1
  }

  55%{
    transform:translateY(18px) rotate(-1.2deg);
    opacity:.72
  }

  100%{
    transform:translateY(120px) rotate(3deg) scale(.94);
    opacity:0
  }
}

@keyframes popIn{
  from{
    transform:translateY(8px);
    opacity:0
  }

  to{
    transform:translateY(0);
    opacity:1
  }
}

@keyframes scanline{
  from{
    transform:translateX(-55%)
  }

  to{
    transform:translateX(55%)
  }
}

@keyframes pulseGold{
  0%,100%{
    box-shadow:0 0 0 0 rgba(242,201,76,.35)
  }

  50%{
    box-shadow:0 0 0 7px rgba(242,201,76,0)
  }
}

.module-drop{
  animation:dropOut .48s ease-in forwards
}

.module-in{
  animation:popIn .28s ease-out both
}

.scan-beam{
  animation:scanline 2.2s linear infinite
}

.placeholder\:text-\[var\(--muted\)\]::-moz-placeholder {
  color: var(--muted);
}

.placeholder\:text-\[var\(--muted\)\]::placeholder {
  color: var(--muted);
}

.hover\:bg-\[var\(--red\)\]:hover {
  background-color: var(--red);
}

.hover\:text-white:hover {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.hover\:brightness-110:hover {
  --tw-brightness: brightness(1.1);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

@media (min-width: 640px) {
  .sm\:inline {
    display: inline;
  }

  .sm\:hidden {
    display: none;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:gap-3 {
    gap: 0.75rem;
  }

  .sm\:p-4 {
    padding: 1rem;
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:py-4 {
    padding-top: 1rem;
    padding-bottom: 1rem;
  }

  .sm\:text-\[11px\] {
    font-size: 11px;
  }

  .sm\:text-\[13px\] {
    font-size: 13px;
  }

  .sm\:text-\[22px\] {
    font-size: 22px;
  }

  .sm\:text-\[44px\] {
    font-size: 44px;
  }

  .sm\:text-\[48px\] {
    font-size: 48px;
  }

  .sm\:text-\[64px\] {
    font-size: 64px;
  }

  .sm\:leading-snug {
    line-height: 1.375;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-\[1fr_1\.2fr\] {
    grid-template-columns: 1fr 1.2fr;
  }

  .lg\:flex-row {
    flex-direction: row;
  }

  .lg\:items-center {
    align-items: center;
  }
}
