  --gold:#f2c94c;
  --gold-dim:#a9851c;
  --paper:#f5edcf;
  --muted:#9daa84;
  --red:#e83b2f;
  --red-dark:#8f1710;
  --green:#7fc653;
}

@media (prefers-color-scheme: dark){
  :root{
    --ink:#050805;
    --surface:#0b100b;
    --surface-2:#111711;
    --line:#27311f;
    --gold:#f2c94c;
    --paper:#f5edcf;
    --muted:#9daa84;
  }
}

*{
  box-sizing:border-box
}

html{
  background:var(--ink)
}

body{
  margin:0;
  background:var(--ink);
  color:var(--paper);
  font-family:Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Narrow", sans-serif;
  letter-spacing:.02em
}

button{
  font:inherit
}

button:focus-visible{
  outline:3px solid var(--gold);
  outline-offset:3px
}

@keyframes ruck{
  0%{
    transform:scale(.95)
  }

  45%{
    transform:scale(1.05)
  }

  100%{
    transform:scale(1)
  }
}

@keyframes implode{
  0%{
    transform:scale(1)
  }

  18%{
    transform:scale(.92) translateY(3px)
  }

  52%{
    transform:scale(.42) translateY(18px)
  }

  78%{
    transform:scale(.08) translateY(30px)
  }

  100%{
    transform:scale(1) translateY(0)
  }
}

@keyframes puuftPop{
  0%{
    transform:scale(.55) rotate(-3deg);
    opacity:0
  }

  35%{
    transform:scale(1.14) rotate(1deg);
    opacity:1
  }

  62%{
    transform:scale(.97)
  }

  100%{
    transform:scale(1) rotate(0)
  }
}

@keyframes tick{
  from{
    transform:translateY(3px)
  }

  to{
    transform:translateY(0)
  }
}

.ruck{
  animation:ruck 120ms steps(3,end)
}

.imploding .nine-grid{
  animation:implode 620ms cubic-bezier(.9,0,.1,1) both
}

.puuft-pop{
  animation:puuftPop 240ms cubic-bezier(.9,0,.2,1) both
}

.log-enter{
  animation:tick 120ms steps(2,end)
}

.stage-line{
  position:relative
}

.stage-line:before{
  content:"";
  position:absolute;
  left:12px;
  right:12px;
  top:22px;
  height:3px;
  background:#26311e;
  z-index:0
}

@media(max-width:640px){
  .stage-line:before{
    display:none
  }
}

.hover\:border-\[var\(--gold\)\]:hover {
  border-color: var(--gold);
}

.hover\:bg-\[\#ffd95f\]:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(255 217 95 / var(--tw-bg-opacity, 1));
}

@media (min-width: 640px) {
  .sm\:col-span-1 {
    grid-column: span 1 / span 1;
  }

  .sm\:block {
    display: block;
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:items-center {
    align-items: center;
  }

  .sm\:justify-between {
    justify-content: space-between;
  }

  .sm\:gap-1 {
    gap: 0.25rem;
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pt-7 {
    padding-top: 1.75rem;
  }

  .sm\:text-6xl {
    font-size: 3.75rem;
    line-height: 1;
  }

  .sm\:text-7xl {
    font-size: 4.5rem;
    line-height: 1;
  }

  .sm\:text-base {
    font-size: 1rem;
    line-height: 1.5rem;
  }

  .sm\:text-lg {
    font-size: 1.125rem;
    line-height: 1.75rem;
  }

  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-\[1fr_360px\] {
    grid-template-columns: 1fr 360px;
  }

  .lg\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .lg\:text-7xl {
    font-size: 4.5rem;
    line-height: 1;
  }
}
