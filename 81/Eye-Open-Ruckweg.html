  }

    transform:scaleY(1)
  }
}

  0%,100%{
    box-shadow:0 0 28px rgba(34,230,255,.55),0 0 90px rgba(255,62,181,.22)
  }

  50%{
    box-shadow:0 0 45px rgba(34,230,255,.9),0 0 120px rgba(255,62,181,.38)
  }
}

  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-7px)
  }
}

@keyframes drift{
  0%{
    transform:translate(0,0)
  }

  50%{
    transform:translate(18px,-18px)
  }

  100%{
    transform:translate(0,0)
  }
}

@keyframes trailPop{
  0%{
    transform:scale(.4);
    opacity:.2
  }

  100%{
    transform:scale(1);
    opacity:1
  }
}

@keyframes scan{
  0%{
    top:-10%
  }

  100%{
    top:110%
  }
}

@keyframes breatheIn{
  0%{
    transform:scale(.68)
  }

  100%{
    transform:scale(1.18)
  }
}

  animation:pulseGlow 3.2s ease-in-out infinite
