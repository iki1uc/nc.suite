  }

    box-shadow:0 0 0 6px rgba(255,221,51,0)
  }
}

@keyframes blink{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.25
  }
}

@keyframes slideIn{
  from{
    opacity:0;
    transform:translateY(4px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.log-item{
  animation:slideIn .18s ease both
}

.spine{
  transition:transform .15s ease, filter .15s ease
}

.spine:hover{
  transform:translateY(-3px);
  filter:brightness(1.25)
}

.hover\:border-\[var\(--cyan\)\]:hover {
  border-color: var(--cyan);
}

.hover\:border-\[var\(--gold\)\]:hover {
  border-color: var(--gold);
}

.hover\:border-\[var\(--red\)\]:hover {
  border-color: var(--red);
}

.hover\:text-\[var\(--cyan\)\]:hover {
  color: var(--cyan);
}

.hover\:text-\[var\(--gold\)\]:hover {
  color: var(--gold);
}

.hover\:text-\[var\(--red\)\]:hover {
  color: var(--red);
}

.focus\:border-\[var\(--gold\)\]:focus {
  border-color: var(--gold);
}

@media (min-width: 640px) {
  .sm\:inline {
    display: inline;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:text-\[15px\] {
    font-size: 15px;
  }
}

@media (min-width: 1024px) {
  .lg\:max-h-\[520px\] {
    max-height: 520px;
  }

  .lg\:grid-cols-\[350px_minmax\(0\2c 1fr\)_320px\] {
    grid-template-columns: 350px minmax(0,1fr) 320px;
  }
}
