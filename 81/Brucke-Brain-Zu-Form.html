:root{
  --bg:#050509;
  --surface:#0d0d16;
  --surface2:#14141f;
  --line:#29293a;
  --gold:#F2C94C;
  --teal:#80CBC4;
  --purple:#CE93D8;
  --text:#f4f1e8;
  --muted:#a9a7b8;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#050509;
    --surface:#0d0d16;
    --surface2:#14141f;
    --line:#29293a;
    --text:#f4f1e8;
    --muted:#a9a7b8;
  }
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  min-width:0;
  background:var(--bg);
  color:var(--text)
}

body{
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:clip
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

.shell{
  min-height:100vh;
  width:100%;
  padding:var(--safe-area-inset-top) 18px 28px;
  background:radial-gradient(circle at 50% 0,rgba(242,201,76,.09),transparent 34%),var(--bg)
}

.top,.brainWrap,.middle,.layersSection,.scoreSection,footer{
  max-width:1240px;
  margin-left:auto;
  margin-right:auto
}

.top{
  padding:38px 0 24px;
  border-bottom:1px solid var(--line)
}

.eyebrow,.kicker{
  font-family:Arial,Helvetica,sans-serif;
  text-transform:uppercase;
  letter-spacing:.16em;
  font-size:11px;
  font-weight:800;
  color:var(--teal)
}

.eyebrow{
  display:flex;
  align-items:center;
  gap:8px
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 0 5px rgba(242,201,76,.12)
}

.titleRow{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-top:18px
}

h1{
  font-size:clamp(56px,10vw,112px);
  line-height:.78;
  letter-spacing:-.07em;
  margin:0;
  color:var(--gold)
}

.subtitle{
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  color:#e7e4d8;
  font-weight:700;
  margin:18px 0 0
}

.subtitle svg{
  color:var(--gold)
}

.liveBadge{
  font-family:Arial,Helvetica,sans-serif;
  border:1px solid #35554f;
  background:#0b1b19;
  color:var(--teal);
  padding:9px 11px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  white-space:nowrap
}

.pulse{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--teal);
  margin-right:7px;
  animation:pulse 1.8s infinite
}

@keyframes pulse{
  50%{
    opacity:.25;
    transform:scale(.7)
  }
}

.intro{
  max-width:780px;
  color:var(--muted);
  font-size:18px;
  line-height:1.55;
  margin:18px 0 0
}

.brainWrap{
  margin-top:22px;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:18px;
  overflow:hidden
}

.brainHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  border-bottom:1px solid var(--line)
}

.codeLabel{
  font-family:ui-monospace,monospace;
  color:var(--purple);
  font-weight:800
}

.file{
  color:var(--muted);
  font-size:13px
}

.miniBtn{
  border:1px solid var(--gold);
  background:transparent;
  color:var(--gold);
  border-radius:999px;
  padding:7px 11px;
  font-family:Arial,sans-serif;
  font-size:12px;
  font-weight:800
}

.miniBtn:hover{
  background:var(--gold);
  color:#111
}

.code{
  margin:0;
  padding:20px 18px 12px;
  overflow-x:auto;
  font-family:ui-monospace,SFMono-Regular,monospace;
  font-size:13px;
  line-height:1.75;
  color:#e8e4d4;
  white-space:pre
}

.brainChips{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding:0 18px 18px
}

.brainChips span{
  font-family:Arial,sans-serif;
  font-size:12px;
  color:var(--muted);
  background:var(--surface2);
  border:1px solid var(--line);
  padding:7px 9px;
  border-radius:999px
}

.brainChips b{
  color:var(--text)
}

.middle{
  display:grid;
  grid-template-columns:minmax(0,1.35fr) minmax(300px,.75fr);
  gap:18px;
  margin-top:18px
}

.gridSection,.bridge,.layersSection,.scoreSection{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:18px;
  padding:20px
}

.sectionHead{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px
}

.sectionHead h2{
  font-size:30px;
  margin:5px 0 4px;
  line-height:1
}

.sectionHead p{
  color:var(--muted);
  font-size:14px;
  margin:0;
  line-height:1.4
}

.toggle{
  border:1px solid var(--teal);
  background:transparent;
  color:var(--teal);
  border-radius:999px;
  padding:8px 10px;
  display:flex;
  gap:6px;
  align-items:center;
  font-family:Arial,sans-serif;
  font-size:12px;
  font-weight:800;
  white-space:nowrap
}

.toggle.on{
  background:var(--teal);
  color:#07100f
}

.archWrap{
  position:relative;
  height:62px;
  margin:18px 0 2px
}

.archWrap svg{
  width:100%;
  height:100%;
  overflow:visible
}

.archWrap path{
  fill:none;
  stroke:var(--gold);
  stroke-width:3;
  stroke-linecap:round
}

.archWrap .archInner{
  stroke:var(--teal);
  stroke-width:1.5;
  stroke-dasharray:5 5
}

.archLabel{
  position:absolute;
  left:50%;
  top:32px;
  transform:translateX(-50%);
  background:var(--bg);
  border:1px solid var(--gold);
  color:var(--gold);
  font-family:Arial,sans-serif;
  font-size:11px;
  font-weight:800;
  padding:5px 9px;
  border-radius:999px;
  white-space:nowrap
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:12px
}

.cell{
  min-height:128px;
  border-radius:13px;
  text-align:left;
  padding:13px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  overflow:hidden;
  transition:.18s
}

.tile{
  background:#171724;
  border:1px solid #3a3a4c;
  color:var(--text)
}

.tile:hover{
  transform:translateY(-2px);
  border-color:var(--teal)
}

.tile.active{
  border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(242,201,76,.18);
  background:#211d11
}

.tile.geo{
  border-color:var(--gold);
  background:linear-gradient(145deg,#2b2310,#15151f)
}

.pos{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted)
}

.tile strong{
  font-size:25px;
  line-height:1;
  color:var(--gold)
}

.tileTitle{
  font-size:13px;
  line-height:1.25;
  color:#d8d5c9
}

.newTag{
  align-self:flex-start;
  background:var(--gold);
  color:#111;
  font-family:Arial,sans-serif;
  font-size:9px;
  font-weight:900;
  padding:4px 6px;
  border-radius:99px;
  margin-top:6px
}

.gap{
  background:transparent;
  border:1px dashed #3d3d50;
  color:#77768b
}

.gap:hover{
  border-color:var(--purple);
  color:var(--purple)
}

.gapWord{
  font-size:21px;
  letter-spacing:.2em
}

.gapHint{
  font-size:11px
}

.scanning{
  animation:scan 2.2s ease-in-out infinite
}

@keyframes scan{
  0%,100%{
    opacity:.55
  }

  50%{
    opacity:1;
    background:rgba(206,147,216,.09);
    border-color:var(--purple)
  }
}

.detail{
  margin-top:14px;
  border-top:1px solid var(--line);
  padding-top:16px
}

.detailTop{
  display:flex;
  justify-content:space-between;
  font-family:Arial,sans-serif;
  font-size:11px;
  color:var(--muted)
}

.detailKey{
  color:var(--gold);
  font-weight:900
}

.detail h3{
  font-size:26px;
  margin:8px 0 2px
}

.detailSub{
  color:var(--teal);
  margin:0 0 8px;
  font-style:italic
}

.detail p:last-of-type{
  line-height:1.6;
  color:#d5d2c7
}

.detailNav{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:13px
}

.detailNav button{
  border:1px solid var(--line);
  background:var(--surface2);
  color:var(--text);
  padding:7px 10px;
  border-radius:99px;
  font-family:Arial,sans-serif;
  font-size:12px;
  font-weight:800
}

.detailNav button.active{
  background:var(--gold);
  color:#111;
  border-color:var(--gold)
}

.bridge{
  background:linear-gradient(180deg,#13131f,#0c0d17)
}

.stepBadge{
  font-family:Arial,sans-serif;
  font-size:11px;
  font-weight:800;
  color:var(--gold);
  border:1px solid var(--gold);
  padding:7px 9px;
  border-radius:99px;
  white-space:nowrap
}

.swapStage{
  margin-top:22px
}

.swapCard{
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px;
  background:var(--surface2);
  display:flex;
  flex-direction:column;
  gap:3px
}

.swapCard.old{
  border-left:4px solid var(--teal)
}

.swapCard.new{
  border-left:4px solid var(--gold)
}

.eyebrowSmall{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:.14em;
  font-weight:800;
  color:var(--muted)
}

.swapCard strong{
  font-size:22px
}

.swapCard span{
  font-size:13px;
  color:#cfccbd
}

.swapCard small{
  font-family:Arial,sans-serif;
  color:var(--muted);
  font-size:11px
}

.swapArrows{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 2px;
  color:var(--muted);
  font-family:Arial,sans-serif;
  font-size:12px;
  font-weight:700
}

.bigArrow.teal{
  color:var(--teal)
}

.bigArrow.gold{
  color:var(--gold)
}

.swapDest{
  border-radius:10px;
  padding:11px 13px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-family:Arial,sans-serif;
  font-size:12px;
  font-weight:800
}

.tealDest{
  background:#11312d;
  color:var(--teal)
}

.goldDest{
  background:#302713;
  color:var(--gold)
}

.swapDest small{
  font-weight:500;
  opacity:.8;
  text-align:right
}

.swapDivider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:17px 0;
  color:var(--muted);
  font-family:Arial,sans-serif;
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:10px
}

.swapDivider:before,.swapDivider:after{
  content:"";
  height:1px;
  background:var(--line);
  flex:1
}

.swapText{
  min-height:56px;
  line-height:1.55;
  color:#d8d5c9
}

.swapControls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.swapControls button{
  border:1px solid var(--line);
  background:var(--surface2);
  color:var(--text);
  padding:9px 12px;
  border-radius:99px;
  font-family:Arial,sans-serif;
  font-size:12px;
  font-weight:800;
  display:flex;
  align-items:center;
  gap:3px
}

.swapControls button:disabled{
  opacity:.35
}

.swapControls .primary{
  background:var(--gold);
  border-color:var(--gold);
  color:#111
}

.dots{
  display:flex;
  gap:6px
}

.dotBtn{
  width:9px!important;
  height:9px!important;
  padding:0!important;
  border-radius:50%!important;
  background:#3a3a4c!important;
  border:0!important
}

.dotBtn.active{
  background:var(--gold)!important
}

.verdict{
  margin-top:18px;
  display:flex;
  gap:10px;
  background:rgba(206,147,216,.09);
  border:1px solid rgba(206,147,216,.35);
  border-radius:12px;
  padding:13px;
  color:var(--purple)
}

.verdict strong,.verdict span{
  display:block
}

.verdict strong{
  font-size:14px
}

.verdict span{
  font-size:13px;
  line-height:1.5;
  color:#ded9e7;
  margin-top:3px
}

.layersSection{
  margin-top:18px
}

.hint{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-family:Arial,sans-serif;
  font-size:12px;
  white-space:nowrap
}

.pillars{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-top:20px
}

.pillar{
  min-height:190px;
  border:1px solid var(--line);
  background:var(--surface2);
  color:var(--text);
  border-radius:13px;
  padding:15px;
  text-align:left;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden
}

.pillar:hover{
  transform:translateY(-3px)
}

.pillar.active{
  border-color:var(--c);
  box-shadow:inset 0 -5px 0 var(--c)
}

.pillarNum{
  font-family:Arial,sans-serif;
  color:var(--muted);
  font-size:11px
}

.pillar strong{
  font-size:21px;
  margin-top:35px;
  color:var(--c)
}

.pillarBar{
  flex:1;
  display:flex;
  align-items:flex-end;
  margin:18px 0
}

.pillarBar i{
  display:block;
  width:100%;
  background:linear-gradient(180deg,var(--c),transparent);
  border-radius:4px 4px 0 0;
  min-height:35px
}

.pillarGo{
  font-family:Arial,sans-serif;
  font-size:11px;
  font-weight:800;
  color:var(--muted)
}

.layerDetail{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:24px;
  margin-top:14px;
  border-top:1px solid var(--line);
  padding-top:18px
}

.layerTag{
  font-family:Arial,sans-serif;
  font-size:11px;
  font-weight:900;
  letter-spacing:.12em
}

.layerDetail h3{
  font-size:28px;
  margin:8px 0
}

.layerDetail p{
  color:var(--muted);
  line-height:1.6
}

.layerDetail ul{
  list-style:none;
  margin:0;
  padding:0;
  border-left:1px solid var(--line)
}

.layerDetail li{
  padding:9px 0 9px 18px;
  border-bottom:1px solid var(--line);
  display:flex;
  gap:10px
}

.layerDetail li span{
  color:var(--gold)
}

.scoreSection{
  margin-top:18px;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:30px;
  align-items:center;
  background:linear-gradient(100deg,#16111a,#0c1115)
}

.scoreSection h2{
  font-size:32px;
  line-height:1.1;
  margin:8px 0
}

.scoreSection code{
  display:inline-block;
  background:#050509;
  border:1px solid var(--gold);
  color:var(--gold);
  padding:10px 12px;
  border-radius:8px;
  font-size:13px
}

.scoreSection p{
  color:var(--muted);
  line-height:1.6
}

.formulaParts{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  font-family:Arial,sans-serif;
  font-size:12px
}

.formulaParts span{
  display:flex;
  gap:6px;
  align-items:center
}

.calculator{
  background:var(--surface2);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px
}

.calculator label{
  display:block;
  margin-bottom:18px
}

.calculator label span,.calculator label strong{
  display:flex;
  justify-content:space-between;
  font-family:Arial,sans-serif;
  font-size:12px
}

.calculator label strong{
  font-size:17px;
  margin-top:5px
}

.calculator input{
  width:100%;
  accent-color:var(--gold);
  margin-top:8px
}

.scoreResult{
  border-top:1px solid var(--line);
  padding-top:14px
}

.scoreResult>span{
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:.14em;
  color:var(--muted)
}

.scoreResult strong{
  display:block;
  font-size:40px;
  color:var(--gold);
  line-height:1.1
}

.scoreBar{
  height:8px;
  background:#2a2a39;
  border-radius:99px;
  overflow:hidden;
  margin:10px 0
}

.scoreBar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--teal),var(--gold));
  transition:width .2s
}

.scoreResult small{
  color:var(--muted)
}

footer{
  max-width:1240px;
  display:flex;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
  padding:20px 0 0;
  color:var(--muted);
  font-family:Arial,sans-serif;
  font-size:12px
}

footer span{
  display:flex;
  gap:6px;
  align-items:center
}

@media(max-width:760px){
  .shell{
    padding-left:12px;
    padding-right:12px
  }

  .top{
    padding-top:24px
  }

  .titleRow{
    align-items:flex-start
  }

  .liveBadge{
    display:none
  }

  .intro{
    font-size:16px
  }

  .brainHead{
    align-items:flex-start;
    gap:10px
  }

  .miniBtn{
    white-space:nowrap
  }

  .middle{
    grid-template-columns:1fr
  }

  .gridSection,.bridge,.layersSection,.scoreSection{
    padding:16px
  }

  .cell{
    min-height:112px;
    padding:10px
  }

  .tile strong{
    font-size:21px
  }

  .tileTitle{
    font-size:12px
  }

  .archLabel{
    font-size:10px;
    top:34px
  }

  .pillars{
    grid-template-columns:repeat(2,1fr)
  }

  .pillar{
    min-height:155px
  }

  .pillar:last-child{
    grid-column:1/-1
  }

  .layerDetail,.scoreSection{
    grid-template-columns:1fr
  }

  .scoreSection h2{
    font-size:28px
  }

  .swapDest{
    flex-direction:column
  }

  .swapDest small{
    text-align:left
  }

  .detailTop{
    flex-direction:column;
    gap:4px
  }
}

@media(max-width:430px){
  .brainChips span{
    width:100%
  }

  .grid{
    gap:7px
  }

  .cell{
    min-height:102px
  }

  .tile strong{
    font-size:18px
  }

  .tileTitle{
    display:none
  }

  .newTag{
    font-size:8px
  }

  .pillars{
    grid-template-columns:1fr 1fr
  }

  .pillar strong{
    font-size:17px;
    margin-top:20px
  }

  .sectionHead{
    align-items:flex-start
  }

  .toggle{
    font-size:11px;
    padding:7px
  }
}
