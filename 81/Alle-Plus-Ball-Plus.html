  --bg:#070a0f;
  --surface:#0a121a;
  --surface2:#0d1a22;
  --cyan:#00eaff;
  --gold:#ffcc00;
  --mint:#7affc6;
  --ink:#c9eef6;
  --muted:#7fb8c5;
  --dim:#5a7d86;
  --line:rgba(0,234,255,.22);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#070a0f;
    --surface:#0a121a;
    --surface2:#0d1a22;
    --ink:#c9eef6;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace
}

button,input,textarea,select{
  font:inherit
}

button{
  cursor:pointer
}

.chip{
  border:1px solid var(--line);
  background:rgba(13,26,34,.65);
  padding:6px 9px;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#7ed7e7
}

.chip.active,.chip:hover{
  background:rgba(0,234,255,.14);
  color:white;
  border-color:rgba(0,234,255,.65)
}

.panel{
  border:1px solid var(--line);
  background:var(--surface)
}

.label{
  font-size:11px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--cyan)
}

input[type=range]{
  width:100%;
  accent-color:var(--cyan)
}

textarea{
  width:100%;
  background:#080e15;
  border:1px solid var(--line);
  color:var(--ink);
  padding:10px;
  resize:vertical
}

input[type=text]{
  background:#080e15;
  border:1px solid var(--line);
  color:white;
  padding:9px 10px;
  width:100%
}

@keyframes grow{
  from{
    width:0
  }

  to{
    width:var(--w)
  }
}

.bar{
  animation:grow 1.1s ease-out both
}

@keyframes pulseDot{
  50%{
    opacity:.35
  }
}

.pulse{
  animation:pulseDot 1.6s infinite
}

@keyframes blink{
  50%{

  }
}

.blink{
  animation:blink 1s steps(1) infinite
}
