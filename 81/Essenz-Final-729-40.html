:root {
  --bg: #050805;
  --surface: #0a0d08;
  --surface2: #11160d;
  --gold: #f2c94c;
  --green: #7ee787;
  --ink: #f2ead1;
  --muted: #9cb09b;
  --line: #2a3a25;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050805;
    --surface: #0a0d08;
    --ink: #f2ead1;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.shell {
  min-height: 100vh;
  width: 100%;
  padding: var(--safe-area-inset-top) 16px 32px;
  background: radial-gradient(circle at 50% 0, rgba(242,201,76,.12), transparent 32%), var(--bg);
}

.page {
  width: 100%;
  max-width: 42em;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.hero {
  text-align: center;
  padding: 28px 8px 10px;
}

.eyebrow {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .22em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 400;
  color: var(--gold);
  font-size: clamp(25px, 7vw, 38px);
  letter-spacing: .06em;
  line-height: 1.1;
}

h2 {
  margin: 0;
  font-size: 17px;
  color: var(--ink);
}

.law {
  margin: 18px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.law strong {
  color: var(--ink);
}

.power-row {
  margin: 16px auto 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 5px 12px;
  color: var(--muted);
  font-size: 11px;
}

.power-row b {
  color: var(--gold);
}

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 18px 50px rgba(0,0,0,.2);
}

.section-label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}

.section-label span {
  color: var(--gold);
  font-size: 11px;
  border: 1px solid var(--line);
  padding: 4px 7px;
  border-radius: 99px;
}

.calculator label, .sliders label span {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
}

.controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 10px 0 14px;
}

.controls input {
  background: #050805;
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: 8px;
  padding: 11px 12px;
  width: 7.5em;
  font-size: 17px;
  outline: none;
}

.controls input:focus, textarea:focus, input[type="range"]:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

.controls button, .code-actions button {
  background: #1e180a;
  color: var(--gold);
  border: 1px solid var(--gold);
  padding: 10px 14px;
  border-radius: 99px;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.controls button:hover, .code-actions button:hover, .controls button.active {
  background: var(--gold);
  color: #050805;
}

.output {
  background: #050805;
  border-radius: 8px;
  padding: 16px;
  min-height: 82px;
  color: var(--green);
  font-size: 14px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.output-label {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  display: block;
  margin-bottom: 5px;
}

.output p {
  margin: 0;
}

.output b {
  color: var(--ink);
}

.definition {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
  margin: 12px 0 0;
}

.cascade-grid {
  display: grid;
  gap: 16px;
}

.cascade-path {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px 10px;
  font-size: 22px;
  color: var(--ink);
}

.cascade-path i {
  font-style: normal;
  color: var(--muted);
  font-size: 12px;
}

.cascade-path .home {
  color: var(--gold);
}

.checks {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.checks li {
  color: var(--green);
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 7px;
}

.pass {
  margin: 18px 0 0;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  color: var(--gold);
  font-size: 12px;
  letter-spacing: .08em;
}

.intro {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
  margin: -6px 0 18px;
}

.sliders {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.sliders label {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.sliders label span {
  display: flex;
  justify-content: space-between;
}

.sliders label b {
  color: var(--gold);
  letter-spacing: 0;
  font-size: 13px;
}

input[type="range"] {
  width: 100%;
  accent-color: var(--gold);
}

.shape-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.shape-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 14px;
  background: #080b07;
  min-width: 0;
}

.shape-visual {
  height: 112px;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.shape-visual svg {
  width: 100%;
  max-width: 150px;
  height: 104px;
  fill: rgba(242,201,76,.1);
  stroke: var(--gold);
  stroke-width: 1.6;
  transition: transform .6s ease;
  transform: perspective(500px) rotateY(-18deg) rotateX(6deg);
}

.shape-card:hover .shape-visual svg, .shape-card:focus-within .shape-visual svg {
  transform: perspective(500px) rotateY(28deg) rotateX(-5deg) scale(1.04);
}

.shape-head {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.shape-head h3 {
  margin: 0;
  font-size: 15px;
}

.hover-hint {
  color: var(--muted);
  font-size: 10px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.formula {
  color: var(--green);
  font-size: 12px;
  line-height: 1.5;
  margin: 8px 0 12px;
  overflow-wrap: anywhere;
}

.values {
  border-top: 1px solid var(--line);
  padding-top: 10px;
  display: grid;
  gap: 8px;
}

.values div {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
}

.values span {
  color: var(--muted);
}

.values strong {
  color: var(--ink);
}

.memory {
  margin-top: 14px;
  background: #1e180a;
  border: 1px solid rgba(242,201,76,.45);
  border-radius: 9px;
  padding: 14px;
  display: grid;
  gap: 3px;
  text-align: center;
}

.memory span {
  color: var(--gold);
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
}

.memory strong {
  font-size: 16px;
}

.memory small {
  color: var(--muted);
  font-size: 11px;
}

textarea {
  width: 100%;
  resize: vertical;
  background: #050805;
  border: 1px solid var(--line);
  color: var(--green);
  border-radius: 8px;
  padding: 14px;
  font-size: 12px;
  line-height: 1.65;
}

.code-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
}

.code-actions p {
  color: var(--muted);
  font-size: 12px;
  margin: 0;
}

.tests {
  color: var(--green);
  font-size: 11px;
  line-height: 1.7;
  margin: 14px 0 0;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .14em;
  padding: 8px 0 12px;
}

@media (max-width: 620px) {
  .shell {
    padding-left: 12px;
    padding-right: 12px;
  }

  .panel {
    padding: 20px;
  }

  .shape-grid {
    grid-template-columns: 1fr;
  }

  .shape-card {
    display: grid;
    grid-template-columns: 118px 1fr;
    -moz-column-gap: 12px;
         column-gap: 12px;
  }

  .shape-visual {
    height: 118px;
  }

  .shape-head, .formula, .values {
    grid-column: 2;
  }

  .shape-visual {
    grid-row: 1 / span 3;
  }

  .sliders {
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .checks {
    grid-template-columns: 1fr;
  }

  .controls input {
    width: 100%;
  }

  .controls button {
    flex: 1;
    justify-content: center;
  }

  .cascade-path {
    font-size: 19px;
  }
}

@media (max-width: 430px) {
  .shape-card {
    grid-template-columns: 1fr;
  }

  .shape-visual {
    grid-row: auto;
  }
