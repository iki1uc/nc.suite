:root {
  --surface: #050805;
  --ink: #f2ead1;
  --gold: #f2c94c;
  --muted: #9cb09b;
  --panel: #0a0d08;
  --line: #2a3a25;
  --green: #7ee787;
  --button-bg: #1e180a;
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #050805;
    --ink: #f2ead1;
    --gold: #f2c94c;
    --muted: #9cb09b;
    --panel: #0a0d08;
    --line: #2a3a25;
    --green: #7ee787;
    --button-bg: #1e180a;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--surface);
  color: var(--ink);
}

.essenz-shell {
  min-height: 100vh;
  width: 100%;
  padding-top: var(--safe-area-inset-top, 0px);
  background: var(--surface);
  color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  overflow-x: clip;
}

.essenz-page {
  display: flex;
  flex-direction: column;
  gap: 1em;
  max-width: 42em;
  margin: 0 auto;
  padding: 2em 1.25em 3em;
}

.essenz-page h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 20px;
  font-weight: 400;
  color: var(--gold);
  letter-spacing: .2em;
  text-align: center;
  margin: 0;
}

.essenz-page label {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
}

.essenz-page .flex {
  display: flex;
  gap: .5em;
  flex-wrap: wrap;
  align-items: center;
}

.essenz-page input {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: .5em;
  border-radius: 6px;
  font-family: inherit;
  width: 8em;
  font-size: 14px;
}

.essenz-page button {
  background: var(--button-bg);
  color: var(--gold);
  border: 1px solid var(--gold);
  padding: .7em 1.2em;
  border-radius: 99px;
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
}

.essenz-page button:hover,
.essenz-page button:focus-visible {
  background: var(--gold);
  color: var(--surface);
  outline: none;
}

.essenz-page pre {
  background: var(--panel);
  padding: 1em;
  border-radius: 8px;
  color: var(--green);
  font-size: 13px;
  line-height: 1.6;
  min-height: 2em;
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

@media (max-width: 480px) {
  .essenz-page {
    padding: 1.5em 1em 2.5em;
  }

  .essenz-page h1 {
    font-size: 18px;
    letter-spacing: .14em;
  }

  .essenz-page input {
    width: 6.5em;
  }
}
