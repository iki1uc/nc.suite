.text-black\/70 {
  color: rgb(0 0 0 / 0.7);
}

.text-white {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.transition {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-all {
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.duration-300 {
  transition-duration: 300ms;
}

.duration-700 {
  transition-duration: 700ms;
}

:root{
  --bg:#0a0a12;
  --surface:#12121f;
  --surface-2:#171728;
  --line:rgba(0,204,255,.18);
  --gold:#ffd700;
  --cyan:#00ccff;
  --ink:#e8f2ff;
  --muted:#8aa3b8;
  --green:#37ff9a;
  --orange:#ff8a3c;
  --font-display:"Arial Black","Avenir Next","Trebuchet MS",sans-serif;
  --font-mono:"Consolas","Menlo","Courier New",monospace;
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-mono)
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#07070e;
    --surface:#101019;
    --surface-2:#151524
  }
}

.ball-shell{
  transition:background .5s ease
}

.ball-shell[data-ort="nevada"]{
  background:radial-gradient(circle at 50% 0%,rgba(255,138,60,.22),transparent 48%),radial-gradient(circle at 85% 90%,rgba(255,215,0,.13),transparent 40%),#0a0a12
}

.ball-shell[data-ort="nirvana"]{
  background:radial-gradient(circle at 50% 0%,rgba(0,204,255,.22),transparent 52%),radial-gradient(circle at 10% 90%,rgba(0,255,170,.10),transparent 42%),#08111a
}

.display{
  font-family:var(--font-display);
  letter-spacing:-.02em;
  line-height:.92
}

.chip{
  border:1px solid var(--line);
  border-radius:999px;
  padding:5px 9px;
  font-size:11px
}

input[type="range"]{
  accent-color:var(--gold);
  width:100%
}

.chess-cell{
  aspect-ratio:1;
  display:grid;
  place-items:center;
  font-size:15px;
  line-height:1;
  -webkit-user-select:none;
     -moz-user-select:none;
          user-select:none
}

.log-scroll::-webkit-scrollbar{
  width:5px
}

.log-scroll::-webkit-scrollbar-thumb{
  background:#2b3b4a
}

@media (min-width: 640px) {
  .sm\:hidden {
    display: none;
  }

  .sm\:h-\[400px\] {
    height: 400px;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:text-\[54px\] {
    font-size: 54px;
  }
}

@media (min-width: 768px) {
  .md\:col-span-2 {
    grid-column: span 2 / span 2;
  }

  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.65fr_\.9fr\] {
    grid-template-columns: 1.65fr .9fr;
  }

  .lg\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .lg\:text-\[68px\] {
    font-size: 68px;
  }
}

@media (min-width: 1280px) {
  .xl\:col-span-1 {
    grid-column: span 1 / span 1;
  }

  .xl\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
