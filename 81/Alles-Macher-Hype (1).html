       appearance:none;
  width:100%;
  height:10px;
  border-radius:999px;
  background:#2b1a0f;
  outline:none;
  border:1px solid #4a2d16;
  cursor:pointer
}

  -webkit-appearance:none;

@keyframes flicker{
  0%,100%{
    transform:scaleY(1) rotate(-1deg);
    opacity:1
  }

  25%{
    transform:scaleY(1.08) rotate(1deg);
    opacity:.92
  }

  50%{
    transform:scaleY(.96) rotate(-2deg);
    opacity:1
  }

  75%{
    transform:scaleY(1.12) rotate(1deg);
    opacity:.88
  }
}

@keyframes rise{
  0%{
    transform:translateY(0) scale(1);
    opacity:0
  }

  12%{
    opacity:1
  }

  100%{
    transform:translateY(-78px) scale(.4);
    opacity:0
  }
}

@keyframes pulseGlow{
  0%,100%{
    box-shadow:0 0 30px rgba(255,90,0,.45),inset 0 0 18px rgba(255,194,75,.35)
  }

  50%{
    box-shadow:0 0 58px rgba(255,90,0,.85),inset 0 0 28px rgba(255,194,75,.6)
  }
}

@keyframes shimmer{
  0%{
    transform:translateX(-100%)
  }

  100%{
    transform:translateX(220%)
  }
}

@keyframes stampIn{
  0%{
    transform:scale(1.7) rotate(-18deg);
    opacity:0
  }

  60%{
    transform:scale(.94) rotate(-9deg);
    opacity:1
  }

  100%{
    transform:scale(1) rotate(-10deg);
    opacity:1
  }
}

.flame{
  animation:flicker .9s ease-in-out infinite;
  transform-origin:bottom center
}

.stamp{
  animation:stampIn .5s cubic-bezier(.2,1.4,.3,1) both
}

.hype-bar{
  position:relative;
  overflow:hidden
}

.hype-bar:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  width:45%;
  animation:shimmer 1.8s linear infinite
