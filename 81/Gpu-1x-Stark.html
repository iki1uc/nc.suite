:root{
  --bg:#07090b;
  --surface:#0e1417;
  --surface2:#142026;
  --line:#28383d;
  --text:#edf3f1;
  --muted:#9caeaa;
  --gold:#e9b844;
  --cyan:#57d8d5;
  --green:#72d69c;
  --red:#f06a58;
  --amber:#e8a94e
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#050708;
    --surface:#0c1214;
    --surface2:#121d20;
    --line:#243439;
    --text:#eff5f3;
    --muted:#9dafa9
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace
}

button,input,a{
  font:inherit
}

a{
  color:inherit;
  text-decoration:none
}

.shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 0 0;
  background:radial-gradient(circle at 88% 0,rgba(87,216,213,.14),transparent 28%),radial-gradient(circle at 5% 8%,rgba(233,184,68,.13),transparent 26%),var(--bg);
  overflow-x:clip
}

.topbar{
  height:72px;
  max-width:1280px;
  margin:0 auto;
  padding:0 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  background:rgba(7,9,11,.92);
  backdrop-filter:blur(12px)
}

.brand{
  display:flex;
  gap:12px;
  align-items:center
}

.logo{
  background:var(--gold);
  color:#111;
  padding:9px 10px;
  font-weight:800;
  font-size:18px;
  letter-spacing:-.04em
}

.brand small{
  display:block;
  color:var(--cyan);
  font-size:10px;
  letter-spacing:.18em
}

.brand strong{
  font-size:14px
}

nav{
  display:flex;
  gap:24px;
  font-size:11px;
  letter-spacing:.12em
}

nav a{
  color:var(--muted)
}

nav a:hover{
  color:var(--gold)
}

.live-dot{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:10px;
  letter-spacing:.12em
}

.live-dot span{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 5px rgba(114,214,156,.15)
}

.hero{
  max-width:1280px;
  margin:0 auto;
  padding:64px 28px 42px
}

.eyebrow{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:11px;
  letter-spacing:.15em;
  color:var(--muted)
}

.eyebrow i{
  width:32px;
  height:1px;
  background:var(--gold);
  display:block
}

.hero h1{
  font-size:clamp(54px,9vw,124px);
  line-height:.86;
  letter-spacing:-.065em;
  margin:28px 0 24px;
  text-transform:uppercase
}

.hero h1 em{
  color:var(--gold);
  font-style:normal
}

.hero h1 s{
  color:#6d6e68;
  text-decoration-thickness:7px;
  text-decoration-color:var(--red)
}

.lede{
  max-width:680px;
  font-size:17px;
  line-height:1.65;
  color:var(--muted)
}

.hero-actions{
  display:flex;
  gap:12px;
  margin-top:30px
}

.primary,.ghost{
  height:48px;
  padding:0 18px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--gold);
  font-weight:700;
  font-size:13px
}

.primary{
  background:var(--gold);
  color:#111
}

.ghost{
  border-color:var(--line);
  color:var(--text)
}

.hero-metrics{
  margin-top:44px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line)
}

.hero-metrics div{
  padding:20px 18px 0 0;
  border-right:1px solid var(--line);
  margin-right:18px
}

.hero-metrics div:last-child{
  border:0
}

.hero-metrics small{
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.14em;
  margin-bottom:8px
}

.hero-metrics strong{
  font-size:18px
}

.dead{
  color:var(--red)
}

.section{
  max-width:1280px;
  margin:0 auto;
  padding:68px 28px
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:40px;
  margin-bottom:30px
}

.section-head h2{
  font-size:clamp(30px,4vw,50px);
  line-height:1.02;
  letter-spacing:-.04em;
  margin:12px 0 0
}

.section-head p{
  max-width:340px;
  color:var(--muted);
  line-height:1.6;
  font-size:14px
}

.kicker{
  font-size:11px;
  letter-spacing:.16em;
  color:var(--gold);
  font-weight:700
}

.compare-grid{
  display:grid;
  grid-template-columns:200px 1fr 220px;
  gap:14px
}

.winner,.table-wrap,.dead-card{
  background:var(--surface);
  border:1px solid var(--line);
  padding:22px
}

.winner-tag{
  display:flex;
  gap:7px;
  align-items:center;
  color:var(--gold);
  font-size:11px;
  font-weight:800
}

.big-gpu{
  height:220px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:1px solid var(--gold);
  margin:24px 0;
  background:linear-gradient(180deg,rgba(233,184,68,.12),transparent)
}

.big-gpu span{
  font-size:12px;
  letter-spacing:.2em
}

.big-gpu strong{
  font-size:84px;
  line-height:1
}

.big-gpu small{
  color:var(--gold)
}

.winner p{
  font-size:13px;
  line-height:1.5;
  color:var(--muted)
}

.table-wrap{
  padding:0;
  overflow:hidden
}

.table-head,.table-row{
  display:grid;
  grid-template-columns:1.1fr 1.5fr 1.5fr
}

.table-head{
  padding:20px 22px;
  font-size:10px;
  letter-spacing:.14em;
  color:var(--muted);
  border-bottom:1px solid var(--line)
}

.table-row{
  padding:18px 22px;
  border-bottom:1px solid var(--line);
  align-items:center
}

.table-row:last-child{
  border:0
}

.table-row strong{
  display:flex;
  gap:7px;
  align-items:center;
  color:var(--green)
}

.strike{
  color:#85918d;
  text-decoration:line-through
}

.dead-card{
  position:relative;
  overflow:hidden;
  background:#181110;
  border-color:#4a2d28
}

.dead-label{
  font-size:44px;
  font-weight:800;
  color:#7a5c57;
  letter-spacing:-.05em
}

.dead-card strong{
  display:block;
  margin-top:70px
}

.dead-card p{
  color:#a48d89;
  line-height:1.5;
  font-size:13px
}

.dead-stamp{
  position:absolute;
  right:12px;
  top:20px;
  border:2px solid var(--red);
  color:var(--red);
  padding:5px 10px;
  transform:rotate(12deg);
  font-weight:800
}

.class-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px
}

.class-card{
  text-align:left;
  background:var(--surface);
  border:1px solid var(--line);
  padding:22px;
  color:var(--text);
  cursor:pointer;
  min-height:250px;
  display:flex;
  flex-direction:column
}

.class-card:hover,.class-card.active{
  border-color:var(--gold);
  transform:translateY(-3px)
}

.class-card.active{
  background:linear-gradient(180deg,rgba(233,184,68,.1),var(--surface));
  box-shadow:0 18px 40px rgba(0,0,0,.2)
}

.card-top{
  display:flex;
  justify-content:space-between
}

.code{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border:1px solid var(--cyan);
  color:var(--cyan);
  font-size:22px;
  font-weight:800
}

.shape{
  font-size:11px;
  color:var(--muted);
  text-align:right
}

.class-card h3{
  font-size:34px;
  margin:44px 0 8px
}

.best{
  font-size:13px;
  line-height:1.55;
  color:var(--muted);
  flex:1
}

.mini{
  display:flex;
  gap:28px;
  border-top:1px solid var(--line);
  padding-top:16px;
  margin:18px 0
}

.mini small{
  display:block;
  color:var(--muted);
  font-size:10px
}

.choose{
  font-size:11px;
  font-weight:800;
  color:var(--gold)
}

.detail-panel{
  margin-top:14px;
  background:var(--surface2);
  border:1px solid var(--line);
  padding:28px
}

.detail-title{
  display:flex;
  justify-content:space-between;
  gap:20px
}

.detail-title span,.fixpoint small{
  font-size:10px;
  letter-spacing:.14em;
  color:var(--cyan)
}

.detail-title h3{
  font-size:26px;
  margin:8px 0
}

.detail-title p{
  color:var(--muted);
  max-width:700px;
  line-height:1.55
}

.count{
  text-align:right
}

.count strong{
  font-size:38px;
  color:var(--gold)
}

.count small{
  display:block;
  color:var(--muted)
}

.specs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  margin:24px 0
}

.spec{
  background:var(--surface);
  padding:16px
}

.spec small{
  display:block;
  color:var(--muted);
  font-size:9px;
  letter-spacing:.12em;
  margin-bottom:7px
}

.spec strong{
  font-size:13px;
  line-height:1.3
}

.spec:last-child{
  grid-column:span 3
}

.bars{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:28px
}

.bar-head{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  margin-bottom:8px
}

.bar-head span{
  letter-spacing:.12em
}

.bar-track{
  height:8px;
  background:#07100f;
  overflow:hidden
}

.bar-track span{
  display:block;
  height:100%;
  transition:width .3s
}

.cooling-section{
  background:linear-gradient(180deg,rgba(87,216,213,.05),transparent)
}

.cooling-layout{
  display:grid;
  grid-template-columns:.85fr 1.15fr;
  gap:14px
}

.cylinder-wrap,.control-panel{
  background:var(--surface);
  border:1px solid var(--line);
  padding:24px;
  position:relative;
  overflow:hidden
}

.cylinder-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:520px
}

.flow-label{
  font-size:10px;
  letter-spacing:.18em;
  color:var(--cyan)
}

.cylinder{
  width:280px;
  height:300px;
  border:1px solid var(--cyan);
  border-radius:130px / 26px;
  position:relative;
  margin:24px 0;
  overflow:hidden;
  background:radial-gradient(circle at center,rgba(87,216,213,.15),transparent 55%);
  box-shadow:inset 0 0 50px rgba(87,216,213,.08)
}

.gpu-core{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:124px;
  height:124px;
  border:1px solid var(--gold);
  border-radius:50%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#0b1516;
  z-index:2
}

.gpu-core span{
  font-size:10px;
  letter-spacing:.2em
}

.gpu-core strong{
  color:var(--gold);
  font-size:15px
}

.fin{
  position:absolute;
  width:1px;
  height:100%;
  background:rgba(87,216,213,.18)
}

.f1{
  left:30%
}

.f2{
  left:50%
}

.f3{
  left:70%
}

.air{
  position:absolute;
  left:-10%;
  height:2px;
  width:55px;
  background:var(--cyan);
  border-radius:10px;
  animation:flow var(--speed) linear infinite
}

.a1{
  top:25%
}

.a2{
  top:50%;
  animation-delay:.25s
}

.a3{
  top:75%;
  animation-delay:.5s
}

@keyframes flow{
  from{
    transform:translateX(0);
    opacity:0
  }

  20%{
    opacity:1
  }

  to{
    transform:translateX(360px);
    opacity:0
  }
}

.airflow{
  display:flex;
  gap:8px;
  align-items:center;
  color:var(--cyan)
}

.airflow span{
  color:var(--muted);
  font-size:11px
}

.temp-box{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:20px;
  border:1px solid var(--line)
}

.temp-box.good{
  border-color:rgba(114,214,156,.5)
}

.temp-box.warn{
  border-color:var(--amber)
}

.temp-box.bad{
  border-color:var(--red)
}

.temp-box small{
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.14em
}

.temp-box strong{
  font-size:52px
}

.temp-box p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:12px
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  height:34px;
  padding:0 11px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap
}

.status.good{
  color:#111;
  background:var(--green)
}

.status.warn{
  color:#111;
  background:var(--amber)
}

.status.bad{
  color:white;
  background:var(--red)
}

.formula{
  margin:18px 0;
  padding:14px;
  background:#071110;
  border:1px solid var(--line);
  font-size:12px
}

.formula span{
  display:block;
  color:var(--muted)
}

.formula b{
  display:block;
  color:var(--cyan);
  margin-top:6px
}

.slider-row{
  display:block;
  margin-top:24px
}

.slider-row>div:first-child{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px
}

.slider-row>div:first-child span{
  letter-spacing:.12em
}

.slider-row strong{
  float:right;
  margin-top:-20px;
  color:var(--gold)
}

.slider-row input{
  width:100%;
  accent-color:var(--gold);
  margin:14px 0 5px
}

.range-labels{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:10px
}

.quick{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:18px
}

.quick button{
  background:transparent;
  border:1px solid var(--line);
  color:var(--text);
  padding:10px 5px;
  font-size:10px;
  cursor:pointer
}

.quick button:hover{
  border-color:var(--cyan);
  color:var(--cyan)
}

.temp-scale{
  height:8px;
  background:linear-gradient(90deg,var(--cyan),var(--green) 55%,var(--amber) 78%,var(--red));
  margin-top:28px;
  position:relative
}

.temp-scale span{
  position:absolute;
  top:14px;
  color:var(--muted);
  font-size:9px
}

.temp-scale span:nth-child(2){
  left:52%
}

.temp-scale span:nth-child(3){
  right:0
}

.temp-scale i{
  position:absolute;
  top:-4px;
  width:3px;
  height:16px;
  background:white;
  box-shadow:0 0 0 2px #111
}

.rules{
  display:grid;
  grid-template-columns:1fr 1.35fr;
  gap:14px
}

.burro,.home{
  background:var(--surface);
  border:1px solid var(--line);
  padding:28px
}

.burro h2,.home h2{
  font-size:30px;
  line-height:1.08;
  letter-spacing:-.03em;
  margin:12px 0
}

.burro p,.home p{
  color:var(--muted);
  line-height:1.6;
  font-size:14px
}

.fold{
  margin-top:50px;
  border-top:1px solid var(--line);
  padding-top:22px;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.fold small{
  display:block;
  color:var(--muted);
  font-size:10px
}

.fold strong{
  font-size:28px
}

.fold s{
  color:var(--red);
  opacity:.7
}

.fold em{
  color:var(--gold);
  font-style:normal;
  font-size:42px
}

.fold .arrow{
  font-size:30px;
  color:var(--cyan)
}

.home{
  position:relative;
  overflow:hidden
}

.home-number{
  position:absolute;
  right:20px;
  top:-24px;
  font-size:170px;
  font-weight:800;
  color:rgba(233,184,68,.09);
  line-height:1
}

.home-chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:20px
}

.home-chips span{
  border:1px solid var(--line);
  padding:8px 10px;
  font-size:10px;
  display:flex;
  gap:6px;
  align-items:center
}

.fixpoint{
  margin-top:28px;
  border:1px solid var(--gold);
  padding:20px;
  background:rgba(233,184,68,.05)
}

.fixpoint strong{
  display:block;
  font-size:30px;
  margin:9px 0
}

.fixpoint code{
  color:var(--cyan);
  font-size:13px
}

.fixpoint p{
  font-size:12px
}

.fixpoint label{
  display:block;
  margin-top:16px
}

.fixpoint label span{
  font-size:10px
}

.fixpoint label b{
  float:right;
  color:var(--gold)
}

.fixpoint input{
  width:100%;
  accent-color:var(--gold)
}

.cap-result{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:14px;
  font-size:11px
}

.cap-result span{
  color:var(--muted)
}

.cap-result b{
  font-size:14px
}

.gold{
  color:var(--gold)
}

.ok{
  color:var(--green)
}

.parts-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.part{
  display:flex;
  gap:13px;
  align-items:flex-start;
  text-align:left;
  background:var(--surface);
  border:1px solid var(--line);
  padding:20px;
  color:var(--text);
  cursor:pointer;
  min-height:130px;
  position:relative
}

.part:hover{
  border-color:var(--cyan)
}

.part.done{
  border-color:rgba(114,214,156,.35)
}

.part-num{
  font-size:11px;
  color:var(--muted)
}

.check{
  width:28px;
  height:28px;
  border:1px solid var(--line);
  display:grid;
  place-items:center;
  color:transparent;
  flex:0 0 auto
}

.part.done .check{
  background:var(--green);
  color:#111;
  border-color:var(--green)
}

.part h3{
  font-size:15px;
  margin:0 0 7px
}

.part p{
  font-size:12px;
  line-height:1.5;
  color:var(--muted);
  margin:0
}

.part-state{
  position:absolute;
  right:14px;
  top:14px;
  font-size:9px;
  color:var(--muted)
}

.part.done .part-state{
  color:var(--green)
}

.final-line{
  margin-top:14px;
  background:var(--gold);
  color:#111;
  padding:18px 22px;
  display:flex;
  align-items:center;
  gap:12px;
  justify-content:space-between
}

.final-line span{
  font-weight:700
}

.final-line strong{
  font-size:12px
}

footer{
  max-width:1280px;
  margin:auto;
  padding:28px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.12em
}

@media(max-width:760px){
  .topbar{
    padding:0 16px
  }

  .topbar nav,.live-dot{
    display:none
  }

  .hero{
    padding:44px 16px 32px
  }

  .hero h1{
    font-size:60px
  }

  .eyebrow{
    font-size:9px;
    gap:7px
  }

  .eyebrow i{
    width:12px
  }

  .hero-actions{
    flex-direction:column
  }

  .primary,.ghost{
    justify-content:center
  }

  .hero-metrics{
    grid-template-columns:1fr 1fr
  }

  .hero-metrics div:nth-child(2){
    border:0;
    margin-right:0
  }

  .hero-metrics div{
    padding-top:16px
  }

  .section{
    padding:50px 16px
  }

  .section-head{
    flex-direction:column;
    align-items:flex-start;
    gap:14px
  }

  .section-head p{
    max-width:none
  }

  .compare-grid{
    grid-template-columns:1fr
  }

  .winner{
    order:1
  }

  .table-wrap{
    order:2
  }

  .dead-card{
    order:3
  }

  .table-head,.table-row{
    grid-template-columns:1fr 1fr
  }

  .table-head span:first-child,.table-row>span:first-child{
    display:none
  }

  .table-row{
    padding:16px
  }

  .class-grid,.cooling-layout,.rules,.parts-grid{
    grid-template-columns:1fr
  }

  .class-card{
    min-height:230px
  }

  .detail-panel{
    padding:18px
  }

  .detail-title{
    flex-direction:column
  }

  .count{
    text-align:left
  }

  .specs{
    grid-template-columns:1fr 1fr
  }

  .spec:last-child{
    grid-column:span 2
  }

  .bars{
    grid-template-columns:1fr;
    gap:16px
  }

  .cylinder-wrap{
    min-height:440px
  }

  .cylinder{
    width:250px
  }

  .temp-box{
    flex-direction:column
  }

  .status{
    align-self:flex-start
  }

  .quick{
    grid-template-columns:1fr
  }

  .final-line{
    flex-direction:column;
    align-items:flex-start
  }

  .final-line strong{
    align-self:flex-start
  }

  footer{
    padding:20px 16px;
    flex-direction:column;
    gap:8px
  }

  .home-number{
    font-size:120px
  }

  .fold{
    align-items:flex-start;
    gap:18px
  }

  .fold strong{
    font-size:22px
  }

  .fold em{
    font-size:32px
  }
}

@media(max-width:400px){
  .hero h1{
    font-size:52px
  }

  .table-row{
    grid-template-columns:1fr
  }

  .table-head{
    display:none
  }

  .table-row strong{
    margin-top:5px
  }

  .specs{
    grid-template-columns:1fr
  }

  .spec:last-child{
    grid-column:auto
  }

  .cap-result{
    justify-content:flex-start
  }
}
</style>
