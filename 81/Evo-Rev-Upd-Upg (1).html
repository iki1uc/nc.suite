    --muted: #9aa79a;
    --gold: #ffd700;
  }
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

body {
  font-family: Consolas, "Courier New", monospace;
}

::-moz-selection {
  background: var(--gold);
  color: #0a0a0f;
}

::selection {
  background: var(--gold);
  color: #0a0a0f;
}

.log-scroll::-webkit-scrollbar {
  width: 8px;
}

.log-scroll::-webkit-scrollbar-thumb {
  background: #333;
  border-radius: 999px;
}

.hover\:border-\[\#ff6b8a\]:hover {
  --tw-border-opacity: 1;
  border-color: rgb(255 107 138 / var(--tw-border-opacity, 1));
}

.hover\:border-\[\#ffd700\]:hover {
  --tw-border-opacity: 1;
  border-color: rgb(255 215 0 / var(--tw-border-opacity, 1));
}

.hover\:bg-\[\#ffd700\]:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(255 215 0 / var(--tw-bg-opacity, 1));
}

.hover\:text-\[\#ff6b8a\]:hover {
  --tw-text-opacity: 1;
  color: rgb(255 107 138 / var(--tw-text-opacity, 1));
}

.hover\:text-\[\#ffd700\]:hover {
  --tw-text-opacity: 1;
  color: rgb(255 215 0 / var(--tw-text-opacity, 1));
}

.hover\:text-black:hover {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.focus\:outline-none:focus {
  outline: 2px solid transparent;
  outline-offset: 2px;
}

.focus\:ring-2:focus {
  --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);
  --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(2px + var(--tw-ring-offset-width)) var(--tw-ring-color);
  box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
}

.focus\:ring-\[\#ffd700\]:focus {
  --tw-ring-opacity: 1;
  --tw-ring-color: rgb(255 215 0 / var(--tw-ring-opacity, 1));
}

.disabled\:cursor-wait:disabled {
  cursor: wait;
}

.disabled\:opacity-60:disabled {
  opacity: 0.6;
}

@media (min-width: 640px) {
  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:gap-5 {
    gap: 1.25rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:py-5 {
    padding-top: 1.25rem;
    padding-bottom: 1.25rem;
  }

  .sm\:text-\[11px\] {
    font-size: 11px;
  }

  .sm\:text-\[30px\] {
    font-size: 30px;
  }

  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
