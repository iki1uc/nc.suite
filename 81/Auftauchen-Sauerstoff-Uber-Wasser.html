:root {
  --deep: #04121f;
  --navy: #07273d;
  --surface: #0a2236;
  --line: #2b637f;
  --ink: #eefcff;
  --muted: #a9d8e7;
  --cyan: #bff3ff;
  --gold: #f2c94c;
  --green: #8ce9b6;
  --surface-2: #d9f7ff;
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface-2: #082e42;
  }
}

* {
  box-sizing: border-box;
}

html {
  background: var(--deep);
}

body {
  margin: 0;
  min-width: 320px;
  background: var(--deep);
  color: var(--ink);
  font-family: "Courier New", Courier, monospace;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: .48;
}

.shell {
  min-height: 100vh;
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: calc(var(--safe-area-inset-top) + 26px) 16px 24px;
}

.top {
  text-align: center;
  padding: 18px 0 26px;
  border-bottom: 1px solid #29657f;
}

.eyebrow {
  color: var(--gold);
  letter-spacing: .18em;
  font-size: 10px;
  margin: 0 0 16px;
}

h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 400;
  margin: 0;
  line-height: .92;
  letter-spacing: -.04em;
  font-size: clamp(42px, 8vw, 84px);
}

h1 span {
  display: block;
  color: var(--cyan);
  font-size: .56em;
  letter-spacing: .06em;
  margin-bottom: 5px;
}

h1 i {
  color: var(--gold);
  font-size: .5em;
  font-style: normal;
}

h1 strong {
  display: inline-block;
  color: #fff;
}

.lede {
  max-width: 800px;
  margin: 20px auto 18px;
  color: var(--muted);
  line-height: 1.65;
  font-size: 14px;
}

.lede b {
  color: white;
}

.route {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  font-size: 12px;
}

.route span {
  padding: 6px 11px;
  border: 1px solid #356d87;
  border-radius: 99px;
}

.route small {
  color: var(--gold);
}

.route .air-chip {
  color: #071c27;
  background: var(--gold);
  border-color: var(--gold);
  font-weight: 800;
}

.main-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(280px, .85fr);
  gap: 16px;
  padding-top: 18px;
}

.dive-card, .log-card, .kv-card, .cascade-card {
  background: var(--surface);
  border: 1px solid #275d76;
  border-radius: 16px;
  padding: 17px;
}

.card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 14px;
}

.kicker {
  margin: 0 0 4px;
  color: var(--gold);
  font-size: 10px;
  letter-spacing: .18em;
}

h2 {
  font-family: Georgia, serif;
  font-size: 25px;
  line-height: 1;
  margin: 0;
  font-weight: 400;
}

.status {
  border: 1px solid var(--gold);
  color: var(--gold);
  padding: 5px 8px;
  border-radius: 99px;
  font-size: 9px;
  white-space: nowrap;
}

.meters {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.meters div {
  background: #041929;
  border-radius: 10px;
  padding: 11px;
  min-width: 0;
}

.meters span, .meters small {
  display: block;
  font-size: 9px;
  color: var(--muted);
}

.meters strong {
  display: block;
  font-size: 26px;
  line-height: 1.15;
  color: var(--cyan);
}

.meters div:nth-child(2) strong {
  color: var(--gold);
}

.water {
  height: 430px;
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  border: 1px solid #63b7d4;
  background: linear-gradient(to bottom, #bff3ff 0%, #68cbea 8%, #2494c2 22%, #146da0 48%, #0b3b61 74%, #041a2e 100%);
}

.air-zone {
  height: 12%;
  padding: 10px 14px;
  color: #0a2231;
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
}

.air-zone span {
  font-size: 9px;
  letter-spacing: .2em;
}

.air-zone b {
  font-size: 13px;
}

.air-zone i {
  font-size: 10px;
  font-style: normal;
}

.surface-line {
  height: 4px;
  background: white;
  box-shadow: 0 0 14px white;
  position: relative;
  z-index: 3;
}

.surface-line span {
  position: absolute;
  left: 50%;
  top: -13px;
  transform: translateX(-50%);
  background: white;
  color: #0c3c56;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  font-size: 11px;
}

.column-label {
  position: absolute;
  right: 12px;
  font-size: 11px;
  color: #e8faff;
  z-index: 2;
}

.top-label {
  top: 24%;
}

.mid-label {
  top: 50%;
}

.bottom-label {
  bottom: 10%;
}

.bubble {
  position: absolute;
  border: 1px solid rgba(255,255,255,.75);
  border-radius: 50%;
  animation: float 4s ease-in-out infinite alternate;
  opacity: .55;
}

@keyframes float {
  from {
    transform: translateY(-4px);
  }

  to {
    transform: translateY(14px);
  }
}

.diver {
  position: absolute;
  left: 30%;
  z-index: 5;
  transition: top 0.7s cubic-bezier(.2,.8,.2,1);
  display: flex;
  align-items: center;
  gap: 9px;
}

.diver-body {
  font-size: 40px;
  color: #ffe47a;
  text-shadow: 0 0 18px #f2c94c;
}

.diver-name {
  background: #04121f;
  border: 1px solid var(--gold);
  color: white;
  padding: 4px 7px;
  border-radius: 99px;
  font-size: 9px;
}

.diver-bubble {
  width: 14px;
  height: 14px;
  border: 2px solid white;
  border-radius: 50%;
  animation: float 1.2s ease-in-out infinite alternate;
}

.depth-ruler {
  position: absolute;
  right: 0;
  top: 12%;
  bottom: 0;
  width: 48px;
  z-index: 6;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 0;
}

.depth-ruler button {
  align-self: flex-end;
  background: #04121f;
  color: white;
  border: 1px solid #8cd8ef;
  border-radius: 8px 0 0 8px;
  padding: 5px 6px;
  font-size: 10px;
}

.depth-ruler button.active {
  background: var(--gold);
  color: #071c27;
  border-color: var(--gold);
}

.dive-note {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  margin: 13px 0;
}

.dive-note span {
  margin-left: auto;
  color: white;
  white-space: nowrap;
}

.slider-row {
  display: grid;
  grid-template-columns: 125px 1fr 70px;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 10px;
}

.slider-row input {
  width: 100%;
  accent-color: var(--gold);
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
}

.actions button {
  border-radius: 99px;
  border: 1px solid #4d8ea9;
  padding: 12px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  background: #0d344a;
  color: white;
  font-size: 12px;
}

.actions .primary {
  background: var(--gold);
  color: #071c27;
  border-color: var(--gold);
  font-weight: 800;
}

.actions .air {
  background: #bff3ff;
  color: #082d3e;
  border-color: white;
  font-weight: 800;
}

.actions .hold {
  background: #173b2a;
  color: var(--green);
  border-color: #4da878;
}

.actions .dive {
  background: transparent;
}

.notice {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 12px;
  padding: 11px 12px;
  border-radius: 8px;
  background: #fff5c5;
  color: #172d38;
  font-size: 12px;
  line-height: 1.45;
}

.side {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.log {
  min-height: 212px;
}

.log p {
  margin: 0;
  padding: 9px 0;
  border-bottom: 1px dotted #43788f;
  color: #b8e4f2;
  font-size: 11px;
  line-height: 1.45;
}

.log .fresh {
  color: white;
  font-weight: 700;
}

.fixline {
  color: var(--gold);
  font-size: 11px;
  line-height: 1.5;
}

.kv-card dl {
  margin: 0;
}

.kv-card dl div {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px dotted #43788f;
  font-size: 12px;
}

.kv-card dt {
  color: var(--muted);
}

.kv-card dd {
  margin: 0;
  text-align: right;
  color: white;
  font-weight: 700;
}

.kv-card .gold {
  color: var(--gold);
}

.mini {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: .12em;
  white-space: nowrap;
}

.cascade-card {
  margin-top: 16px;
}

.cascade {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
}

.cascade button {
  text-align: left;
  background: #041929;
  border: 1px solid #386f89;
  color: white;
  border-radius: 10px;
  padding: 14px 10px;
  min-width: 0;
}

.cascade button strong {
  display: block;
  color: var(--cyan);
  font-size: 22px;
}

.cascade button span {
  display: block;
  font-weight: 800;
  font-size: 11px;
  margin: 5px 0;
}

.cascade button small {
  color: var(--muted);
  font-size: 10px;
  line-height: 1.3;
  display: block;
}

.cascade button.active {
  background: var(--gold);
  border-color: var(--gold);
  color: #071c27;
}

.cascade button.active strong, .cascade button.active small {
  color: #132d38;
}

.cascade-note {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
  margin: 14px 0 0;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .08em;
  padding: 22px 0 8px;
  line-height: 1.7;
}

footer strong {
  color: var(--gold);
}

@media (max-width: 750px) {
  .main-grid {
    grid-template-columns: 1fr;
  }

  .shell {
    padding-left: 12px;
    padding-right: 12px;
  }

  .dive-card, .log-card, .kv-card, .cascade-card {
    padding: 14px;
  }

  .cascade {
    grid-template-columns: repeat(2, 1fr);
  }

  .cascade button:last-child {
    grid-column: span 2;
  }

  .actions {
    grid-template-columns: 1fr;
  }

  .dive-note {
    display: block;
  }

  .dive-note span {
    display: block;
    margin: 5px 0 0;
  }

  .slider-row {
    grid-template-columns: 1fr;
    gap: 4px;
  }

  .water {
    height: 390px;
  }

  .air-zone b {
    font-size: 11px;
  }

  .diver {
    left: 20%;
  }

  .meters strong {
    font-size: 21px;
  }
}

@media (max-width: 430px) {
  .card-head {
    align-items: flex-start;
  }

  .status {
    font-size: 8px;
  }

  .meters {
    grid-template-columns: 1fr 1fr;
  }

  .meters div:last-child {
    grid-column: span 2;
  }

  .cascade {
    grid-template-columns: 1fr;
  }

  .cascade button:last-child {
    grid-column: span 1;
  }
}
