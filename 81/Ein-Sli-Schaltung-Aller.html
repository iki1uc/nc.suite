  --violet:#ce93d8;

  :root{
    --bg:#050509;
    --surface:#0c0c15;
    --surface2:#12121e;
  }
}

*{
  box-sizing:border-box;
}

html{
  background:var(--bg);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size:16px;
  line-height:1.55;
}

button{
  font:inherit;
}

a{
  color:inherit;
}

@keyframes pulse-line{
  0%{
    stroke-dashoffset:24;
  }

  100%{
    stroke-dashoffset:0;
  }
}

@keyframes scan-sweep{
  0%{
    transform:translateX(-120%);
    opacity:0;
  }

  18%{
    opacity:1;
  }

  82%{
    opacity:1;
  }

  100%{
    transform:translateX(340%);
    opacity:0;
  }
}

@keyframes blink-dot{
  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.25;
  }
}

@keyframes flip-pop{
  0%{
    transform:scale(.96);
  }

  55%{
    transform:scale(1.02);
  }

  100%{
    transform:scale(1);
  }
}

@keyframes rise-in{
  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes spin-slow{
  to{
    transform:rotate(360deg);
  }
}

.animate-rise{
  animation: rise-in .45s ease both;
}

.scan-beam{
  animation: scan-sweep 1.6s linear infinite;
}

.blink{
  animation: blink-dot 1.1s ease-in-out infinite;
}

.flip-pop{
  animation: flip-pop .35s ease;
}

.switch-track{
  transition: background .22s, border-color .22s, box-shadow .22s;
}

.switch-knob{
  transition: transform .22s cubic-bezier(.2,.9,.25,1.2), background .22s;
}

.line-live{
  stroke-dasharray:6 6;
  animation: pulse-line 1s linear infinite;
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}
