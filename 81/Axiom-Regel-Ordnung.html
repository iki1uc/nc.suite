:root {
  --bg: #050509;
  --surface: #0b0b17;
  --surface-2: #121224;
  --line: #28283e;
  --ink: #efeff5;
  --muted: #a9aec9;
  --gold: #f2c94c;
  --teal: #80cbc4;
  --violet: #ce93d8;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050509;
    --surface: #0b0b17;
    --surface-2: #121224;
    --line: #28283e;
    --ink: #efeff5;
    --muted: #a9aec9;
  }
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
}

body {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

button, a {
  font: inherit;
}

a {
  color: inherit;
}

.app-shell {
  min-height: 100vh;
  padding-top: var(--safe-area-inset-top);
  background: radial-gradient(circle at 88% 8%, rgba(206,147,216,.14), transparent 28%), radial-gradient(circle at 5% 42%, rgba(128,203,196,.09), transparent 30%), var(--bg);
}

.page {
  width: min(1280px, 100%);
  margin: 0 auto;
  padding: 22px 16px 30px;
}

.top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  padding: 8px 2px 24px;
  border-bottom: 1px solid var(--line);
}

.eyebrow, .kicker {
  margin: 0 0 9px;
  color: var(--gold);
  font-size: 11px;
  letter-spacing: .18em;
  font-weight: 700;
}

h1 {
  margin: 0;
  font-size: clamp(38px, 7vw, 72px);
  line-height: .9;
  letter-spacing: -.055em;
}

h1 span {
  color: var(--gold);
}

.subtitle {
  margin: 13px 0 0;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.5;
  max-width: 620px;
}

.form-box {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 14px 17px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 16px;
  align-items: center;
}

.form-lines {
  display: grid;
  gap: 2px;
  color: var(--gold);
  font-size: 20px;
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: .12em;
}

.form-box p {
  margin: 0;
  font-size: 11px;
  line-height: 1.55;
  color: var(--muted);
}

.form-box strong {
  color: var(--ink);
}

.intro {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  margin: 20px 0 48px;
}

.intro > div {
  background: var(--surface);
  padding: 17px;
}

.intro .rule-no {
  color: var(--teal);
  font-size: 10px;
  letter-spacing: .18em;
  font-weight: 800;
}

.intro p {
  margin: 9px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.section-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 16px;
}

h2 {
  margin: 0;
  font-size: clamp(28px, 4vw, 40px);
  line-height: 1;
  letter-spacing: -.035em;
}

.section-note {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  max-width: 320px;
  text-align: right;
}

.section-note strong {
  color: var(--gold);
}

.nine-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.tile, .gap {
  min-width: 0;
  min-height: 248px;
  border: 1px solid var(--line);
  background: var(--surface);
  position: relative;
  overflow: hidden;
}

.tile-best {
  border-color: var(--gold);
  box-shadow: inset 0 0 0 1px rgba(242,201,76,.35);
}

.tile-head {
  min-height: 62px;
  padding: 13px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px solid var(--line);
  background: rgba(5,5,9,.55);
}

.tile-title {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}

.pos {
  color: var(--teal);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .12em;
}

.tile-title strong {
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.role {
  color: var(--muted);
  font-size: 10px;
  text-align: right;
  line-height: 1.35;
}

.tile-body {
  padding: 18px 14px 14px;
  display: flex;
  flex-direction: column;
  min-height: 186px;
}

.file-mark {
  display: flex;
  justify-content: space-between;
  align-items: start;
  color: var(--gold);
  font-size: 40px;
  line-height: 1;
  font-weight: 800;
}

.file-mark small {
  color: var(--line);
  font-size: 28px;
}

.tile-note {
  margin: 24px 0 12px;
  color: var(--muted);
  font-size: 12px;
}

.file-link {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  color: var(--teal);
  text-decoration: none;
  font-size: 11px;
  line-height: 1.4;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}

.file-link span {
  overflow-wrap: anywhere;
}

.file-link:hover {
  color: var(--gold);
}

.tile-foot {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 10px;
  color: var(--muted);
}

.tile-foot b {
  color: var(--ink);
}

.best-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--gold);
}

.gap {
  border-style: dashed;
  background: repeating-linear-gradient(0deg, transparent 0 11px, rgba(255,255,255,.035) 11px 12px), repeating-linear-gradient(90deg, transparent 0 11px, rgba(255,255,255,.035) 11px 12px), #050509;
  display: grid;
  place-items: center;
}

.scan {
  position: absolute;
  inset: -30% -10%;
  pointer-events: none;
  opacity: .55;
  mix-blend-mode: screen;
}

.scan-a {
  background: linear-gradient(90deg, transparent 0 42%, rgba(128,203,196,.85) 50%, transparent 58%);
  animation: sweep 2.1s linear infinite;
}

.scan-b {
  background: linear-gradient(90deg, transparent 0 42%, rgba(242,201,76,.8) 50%, transparent 58%);
  animation: sweep 2.6s linear infinite reverse;
}

@keyframes sweep {
  from {
    transform: translateX(-55%);
  }

  to {
    transform: translateX(55%);
  }
}

.gap-inner {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  text-align: center;
  color: var(--muted);
}

.gap-inner strong {
  color: var(--ink);
  font-size: 13px;
  letter-spacing: .12em;
}

.gap-inner span {
  font-size: 10px;
  letter-spacing: .12em;
}

.grid-caption {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}

.themes {
  margin-top: 64px;
}

.group-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.group {
  min-width: 0;
  min-height: 218px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  text-align: left;
  padding: 16px;
  display: flex;
  flex-direction: column;
  cursor: pointer;
}

.group:hover, .group:focus-visible {
  border-color: var(--teal);
  outline: none;
}

.group-active {
  border-color: var(--gold);
  box-shadow: inset 0 0 0 1px rgba(242,201,76,.4);
}

.group-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-bottom: 13px;
  border-bottom: 1px solid var(--line);
}

.group-head > span:first-child {
  color: var(--gold);
  font-size: 11px;
  font-weight: 800;
}

.group-head strong {
  font-size: 13px;
  letter-spacing: .04em;
}

.group ul {
  list-style: none;
  margin: 13px 0 auto;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.group li {
  font-size: 11px;
  line-height: 1.35;
  color: var(--muted);
  border: 1px solid var(--line);
  padding: 5px 7px;
  background: #08080f;
}

.group-active li {
  color: var(--ink);
  border-color: rgba(242,201,76,.38);
}

.group-count {
  margin-top: 14px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .1em;
}

.missing-group {
  border-color: rgba(206,147,216,.55);
  background: linear-gradient(135deg, rgba(206,147,216,.11), rgba(5,5,9,.2) 55%);
  cursor: default;
}

.open-pill {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--violet);
  font-size: 9px;
  letter-spacing: .1em;
}

.missing-intro {
  color: var(--muted);
  font-size: 11px;
  margin: 13px 0;
  line-height: 1.5;
}

.missing-cards {
  display: grid;
  gap: 7px;
  margin-bottom: auto;
}

.missing-card {
  display: grid;
  grid-template-columns: 28px 1fr auto 16px;
  align-items: center;
  gap: 8px;
  padding: 9px 8px;
  border: 1px solid rgba(206,147,216,.35);
  text-decoration: none;
  background: rgba(5,5,9,.35);
}

.missing-card:hover {
  border-color: var(--violet);
}

.missing-icon {
  color: var(--violet);
  display: grid;
  place-items: center;
}

.missing-text {
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.missing-text strong {
  font-size: 10px;
  overflow-wrap: anywhere;
}

.missing-text small {
  color: var(--muted);
  font-size: 9px;
  margin-top: 2px;
}

.missing-tag {
  color: var(--violet);
  font-size: 8px;
  letter-spacing: .1em;
}

.scoreboard {
  margin-top: 64px;
}

.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
}

table {
  width: 100%;
  min-width: 680px;
  border-collapse: collapse;
  font-size: 12px;
}

th {
  text-align: left;
  padding: 12px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .12em;
  border-bottom: 1px solid var(--line);
  background: #0d0d1b;
}

td {
  padding: 14px 12px;
  border-bottom: 1px solid rgba(255,255,255,.07);
  vertical-align: middle;
}

tbody tr:last-child td {
  border-bottom: 0;
}

.rank {
  color: var(--gold);
  font-weight: 800;
}

.rank span {
  display: inline-grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border: 1px solid var(--line);
  margin-right: 7px;
}

.pos-cell {
  color: var(--teal);
  font-weight: 800;
}

.file-cell {
  overflow-wrap: anywhere;
}

.score-cell {
  color: var(--gold);
  font-weight: 800;
  text-align: right;
}

.best-row {
  background: rgba(242,201,76,.07);
}

.score-note {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
  margin: 10px 0 0;
}

.score-note strong {
  color: var(--ink);
}

footer {
  margin-top: 54px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .12em;
}

@media (max-width: 760px) {
  .page {
    padding: 16px 12px 26px;
  }

  .top {
    flex-direction: column;
    align-items: stretch;
  }

  .form-box {
    width: 100%;
  }

  .intro {
    grid-template-columns: 1fr;
    margin-bottom: 36px;
  }

  .section-head {
    align-items: start;
    flex-direction: column;
    gap: 8px;
  }

  .section-note {
    text-align: left;
    max-width: none;
  }

  .nine-grid, .group-grid {
    grid-template-columns: 1fr;
  }

  .tile, .gap {
    min-height: 230px;
  }

  .tile-title strong {
    white-space: normal;
  }

  .group {
    min-height: 0;
  }

  .missing-card {
    grid-template-columns: 28px 1fr 16px;
  }

  .missing-tag {
    display: none;
  }

  .themes, .scoreboard {
    margin-top: 48px;
  }

  footer {
    justify-content: flex-start;
  }
}

@media (prefers-reduced-motion: reduce) {
  .scan {
    animation: none;
  }
}
</style>
