:root {
  --bg: #17101f;
  --surface: #24172f;
  --surface-2: #2d1e3b;
  --ink: #fff7e8;
  --muted: #c9b8d6;
  --line: rgba(255, 201, 77, .22);
  --gold: #ffc94d;
  --cyan: #4ee6ff;
  --magenta: #ff5ca8;
  --green: #7cffb2;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Space Grotesk", system-ui, sans-serif;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app-shell {
  min-height: 100vh;
  padding-top: var(--safe-area-inset-top);
  position: relative;
  overflow-x: clip;
  background: radial-gradient(circle at 88% 5%, rgba(255,92,168,.18), transparent 28%), radial-gradient(circle at 5% 30%, rgba(78,230,255,.10), transparent 30%), var(--bg);
}

.sun-glow {
  position: absolute;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,201,77,.25), transparent 65%);
  right: -100px;
  top: 20px;
  pointer-events: none;
}

.topbar {
  max-width: 1180px;
  margin: 0 auto;
  padding: 18px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  position: relative;
  z-index: 2;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
}

.brand strong {
  font-family: "Fraunces", Georgia, serif;
  font-size: 24px;
  letter-spacing: .04em;
}

.brand span:last-child {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: .16em;
}

.sun-dot {
  font-size: 22px;
}

.top-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.pill-btn {
  border: 1px solid var(--line);
  background: rgba(255,255,255,.05);
  color: var(--ink);
  padding: 9px 13px;
  border-radius: 999px;
  font-weight: 600;
}

.pill-btn.gold {
  background: var(--gold);
  color: #241300;
  border-color: var(--gold);
}

main {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 24px 40px;
  position: relative;
  z-index: 1;
}

.hero {
  display: grid;
  grid-template-columns: 1.35fr .65fr;
  gap: 36px;
  align-items: center;
  padding: 48px 0 62px;
  border-bottom: 1px solid var(--line);
}

.eyebrow, .kicker {
  color: var(--gold);
  font-weight: 700;
  letter-spacing: .18em;
  font-size: 12px;
  margin: 0 0 14px;
}

.hero h1 {
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(42px, 6vw, 76px);
  line-height: .98;
  margin: 0;
  font-weight: 800;
}

.hero h1 em {
  color: var(--gold);
  font-style: normal;
}

.sun-emoji {
  font-size: .72em;
}

.hero-sun {
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(26px, 3.5vw, 40px);
  color: var(--cyan);
  margin: 22px 0 8px;
}

.hero-lead {
  font-size: 22px;
  line-height: 1.35;
  margin: 0 0 12px;
  max-width: 620px;
}

.hero-small {
  color: var(--muted);
  line-height: 1.6;
  max-width: 620px;
  margin: 0;
}

.hero-buttons {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 28px;
}

.big-gold {
  border: 0;
  background: linear-gradient(100deg, #ffc94d, #ff8d5c);
  color: #271300;
  font-weight: 800;
  padding: 16px 20px;
  border-radius: 14px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 16px 40px rgba(255,145,80,.28);
}

.big-ghost {
  background: transparent;
  border: 1px solid rgba(78,230,255,.5);
  color: var(--ink);
  padding: 15px 18px;
  border-radius: 14px;
  font-weight: 700;
}

.hero-meta {
  display: flex;
  gap: 22px;
  margin-top: 24px;
  color: var(--muted);
  font-size: 13px;
}

.hero-visual {
  position: relative;
  min-height: 290px;
  display: grid;
  place-items: center;
}

.sun {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff2b8, #ffc94d 55%, #ff7a61);
  color: #2b1600;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 80px rgba(255,201,77,.55);
  transition: .3s;
}

.sun span {
  font-size: 58px;
}

.sun b {
  font-family: "Fraunces", Georgia, serif;
  font-size: 26px;
}

.sun small {
  font-size: 10px;
  letter-spacing: .2em;
}

.sun.dim {
  filter: grayscale(.5) brightness(.8);
  box-shadow: none;
}

.orbit {
  position: absolute;
  background: #1e142a;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 11px;
  font-size: 12px;
  font-weight: 700;
}

.o1 {
  top: 12px;
  left: 0;
  color: var(--cyan);
}

.o2 {
  right: 0;
  top: 120px;
  color: var(--magenta);
}

.o3 {
  bottom: 0;
  left: 14px;
  color: var(--gold);
}

.section {
  padding: 48px 0 8px;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 20px;
  margin-bottom: 22px;
}

.section-head h2, .sixd-panel h2, .triangle-panel h2 {
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(28px, 4vw, 42px);
  line-height: 1.05;
  margin: 0;
}

.section-note, .muted {
  color: var(--muted);
  line-height: 1.55;
}

.count {
  background: var(--gold);
  color: #241300;
  padding: 8px 12px;
  border-radius: 999px;
  font-weight: 800;
  white-space: nowrap;
}

.empty-index {
  display: flex;
  gap: 16px;
  align-items: center;
  border: 1px dashed rgba(255,201,77,.55);
  background: rgba(255,201,77,.06);
  border-radius: 18px;
  padding: 22px;
  flex-wrap: wrap;
}

.empty-index > span {
  font-size: 32px;
}

.empty-index div {
  flex: 1;
  min-width: 220px;
}

.empty-index p {
  color: var(--muted);
  margin: 5px 0 0;
}

.empty-index button, .path-card button {
  border: 0;
  background: var(--gold);
  color: #271300;
  font-weight: 800;
  padding: 11px 15px;
  border-radius: 10px;
}

.user-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.user-card {
  background: linear-gradient(145deg, #fff3cc, #ffd98d);
  color: #2a1700;
  padding: 20px;
  border-radius: 18px;
  min-width: 0;
}

.user-top {
  display: flex;
  align-items: center;
  gap: 8px;
}

.user-top small {
  flex: 1;
  font-weight: 700;
  letter-spacing: .08em;
}

.icon-close {
  border: 0;
  background: rgba(0,0,0,.08);
  border-radius: 50%;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
}

.user-card h3 {
  font-family: "Fraunces", Georgia, serif;
  font-size: 28px;
  margin: 16px 0 8px;
  overflow-wrap: anywhere;
}

.user-card > p {
  line-height: 1.5;
  min-height: 66px;
  overflow-wrap: anywhere;
}

.index-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 12px;
  font-weight: 700;
}

.index-facts span {
  background: rgba(255,255,255,.55);
  padding: 6px 8px;
  border-radius: 999px;
}

.index-lines {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid rgba(0,0,0,.12);
  font-size: 11px;
  font-weight: 800;
}

.path-banner {
  background: rgba(78,230,255,.1);
  border: 1px solid rgba(78,230,255,.3);
  padding: 14px 16px;
  border-radius: 12px;
  margin-bottom: 16px;
}

.path-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

.path-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  min-width: 0;
}

.path-card.active {
  border-color: var(--gold);
  background: #31203f;
  box-shadow: 0 0 0 2px rgba(255,201,77,.15);
}

.path-mood {
  color: var(--cyan);
  font-size: 11px;
  letter-spacing: .18em;
  font-weight: 800;
}

.path-card h3 {
  font-size: 19px;
  margin: 15px 0 8px;
  overflow-wrap: anywhere;
}

.path-card h3 span {
  color: var(--gold);
}

.path-card > strong {
  color: var(--gold);
}

.path-card > p {
  color: var(--muted);
  line-height: 1.55;
  min-height: 68px;
}

.sun-line {
  border-top: 1px solid var(--line);
  padding: 12px 0;
  font-size: 13px;
}

.path-card button {
  width: 100%;
}

.split-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.triangle-panel, .sixd-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 26px;
  min-width: 0;
}

.triangle-wrap {
  position: relative;
  max-width: 360px;
  margin: 18px auto 8px;
}

.triangle-wrap svg {
  width: 100%;
  height: auto;
  display: block;
}

.node {
  position: absolute;
  border: 1px solid var(--line);
  background: #1b1227;
  color: var(--ink);
  border-radius: 50%;
  width: 72px;
  height: 72px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transform: translate(-50%,-50%);
}

.node span {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .08em;
}

.node b {
  color: var(--gold);
}

.node.top {
  left: 50%;
  top: 10%;
}

.node.left {
  left: 10%;
  top: 84%;
}

.node.right {
  left: 90%;
  top: 84%;
}

.node.center {
  left: 50%;
  top: 61%;
  background: var(--gold);
  color: #271300;
}

.node.center b {
  color: #271300;
}

.node.selected {
  outline: 3px solid var(--cyan);
}

.triangle-detail {
  display: flex;
  gap: 12px;
  align-items: start;
  background: rgba(255,255,255,.04);
  padding: 14px;
  border-radius: 12px;
  margin-top: 12px;
}

.triangle-detail > span {
  width: 10px;
  height: 36px;
  border-radius: 5px;
  flex: 0 0 auto;
}

.triangle-detail p {
  color: var(--muted);
  margin: 4px 0 0;
  line-height: 1.5;
}

.point-box {
  margin: 18px 0;
  background: #170f24;
  border: 1px solid rgba(255,92,168,.35);
  padding: 16px;
  border-radius: 13px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.point-box span {
  color: var(--magenta);
  font-weight: 800;
  letter-spacing: .12em;
  font-size: 12px;
}

.point-box strong {
  color: var(--gold);
  font-size: 20px;
  overflow-wrap: anywhere;
}

.sliders {
  display: grid;
  gap: 13px;
}

.slider-row {
  display: grid;
  grid-template-columns: 24px 72px 1fr 32px;
  align-items: center;
  gap: 10px;
}

.dim-letter {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--gold);
  color: #271300;
  display: grid;
  place-items: center;
  font-weight: 900;
}

.dim-label {
  font-size: 11px;
  letter-spacing: .1em;
  font-weight: 800;
  color: var(--muted);
}

.slider-row input {
  width: 100%;
  accent-color: var(--cyan);
}

.sixd-foot {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  color: var(--muted);
  font-size: 11px;
  margin-top: 18px;
}

.module-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.module-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  min-width: 0;
  border-top: 3px solid var(--accent);
}

.module-tag {
  font-size: 11px;
  letter-spacing: .18em;
  font-weight: 900;
}

.module-card h3 {
  font-family: "Fraunces", Georgia, serif;
  font-size: 22px;
  margin: 14px 0 8px;
}

.module-card p {
  color: var(--muted);
  line-height: 1.55;
  min-height: 66px;
}

.module-card button {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 10px 14px;
  font-weight: 800;
}

.module-detail {
  margin-top: 16px;
  background: linear-gradient(90deg, rgba(255,201,77,.14), rgba(255,92,168,.12));
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 22px;
}

.module-detail-head {
  display: flex;
  justify-content: space-between;
  gap: 16px;
}

.module-detail-head h3 {
  font-family: "Fraunces", Georgia, serif;
  font-size: 28px;
  margin: 0;
}

.module-detail > p {
  line-height: 1.65;
  max-width: 780px;
}

.module-status {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 14px;
}

.module-status span {
  display: flex;
  align-items: center;
  gap: 6px;
}

.module-status strong {
  color: var(--ink);
}

.builder {
  background: linear-gradient(120deg, #33203f, #29173a 55%, #3c2430);
  border: 1px solid rgba(255,201,77,.35);
  border-radius: 24px;
  padding: 28px;
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 28px;
}

.builder h2 {
  font-family: "Fraunces", Georgia, serif;
  font-size: 38px;
  margin: 0;
}

.builder-intro > p:not(.kicker) {
  color: var(--muted);
  line-height: 1.6;
}

.builder-preview {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  background: rgba(0,0,0,.18);
  padding: 14px;
  border-radius: 12px;
  margin-top: 22px;
}

.builder-form {
  display: flex;
  flex-direction: column;
}

.builder-form label {
  font-weight: 800;
  margin: 0 0 8px;
}

.builder-form label:not(:first-child) {
  margin-top: 18px;
}

.builder-form input, .builder-form textarea, .gate-inputs input {
  width: 100%;
  background: #170f24;
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: 11px;
  padding: 13px 14px;
  outline: none;
}

.builder-form input:focus, .builder-form textarea:focus, .gate-inputs input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(255,201,77,.15);
}

.create-btn {
  margin-top: 18px;
  border: 0;
  background: linear-gradient(100deg, #ffc94d, #ff8d5c);
  color: #271300;
  border-radius: 12px;
  padding: 15px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.builder-note {
  color: var(--gold);
  line-height: 1.5;
  min-height: 24px;
}

.bottom-grid {
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  gap: 16px;
}

.log-panel, .gate-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 22px;
  min-width: 0;
}

.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.panel-head > span {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
}

.panel-head small {
  color: var(--muted);
}

.log-panel ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 9px;
}

.log-panel li {
  background: rgba(255,255,255,.04);
  padding: 11px 12px;
  border-radius: 9px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.gate-inputs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 18px 0;
}

.gate-inputs label span {
  display: block;
  font-size: 11px;
  letter-spacing: .12em;
  font-weight: 800;
  color: var(--muted);
  margin-bottom: 7px;
}

.gate-btn {
  width: 100%;
  border: 0;
  background: var(--cyan);
  color: #04222a;
  font-weight: 900;
  padding: 13px;
  border-radius: 11px;
}

.gate-result {
  margin-top: 15px;
  border: 1px solid;
  border-radius: 12px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.gate-result strong {
  font-size: 24px;
  letter-spacing: .12em;
}

.gate-result span {
  color: var(--ink);
  line-height: 1.45;
}

footer {
  max-width: 1180px;
  margin: 36px auto 0;
  padding: 26px 24px 34px;
  border-top: 1px solid var(--line);
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}

footer strong {
  flex: 1;
  min-width: 280px;
}

footer span:last-child {
  color: var(--muted);
}

.footer-sun {
  font-size: 22px;
}

@media (max-width: 760px) {
  .topbar, main, footer {
    padding-left: 16px;
    padding-right: 16px;
  }

  .topbar {
    align-items: flex-start;
  }

  .brand span:last-child {
    display: none;
  }

  .hero {
    grid-template-columns: 1fr;
    padding-top: 28px;
    gap: 18px;
  }

  .hero-visual {
    min-height: 230px;
  }

  .sun {
    width: 180px;
    height: 180px;
  }

  .o1 {
    left: 2px;
  }

  .o2 {
    right: 2px;
  }

  .user-grid, .path-grid, .module-grid {
    grid-template-columns: 1fr;
  }

  .split-layout, .builder, .bottom-grid {
    grid-template-columns: 1fr;
  }

  .section-head {
    align-items: flex-start;
    flex-direction: column;
  }

  .section-note {
    margin: 0;
  }

  .builder {
    padding: 20px;
  }

  .gate-inputs {
    grid-template-columns: 1fr;
  }

  .path-card > p, .module-card p, .user-card > p {
    min-height: 0;
  }

  footer strong {
    min-width: 0;
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17101f;
    --surface: #24172f;
    --ink: #fff7e8;
  }
}
