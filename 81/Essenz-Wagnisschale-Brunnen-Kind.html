:root {

  --panel: #0a0d08;
  --gold: #f2c94c;
  --cream: #f2ead1;
  --green: #7ee787;
  --muted: #9cb09b;
  --brown: #8b5a2b;
  --brown-deep: #4a2d12;
  --line: #2a3a25;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050805;
    --panel: #0a0d08;
    --gold: #f2c94c;
    --cream: #f2ead1;
  }
}

* {
  box-sizing: border-box;
}

html, body, #root {
  margin: 0;
  min-height: 100%;
}

body {
  background: var(--bg);
  color: var(--cream);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: .55;
}

@keyframes flyEssenz {
  0% {
    transform: translate(0, 0) scale(1) rotate(0deg);
    opacity: 1;
  }

  35% {
    transform: translate(-18vw, -78px) scale(.85) rotate(-18deg);
    opacity: 1;
  }

  70% {
    transform: translate(-28vw, -18px) scale(.65) rotate(18deg);
    opacity: 1;
  }

  100% {
    transform: translate(-31vw, 8px) scale(.25);
    opacity: 0;
  }
}

@keyframes wobble {
  0%, 100% {
    transform: rotate(0deg);
  }

  18% {
    transform: rotate(-6deg);
  }

  38% {
    transform: rotate(5deg);
  }

  58% {
    transform: rotate(-3.5deg);
  }

  78% {
    transform: rotate(2deg);
  }

  92% {
    transform: rotate(-.8deg);
  }
}

@keyframes bowlPulse {
  0%, 100% {
    box-shadow: 0 0 0 rgba(242,201,76,0);
  }

  50% {
    box-shadow: 0 0 34px rgba(242,201,76,.42);
  }
}

@keyframes riseChild {
  from {
    transform: translateY(34px) scale(.97);
    opacity: 0;
  }

  to {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
}

@keyframes ripple {
  from {
    transform: scale(.6);
    opacity: .8;
  }

  to {
    transform: scale(1.5);
    opacity: 0;
  }
}

.fly {
  animation: flyEssenz 1.05s cubic-bezier(.45,.05,.65,.95) forwards;
}

.weighing {
  animation: wobble 1.55s ease-in-out .2s;
}

.balanced-bowl {
  animation: bowlPulse 2.2s ease-in-out infinite;
}

.rise {
  animation: riseChild .55s ease-out both;
}

.ripple {
  animation: ripple 1.2s ease-out infinite;
}
