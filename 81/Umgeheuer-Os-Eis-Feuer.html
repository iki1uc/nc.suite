:root{
  --bg:#05080c;
  --surface:#0c1218;
  --surface2:#121a24;
  --line:#1e2b38;
  --text:#e8f0f8;
  --muted:#7d8b9a;
  --ice:#00c8ff;
  --fire:#ff4400;
  --neutral:#00e88f;
  --warn:#ffcc00;
  --danger:#ff3344;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:ui-monospace,Menlo,Consolas,monospace
}

button{
  font:inherit
}

.app-shell{
  min-height:100vh;
  width:100%;
  padding-top:var(--safe-area-inset-top);
  background:radial-gradient(ellipse at center top,#10192a 0%,#05080c 70%);
  overflow-x:clip
}

.page{
  max-width:1180px;
  margin:0 auto;
  padding:20px 16px 42px
}

.hero{
  text-align:center;
  padding:14px 0 22px
}

.eyebrow{
  display:flex;
  gap:7px;
  justify-content:center;
  align-items:center;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.28em
}

h1{
  font-size:clamp(38px,7vw,68px);
  line-height:.95;
  margin:12px 0 8px;
  font-weight:900;
  letter-spacing:.06em
}

.ice-letter{
  color:var(--ice);
  text-shadow:0 0 24px var(--ice)
}

.fire-letter{
  color:var(--fire);
  text-shadow:0 0 24px var(--fire)
}

.os{
  color:var(--text);
  opacity:.58
}

.hero p{
  color:var(--muted);
  font-size:14px;
  margin:0
}

.hero p strong{
  color:var(--text)
}

.hero-note{
  display:inline-flex;
  gap:7px;
  align-items:center;
  margin-top:12px;
  padding:7px 11px;
  border:1px solid rgba(255,68,0,.35);
  border-radius:999px;
  background:rgba(255,68,0,.08);
  font-size:11px;
  color:#ffb9a1
}

.puppets{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin:12px 0
}

.puppet{
  min-width:0;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--surface);
  color:var(--text);
  padding:12px;
  text-align:left;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:9px;
  transition:.2s
}

.puppet:hover,.puppet.active{
  transform:translateY(-2px);
  border-color:var(--p);
  box-shadow:0 8px 28px color-mix(in srgb,var(--p) 25%,transparent)
}

.puppet-icon{
  font-size:22px
}

.puppet span{
  display:flex;
  flex-direction:column
}

.puppet b{
  font-size:13px;
  letter-spacing:.12em;
  color:var(--p)
}

.puppet small{
  font-size:10px;
  color:var(--muted);
  margin-top:3px
}

.puppet-action{
  font-size:9px!important;
  color:var(--muted)!important;
  letter-spacing:.14em
}

.status-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:14px
}

.stat{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:3px
}

.stat>span{
  display:flex;
  gap:6px;
  align-items:center;
  color:var(--muted);
  font-size:9px;
  letter-spacing:.18em
}

.stat strong{
  font-size:26px;
  line-height:1.1
}

.stat em{
  font-style:normal;
  color:var(--muted);
  font-size:9px
}

.stat .mode{
  font-size:18px;
  color:var(--neutral)
}

.mini-bar{
  height:5px;
  background:rgba(255,255,255,.08);
  border-radius:99px;
  overflow:hidden;
  margin-top:4px
}

.mini-bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--danger),var(--warn),var(--neutral));
  transition:width .3s
}

.arena{
  display:grid;
  grid-template-columns:1fr 230px 1fr;
  gap:12px;
  min-height:410px;
  margin-bottom:14px
}

.zone{
  border-radius:16px;
  padding:14px;
  display:flex;
  flex-direction:column
}

.ice-zone{
  background:linear-gradient(180deg,rgba(0,200,255,.1),rgba(0,150,200,.03));
  border:1px solid rgba(0,200,255,.3)
}

.fire-zone{
  background:linear-gradient(180deg,rgba(255,68,0,.1),rgba(255,136,0,.03));
  border:1px solid rgba(255,68,0,.3)
}

.zone-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  letter-spacing:.22em;
  padding-bottom:9px
}

.ice-zone .zone-head{
  color:var(--ice);
  border-bottom:1px solid rgba(0,200,255,.2)
}

.fire-zone .zone-head{
  color:var(--fire);
  border-bottom:1px solid rgba(255,68,0,.2)
}

.zone-head span{
  display:flex;
  align-items:center;
  gap:6px
}

.zone-sub{
  color:var(--muted);
  font-size:10px;
  margin:10px 0 0
}

.cells{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-top:10px
}

.cell{
  aspect-ratio:1;
  border-radius:5px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  transition:.35s
}

.ice-cell.on{
  background:radial-gradient(circle,rgba(0,200,255,.72),rgba(0,150,200,.25));
  border-color:var(--ice);
  box-shadow:0 0 12px rgba(0,200,255,.45)
}

.fire-cell.on{
  background:radial-gradient(circle,rgba(255,68,0,.72),rgba(255,136,0,.25));
  border-color:var(--fire);
  box-shadow:0 0 12px rgba(255,68,0,.45);
  animation:flicker .5s infinite alternate
}

@keyframes flicker{
  from{
    opacity:.78
  }

  to{
    opacity:1
  }
}

.monster-zone{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center
}

.monster{
  width:200px;
  height:200px;
  position:relative;
  animation:breathe 3s ease-in-out infinite;
  transition:filter .4s
}

@keyframes breathe{
  0%,100%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.04)
  }
}

.monster.is-frozen{
  animation:none;
  filter:brightness(.62) saturate(.45) hue-rotate(180deg)
}

.monster.is-dead{
  animation:shatter .6s forwards
}

@keyframes shatter{
  0%{
    transform:scale(1)
  }

  40%{
    transform:scale(1.15) rotate(4deg)
  }

  100%{
    transform:scale(.72) rotate(-4deg);
    opacity:.3;
    filter:grayscale(1)
  }
}

.monster-svg{
  width:100%;
  height:100%;
  filter:drop-shadow(0 0 20px currentColor)
}

.monster-shadow{
  position:absolute;
  bottom:-6px;
  left:50%;
  transform:translateX(-50%);
  width:124px;
  height:10px;
  background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent);
  border-radius:50%
}

.monster-copy{
  margin-top:18px;
  display:flex;
  flex-direction:column
}

.monster-copy b{
  font-size:14px;
  letter-spacing:.24em;
  color:var(--neutral)
}

.monster-copy span{
  font-size:10px;
  letter-spacing:.2em;
  color:var(--muted);
  margin-top:4px
}

.quote{
  margin-top:14px;
  padding:10px 12px;
  border:1px solid;
  border-radius:11px;
  background:rgba(0,0,0,.35);
  font-size:12px;
  line-height:1.4;
  max-width:230px
}

.controls{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  margin-bottom:14px
}

.slider-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:14px
}

.slider-row label{
  font-size:11px;
  color:var(--muted);
  letter-spacing:.18em
}

.slider-row input{
  flex:1;
  height:8px;
  background:linear-gradient(90deg,var(--ice),var(--neutral),var(--fire));
  border-radius:4px;
  -webkit-appearance:none;
     -moz-appearance:none;
          appearance:none;
  cursor:pointer
}

.slider-row input::-webkit-slider-thumb{
  -webkit-appearance:none;
          appearance:none;
  width:22px;
  height:22px;
  background:#fff;
  border-radius:50%;
  border:3px solid #0a0e13;
  box-shadow:0 0 12px rgba(255,255,255,.6);
  cursor:pointer
}

.slider-row output{
  font-weight:900;
  color:var(--warn);
  min-width:52px;
  text-align:right
}

.button-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}

.btn{
  border:0;
  border-radius:11px;
  padding:13px 12px;
  font-weight:900;
  font-size:12px;
  letter-spacing:.08em;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:.2s
}

.btn small{
  display:block;
  font-weight:400;
  font-size:9px;
  letter-spacing:0;
  text-transform:none
}

.btn:disabled{
  opacity:.28;
  cursor:not-allowed
}

.btn.freeze{
  background:linear-gradient(135deg,var(--ice),#0096c8);
  color:#001828
}

.btn.go{
  background:linear-gradient(135deg,var(--fire),#ff8800);
  color:#1a0000
}

.btn.wunder{
  background:linear-gradient(135deg,var(--warn),#ff9900);
  color:#1a1000
}

.btn:hover:not(:disabled){
  transform:translateY(-2px)
}

.nc-panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin-bottom:14px
}

.nc-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.nc-head>span{
  font-size:11px;
  letter-spacing:.22em;
  color:var(--warn)
}

.nc-head small{
  color:var(--muted);
  font-size:10px
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px
}

.chip{
  border:1px solid var(--line);
  background:#101820;
  color:var(--text);
  border-radius:999px;
  padding:8px 11px;
  font-size:10px;
  letter-spacing:.08em;
  cursor:pointer
}

.chip:hover{
  border-color:var(--warn);
  color:var(--warn)
}

.nc-panel p{
  font-size:11px;
  color:var(--muted);
  margin:10px 0 0
}

.log-box{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px
}

.log-box h2{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  letter-spacing:.24em;
  color:var(--muted);
  margin:0 0 8px
}

.log-box h2 small{
  letter-spacing:0
}

.log{
  max-height:150px;
  overflow-y:auto;
  background:rgba(0,0,0,.4);
  border-radius:7px;
  padding:8px;
  font-size:11px;
  line-height:1.6
}

.log-line{
  display:flex;
  gap:8px;
  color:var(--muted)
}

.log-line time{
  flex:0 0 auto;
  color:#5b6a7a
}

.log-line:first-child{
  color:var(--text)
}

.log-line.warn{
  color:var(--warn)
}

.log-line.err{
  color:var(--danger)
}

.log-line.ok{
  color:var(--neutral)
}

.log-line.puppet{
  color:#c4b5fd
}

footer{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:6px;
  margin-top:18px;
  color:var(--muted);
  font-size:10px
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(5,8,12,.94);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
  backdrop-filter:blur(6px)
}

.overlay-card{
  background:var(--surface);
  border:2px solid var(--line);
  border-radius:20px;
  padding:30px;
  max-width:440px;
  width:100%;
  text-align:center
}

.dead-mark{
  font-size:42px
}

.overlay-card h2{
  font-size:30px;
  color:var(--danger);
  margin:8px 0
}

.overlay-card p{
  color:var(--muted)
}

.final-score{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin:16px 0
}

.final-score b{
  font-size:38px;
  color:var(--warn)
}

.final-score small{
  color:var(--muted)
}

.particle{
  position:fixed;
  left:50%;
  top:50%;
  width:8px;
  height:8px;
  border-radius:50%;
  pointer-events:none;
  z-index:9999;
  animation:fly 1.3s ease-out forwards
}

@keyframes fly{
  to{
    opacity:0;
    transform:translate(var(--dx),var(--dy)) scale(0)
  }
}

.flash{
  animation:flash .8s ease-out
}

@keyframes flash{
  0%{
    box-shadow:inset 0 0 0 0 rgba(255,204,0,.8)
  }

  100%{
    box-shadow:inset 0 0 0 100vmax rgba(255,204,0,0)
  }
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#05080c;
    --surface:#0c1218;
    --text:#e8f0f8
  }
}

@media(max-width:760px){
  .puppets{
    grid-template-columns:repeat(2,1fr)
  }

  .puppets .puppet:last-child{
    grid-column:span 2
  }

  .status-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .arena{
    grid-template-columns:1fr;
    min-height:0
  }

  .monster-zone{
    order:-1;
    padding:8px 0
  }

  .monster{
    width:160px;
    height:160px
  }

  .cells{
    grid-template-columns:repeat(6,1fr)
  }

  .button-row{
    grid-template-columns:1fr
  }

  .nc-head{
    align-items:flex-start;
    flex-direction:column
  }
}

@media(max-width:430px){
  .page{
    padding:14px 10px 30px
  }

  .puppets{
    grid-template-columns:1fr
  }

  .puppets .puppet:last-child{
    grid-column:auto
  }

  .status-grid{
    grid-template-columns:1fr 1fr
  }

  .stat strong{
    font-size:22px
  }
}
