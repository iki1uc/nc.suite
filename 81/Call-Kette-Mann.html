  color: rgb(122 140 166 / var(--tw-text-opacity, 1));
}

.text-\[\#7ce0a8\] {
  --tw-text-opacity: 1;
  color: rgb(124 224 168 / var(--tw-text-opacity, 1));

.text-\[\#a0b4cc\] {
  --tw-text-opacity: 1;
  color: rgb(160 180 204 / var(--tw-text-opacity, 1));
}

.text-\[\#ffcc44\] {
  --tw-text-opacity: 1;
  color: rgb(255 204 68 / var(--tw-text-opacity, 1));
}

.text-\[var\(--ink\)\] {
  color: var(--ink);
}

.text-white {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.blur-\[40px\] {
  --tw-blur: blur(40px);

}

.blur-\[50px\] {

}

.transition {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root {
  --bg: #04070e;
  --panel: #0a101e;
  --line: #1e2d4a;
  --ink: #c8d8e8;
  --safe-area-inset-top: 0px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #04070e;
    --panel: #0a101e;
    --line: #1e2d4a;
    --ink: #c8d8e8;
  }
}

* {
  box-sizing: border-box;
}

html, body, #root {
  min-height: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

button {
  font-family: inherit;
}

button:focus-visible {
  outline: 2px solid #ffcc44;
  outline-offset: 2px;
}

::-webkit-scrollbar {
  height: 8px;
  width: 8px;
}

::-webkit-scrollbar-thumb {
  background: #1e2d4a;
  border-radius: 4px;
}

.pulse-node {
  animation: pulseNode 0.55s ease-in-out infinite alternate;
}

@keyframes pulseNode {
  from {
    transform: translateY(0);
  }

  to {
    transform: translateY(-2px);
  }
}

@media (prefers-reduced-motion: reduce) {
  .pulse-node {
    animation: none;
  }
}

.last\:border-0:last-child {
  border-width: 0px;
}

.disabled\:opacity-50:disabled {
  opacity: 0.5;
}

@media (min-width: 640px) {
  .sm\:inline {
    display: inline;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-6 {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }

  .md\:grid-cols-\[0\.9fr_1\.1fr\] {
    grid-template-columns: 0.9fr 1.1fr;
  }

  .md\:grid-cols-\[1\.1fr_0\.9fr\] {
    grid-template-columns: 1.1fr 0.9fr;
  }

  .md\:grid-cols-\[1\.2fr_0\.8fr\] {
    grid-template-columns: 1.2fr 0.8fr;
  }

  .md\:p-5 {
    padding: 1.25rem;
  }

  .md\:p-7 {
    padding: 1.75rem;
  }

  .md\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .md\:pt-9 {
    padding-top: 2.25rem;
  }

  .md\:text-\[13px\] {
    font-size: 13px;
  }

  .md\:text-\[42px\] {
    font-size: 42px;
  }

  .md\:text-\[9px\] {
    font-size: 9px;
  }
}
