:root{
  --bg:#050a12;
  --surface:#0a1422;
  --surface2:#0e1b2e;
  --line:#1c2f4a;
  --text:#eaf6ff;
  --muted:#8fa8c0;
  --cyan:#22d3ee;
  --blue:#3b82f6;
  --orange:#ff6b1a;
  --amber:#ffb020;
  --green:#34d399;
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

.app-shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  background:radial-gradient(900px 420px at 15% -10%,rgba(34,211,238,.18),transparent 60%),radial-gradient(700px 380px at 95% 10%,rgba(255,107,26,.14),transparent 55%),var(--bg)
}

.topbar{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding:14px 22px;
  border-bottom:1px solid var(--line);
  background:rgba(5,10,18,.92);
  backdrop-filter:blur(10px)
}

.brand{
  display:flex;
  gap:12px;
  align-items:center
}

.brand-mark{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border:1px solid var(--cyan);
  color:var(--cyan);
  border-radius:10px;
  background:rgba(34,211,238,.12)
}

.brand-title{
  font-weight:900;
  letter-spacing:.06em;
  font-size:18px
}

.brand-title span{
  color:var(--cyan)
}

.brand-sub{
  font-size:10px;
  letter-spacing:.14em;
  color:var(--muted)
}

.top-stats{
  display:flex;
  gap:18px;
  align-items:center
}

.top-stats>div{
  display:flex;
  gap:7px;
  align-items:baseline
}

.top-stats label{
  font-size:10px;
  color:var(--muted);
  letter-spacing:.12em
}

.top-stats strong{
  font-size:16px
}

.live{
  border:1px solid var(--line);
  padding:7px 10px;
  border-radius:999px;
  font-size:10px;
  letter-spacing:.1em
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#64748b;
  display:inline-block
}

.dot.on{
  background:var(--cyan);
  box-shadow:0 0 12px var(--cyan);
  animation:pulse 1s infinite
}

@keyframes pulse{
  50%{
    opacity:.45
  }
}

.layout{
  max-width:1440px;
  margin:0 auto;
  padding:20px;
  display:grid;
  grid-template-columns:minmax(0,1.55fr) minmax(320px,.85fr);
  gap:18px
}

.pump-panel{
  background:linear-gradient(180deg,#0a1829,#07101d);
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px;
  min-width:0
}

.panel-head{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:flex-start
}

.eyebrow{
  font-size:10px;
  letter-spacing:.18em;
  color:var(--cyan);
  font-weight:800
}

.panel-head h1{
  font-size:clamp(30px,4vw,48px);
  line-height:.98;
  margin:8px 0 0;
  letter-spacing:-.04em
}

.temp-big{
  text-align:right;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:2px;
  color:var(--cyan)
}

.temp-big>span{
  font-size:34px;
  font-weight:900
}

.temp-big small{
  font-size:9px;
  color:var(--muted);
  letter-spacing:.12em
}

.pump-stage{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:24px;
  align-items:center;
  margin:22px 0
}

.pump-ring{
  --speed:2s;
  width:300px;
  height:300px;
  border-radius:50%;
  border:1px solid #24405f;
  position:relative;
  display:grid;
  place-items:center;
  background:radial-gradient(circle,#071524 0 38%,#0b2138 39% 58%,#071524 59%);
  box-shadow:0 0 0 10px rgba(14,27,46,.6),0 0 45px rgba(34,211,238,.12)
}

.orbit{
  position:absolute;
  border:1px dashed rgba(34,211,238,.35);
  border-radius:50%;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.orbit-a{
  inset:18px
}

.orbit-a span{
  color:var(--cyan);
  font-size:20px
}

.orbit-b{
  inset:42px;
  border-style:solid;
  border-color:rgba(59,130,246,.35)
}

.orbit-b i{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--blue);
  box-shadow:0 0 10px var(--blue)
}

.pump-ring.spinning .orbit-a{
  animation:spin var(--speed) linear infinite
}

.pump-ring.spinning .orbit-b{
  animation:spinRev calc(var(--speed)*1.6) linear infinite
}

@keyframes spin{
  to{
    transform:rotate(360deg)
  }
}

@keyframes spinRev{
  to{
    transform:rotate(-360deg)
  }
}

.pump-core{
  width:172px;
  height:172px;
  border-radius:50%;
  border:2px solid var(--cyan);
  position:relative;
  overflow:hidden;
  background:#04101e;
  display:grid;
  place-items:center;
  text-align:center
}

.fluid{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  background:linear-gradient(180deg,var(--cyan),#0369a1);
  transition:height .3s;
  opacity:.75
}

.fluid span{
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(255,255,255,.18) 19px 20px)
}

.core-text{
  position:relative;
  z-index:1
}

.core-text small{
  display:block;
  font-size:8px;
  letter-spacing:.14em
}

.core-text strong{
  font-size:28px
}

.core-text em{
  display:block;
  font-size:10px;
  color:#c8f5ff;
  font-style:normal
}

.tick{
  position:absolute;
  width:2px;
  height:10px;
  background:#3f5b7d
}

.tick-1{
  top:3px
}

.tick-2{
  bottom:3px
}

.tick-3{
  left:3px;
  top:50%
}

.tick-4{
  right:3px;
  top:50%
}

.pump-side{
  min-width:0
}

.run-display{
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
  background:var(--surface2)
}

.run-display>span{
  font-size:9px;
  letter-spacing:.16em;
  color:var(--muted)
}

.run-lights{
  display:flex;
  gap:8px;
  margin:10px 0
}

.run-lights button{
  flex:1;
  padding:12px 8px;
  background:#071525;
  border:1px solid var(--line);
  color:var(--muted);
  border-radius:8px;
  font-weight:900
}

.run-lights button.on{
  color:#04121d;
  background:var(--cyan);
  border-color:var(--cyan)
}

.run-lights button.on.double{
  background:var(--amber);
  border-color:var(--amber)
}

.run-display p{
  margin:0;
  font-size:12px;
  line-height:1.5;
  color:var(--muted)
}

.mini-bars{
  margin-top:16px
}

.mini-bars>div{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  margin:10px 0 5px
}

.mini-bars span{
  color:var(--muted);
  letter-spacing:.1em
}

.bar{
  height:12px;
  background:#071525;
  border:1px solid var(--line);
  border-radius:99px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  border-radius:99px;
  transition:width .25s
}

.bar.magma i{
  background:linear-gradient(90deg,#ffb020,var(--orange),#ef4444)
}

.bar.gpu i{
  background:linear-gradient(90deg,var(--cyan),var(--blue))
}

.actions{
  display:grid;
  grid-template-columns:1.15fr .8fr .8fr 1fr;
  gap:10px
}

.big{
  border:0;
  border-radius:12px;
  padding:15px 12px;
  font-weight:900;
  letter-spacing:.04em;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:58px
}

.big small{
  font-size:9px;
  letter-spacing:.12em
}

.pump-btn{
  background:var(--cyan);
  color:#03131b
}

.pump-btn.active{
  background:#0ea5b7;
  color:white;
  box-shadow:0 0 24px rgba(34,211,238,.45)
}

.run-btn{
  background:var(--blue);
  color:white
}

.runrun-btn{
  background:var(--amber);
  color:#241400
}

.finish-btn{
  background:#102a1c;
  color:#a7f3d0;
  border:1px solid #2b6a4a;
  flex-direction:column;
  line-height:1.1
}

.hint{
  font-size:11px;
  line-height:1.6;
  color:var(--muted);
  margin:12px 0 0
}

.side{
  display:flex;
  flex-direction:column;
  gap:18px;
  min-width:0
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px
}

.card-title{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:11px;
  font-weight:900;
  letter-spacing:.12em
}

.card-title span{
  margin-left:auto;
  color:var(--muted);
  font-weight:400;
  letter-spacing:.05em;
  font-size:10px
}

.slider-row{
  display:block;
  margin-top:18px
}

.slider-row>span{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px
}

.slider-row b{
  margin-left:auto
}

.slider-row em{
  display:block;
  text-align:right;
  font-size:9px;
  color:var(--muted);
  font-style:normal
}

.slider-row input{
  width:100%;
  accent-color:var(--cyan);
  margin:8px 0 3px
}

.presets{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:14px
}

.presets button{
  background:#071525;
  border:1px solid var(--line);
  color:var(--text);
  border-radius:8px;
  padding:9px;
  font-size:10px;
  font-weight:800
}

.presets button:hover{
  border-color:var(--cyan);
  color:var(--cyan)
}

.steps{
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-top:14px
}

.step{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  color:var(--muted);
  padding:8px;
  border-radius:9px
}

.step span{
  width:26px;
  height:26px;
  display:grid;
  place-items:center;
  border:1px solid var(--line);
  border-radius:50%;
  font-size:11px
}

.step.done{
  color:var(--text)
}

.step.done span{
  background:var(--cyan);
  color:#03131b;
  border-color:var(--cyan)
}

.step.current{
  border-color:var(--cyan);
  background:rgba(34,211,238,.08);
  color:var(--text)
}

.step em{
  margin-left:auto;
  font-style:normal
}

.stage-line{
  height:5px;
  background:#071525;
  border-radius:99px;
  margin:12px 0
}

.stage-line i{
  display:block;
  height:100%;
  background:var(--cyan);
  border-radius:99px;
  transition:width .4s
}

.stages-card p{
  font-size:11px;
  line-height:1.6;
  color:var(--muted);
  margin:0
}

.brain-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:14px
}

.tile{
  aspect-ratio:1.25;
  background:#071525;
  border:1px solid var(--line);
  border-radius:9px;
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px
}

.tile span{
  font-weight:900;
  font-size:15px
}

.tile small{
  font-size:8px;
  color:var(--muted)
}

.tile.filled{
  border-color:#2d7a90;
  background:rgba(34,211,238,.08)
}

.tile.gap{
  border-style:dashed;
  color:#5b7187
}

.tile.selected{
  outline:2px solid var(--cyan);
  background:rgba(34,211,238,.18)
}

.tile-detail{
  margin-top:12px;
  padding:11px;
  background:#071525;
  border-radius:9px;
  display:flex;
  flex-direction:column;
  gap:3px
}

.tile-detail b{
  font-size:12px
}

.tile-detail span{
  font-size:10px;
  color:var(--muted)
}

.layers{
  font-size:9px;
  color:var(--muted);
  margin-top:10px;
  letter-spacing:.08em;
  text-align:center
}

.log-card{
  grid-column:1/-1;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px
}

.log-head{
  display:flex;
  align-items:center;
  gap:10px
}

.log-head h2{
  margin:4px 0 0;
  font-size:22px
}

.log-head button{
  margin-left:auto;
  background:#071525;
  border:1px solid var(--line);
  color:var(--text);
  border-radius:8px;
  padding:8px 10px;
  display:flex;
  gap:6px;
  align-items:center;
  font-size:11px
}

.log-head button+button{
  margin-left:0
}

.log-list{
  max-height:240px;
  overflow:auto;
  margin-top:16px;
  border-top:1px solid var(--line)
}

.log-row{
  display:grid;
  grid-template-columns:78px 72px 1fr;
  gap:10px;
  padding:10px 2px;
  border-bottom:1px solid #122337;
  font-size:12px;
  line-height:1.45
}

.tag{
  font-size:9px;
  font-weight:900;
  padding:4px 6px;
  border-radius:4px;
  text-align:center;
  height:-moz-fit-content;
  height:fit-content
}

.tag.pump{
  background:rgba(34,211,238,.18);
  color:var(--cyan)
}

.tag.run{
  background:rgba(255,176,32,.18);
  color:var(--amber)
}

.tag.system{
  background:#16263a;
  color:#a9bcd1
}

.time{
  color:var(--muted)
}

.empty{
  color:var(--muted);
  font-size:12px
}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  margin-top:14px;
  color:var(--muted);
  font-size:10px
}

.legend span{
  display:flex;
  align-items:center;
  gap:6px
}

.legend i{
  width:10px;
  height:10px;
  border-radius:50%;
  display:inline-block
}

.c-cyan{
  background:var(--cyan)
}

.c-orange{
  background:var(--orange)
}

.c-blue{
  background:var(--blue)
}

footer{
  max-width:1440px;
  margin:0 auto;
  padding:0 20px 24px;
  color:var(--muted);
  font-size:10px;
  line-height:1.6
}

@media(max-width:820px){
  .topbar{
    align-items:flex-start
  }

  .top-stats{
    flex-direction:column;
    align-items:flex-end;
    gap:6px
  }

  .layout{
    grid-template-columns:1fr;
    padding:14px
  }

  .pump-panel{
    padding:16px
  }

  .pump-stage{
    grid-template-columns:1fr;
    justify-items:center
  }

  .pump-ring{
    width:272px;
    height:272px
  }

  .pump-side{
    width:100%
  }

  .actions{
    grid-template-columns:1fr 1fr
  }

  .log-head{
    flex-wrap:wrap
  }

  .log-head button{
    margin-left:0
  }

  .log-row{
    grid-template-columns:1fr;
    gap:3px
  }

  .brand-sub{
    display:none
  }

  .top-stats>div:nth-child(2){
    display:none
  }
}

@media(max-width:430px){
  .topbar{
    padding:12px
  }

  .brand-title{
    font-size:15px
  }

  .top-stats{
    font-size:11px
  }

  .panel-head{
    align-items:flex-start
  }

  .temp-big>span{
    font-size:27px
  }

  .pump-ring{
    width:250px;
    height:250px
  }

  .actions{
    grid-template-columns:1fr
  }

  .big{
    width:100%
  }

  footer{
    padding:0 14px 20px
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#050a12;
    --surface:#0a1422;
    --text:#eaf6ff
  }
}
