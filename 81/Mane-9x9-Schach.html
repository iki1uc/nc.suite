:root{
  --bg:#05050a;
  --surface:#0d0f12;
  --surface2:#151822;
  --line:#2b2f2a;
  --text:#f3eed8;
  --muted:#a9ad8f;
  --olive:#77862d;
  --olive2:#3f4520;
  --gold:#ffd43b;
  --green:#54d26a;
  --pink:#ff4fa3;
  --brown:#8b5b2d
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Verdana,Geneva,Tahoma,sans-serif
}

button{
  font:inherit
}

.shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 18px 24px;
  background:radial-gradient(circle at 15% 0%,#171a08 0,transparent 38%),var(--bg)
}

.top{
  max-width:1280px;
  margin:0 auto;
  padding:24px 4px 18px;
  display:flex;
  justify-content:space-between;
  gap:24px;
  align-items:flex-end;
  border-bottom:2px solid var(--gold)
}

.eyebrow{
  color:var(--gold);
  font-weight:900;
  letter-spacing:.18em;
  font-size:11px;
  margin:0 0 8px
}

h1{
  font-family:Impact,"Arial Black",sans-serif;
  font-size:clamp(34px,6vw,72px);
  line-height:.9;
  letter-spacing:-.02em;
  margin:0
}

h1 span{
  color:var(--pink)
}

.claim{
  color:var(--muted);
  max-width:760px;
  line-height:1.5;
  margin:12px 0 0
}

.homeBadge{
  border:2px solid var(--gold);
  padding:12px 16px;
  min-width:150px;
  text-align:center;
  background:#241f05
}

.homeBadge strong{
  display:block;
  color:var(--gold);
  font-size:22px
}

.homeBadge span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin:3px 0
}

.homeBadge b{
  font-size:28px
}

.layout{
  max-width:1280px;
  margin:22px auto;
  display:grid;
  grid-template-columns:minmax(0,1.35fr) minmax(300px,.75fr);
  gap:22px;
  align-items:start
}

.boardHead{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:10px
}

.turn{
  font-size:12px;
  font-weight:900;
  padding:7px 10px;
  border:1px solid var(--line);
  color:#777
}

.turn.on{
  color:#111;
  background:var(--gold);
  border-color:var(--gold)
}

.tick{
  margin-left:auto;
  font-size:12px;
  letter-spacing:.12em
}

.tick b{
  color:var(--gold);
  font-size:18px
}

.win{
  background:var(--pink);
  color:#12060d;
  padding:12px 14px;
  font-weight:900;
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  margin-bottom:10px
}

.win button,.peaceBanner{
  border:0;
  background:#111;
  color:#fff;
  padding:8px 10px;
  font-weight:900;
  cursor:pointer
}

.peaceBanner{
  background:#d9ead3;
  color:#17331b;
  text-align:center;
  padding:10px;
  margin-bottom:10px;
  font-size:13px
}

.bioBanner{
  background:#12331f;
  color:#b8ffb0;
  text-align:center;
  padding:10px;
  margin-bottom:10px;
  font-size:12px;
  border:1px solid #54d26a
}

.bioBtn{
  grid-column:1/-1
}

.bioCard{
  background:#0e1a10;
  border:1px solid #2f5a34;
  padding:16px
}

.bioCard h3{
  margin:0 0 12px;
  color:#8dff8a;
  font-size:13px;
  letter-spacing:.12em
}

.versus{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px
}

.versus>div{
  border:1px solid var(--line);
  padding:10px
}

.versus .vsBio{
  border-color:#54d26a;
  background:#142a18
}

.versus span{
  display:block;
  font-size:10px;
  letter-spacing:.18em;
  color:var(--muted)
}

.versus b{
  display:block;
  font-size:12px;
  margin:4px 0
}

.versus small{
  color:var(--muted);
  font-size:11px;
  line-height:1.4;
  display:block
}

.bioCard ol{
  margin:0 0 12px;
  padding-left:18px;
  color:var(--muted);
  font-size:13px;
  line-height:1.6
}

.bioCard ol b{
  color:var(--text)
}

.healBtn{
  width:100%;
  padding:12px;
  border:2px solid #54d26a;
  background:#1c3d22;
  color:#dfffe0;
  font-weight:900;
  cursor:pointer
}

.nanoRow{
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:12px
}

.nanoRow>span{
  font-size:11px;
  color:var(--muted);
  font-weight:900
}

.nano{
  padding:7px 10px;
  border:1px solid var(--line);
  background:#171a18;
  color:var(--text);
  font-weight:900;
  cursor:pointer
}

.nano.on{
  background:#54d26a;
  color:#111;
  border-color:#54d26a
}

.nanoNote{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  margin:8px 0 0
}

.nanoNote b{
  color:#8dff8a
}

.atem{
  margin-top:12px;
  display:grid;
  gap:7px
}

.atem>div{
  display:grid;
  grid-template-columns:34px 1fr 38px;
  gap:8px;
  align-items:center;
  font-size:11px
}

.atem .bar{
  height:8px;
  background:#222;
  overflow:hidden
}

.atem .bar i{
  display:block;
  height:100%;
  background:#7ce0a8
}

.atem .bar.co2 i{
  background:#ffcc44
}

.atemNote{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  margin:10px 0 0
}

.bioRow{
  background:#122a16!important;
  color:#b8ffb0
}

.dot.bioDot{
  border-color:#54d26a!important;
  font-size:16px
}

.boardShell{
  display:grid;
  grid-template-columns:22px 1fr;
  gap:4px
}

.rankLabels,.fileLabels{
  display:grid
}

.rankLabels span,.fileLabels span{
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  font-size:11px;
  font-weight:800
}

.fileLabels{
  grid-template-columns:repeat(9,1fr);
  height:22px;
  margin-left:26px
}

.board{
  display:grid;
  grid-template-columns:repeat(9,1fr);
  aspect-ratio:1/1;
  border:4px solid #222510;
  background:#222510;
  box-shadow:0 18px 50px #000
}

.cell{
  position:relative;
  border:0;
  padding:0;
  aspect-ratio:1/1;
  cursor:pointer;
  overflow:hidden
}

.cell.olive{
  background:#77862d
}

.cell.dark{
  background:#151710
}

.cell.home{
  background:radial-gradient(circle,#ffdf4d 0%,#c99a09 62%,#7b5a00 100%)!important;
  box-shadow:inset 0 0 0 3px #fff2a8
}

.cell.sel{
  box-shadow:inset 0 0 0 4px var(--pink)
}

.cell.target{
  box-shadow:inset 0 0 0 3px var(--green)
}

.homeTag{
  position:absolute;
  left:3px;
  top:2px;
  font-size:7px;
  line-height:1.1;
  font-weight:900;
  color:#4d3600;
  text-align:left;
  z-index:0
}

.mini{
  position:absolute;
  right:3px;
  bottom:2px;
  font-size:7px;
  color:rgba(255,255,255,.55);
  z-index:1
}

.cell.home .mini{
  color:#3c2b00
}

.piece{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  line-height:1;
  font-size:clamp(20px,4.2vw,42px);
  width:88%;
  height:88%;
  margin:auto;
  border-radius:50%;
  text-shadow:0 2px 0 #000,0 0 8px #000
}

.piece.w{
  background:rgba(255,248,216,.94);
  color:#191a10;
  box-shadow:0 3px 0 #5f5b3b
}

.piece.b{
  background:rgba(10,10,12,.92);
  color:#f2ead0;
  box-shadow:0 3px 0 #000;
  border:1px solid #777
}

.piece.mane{
  background:#ff4fa3!important;
  color:#fff!important;
  box-shadow:0 0 0 3px #fff,0 0 22px #ff4fa3
}

.piece i{
  font-style:normal;
  font-size:.45em;
  line-height:.8
}

.piece small{
  font-size:7px;
  font-weight:900;
  letter-spacing:.08em;
  margin-top:1px
}

.dot{
  position:absolute;
  z-index:3;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:24%;
  height:24%;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 4px rgba(84,210,106,.3);
  display:grid;
  place-items:center;
  color:#fff;
  font-weight:900
}

.dot.eat{
  width:82%;
  height:82%;
  background:transparent;
  border:5px solid #ff2f6d;
  box-shadow:none;
  font-size:24px
}

.maisBar{
  margin-top:16px;
  background:var(--surface);
  border:1px solid var(--line);
  padding:14px
}

.maisHead{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap
}

.maisHead strong{
  color:var(--gold);
  font-size:13px
}

.maisHead span{
  color:var(--muted);
  font-size:12px
}

.segments{
  display:grid;
  grid-template-columns:repeat(30,1fr);
  gap:3px;
  margin:12px 0
}

.seg{
  height:18px;
  background:#222
}

.seg.good.filled{
  background:var(--green)
}

.seg.waste.filled{
  background:#a86b2d
}

.seg.now{
  outline:2px solid #fff
}

.maisBar p{
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.6
}

.control{
  display:flex;
  flex-direction:column;
  gap:14px
}

.statusCard,.rules,.army,.logWrap{
  background:var(--surface);
  border:1px solid var(--line);
  padding:16px
}

.label{
  margin:0;
  color:var(--gold);
  font-size:11px;
  letter-spacing:.16em;
  font-weight:900
}

.statusCard h2{
  margin:6px 0;
  font-size:20px
}

.notice{
  min-height:54px;
  color:var(--muted);
  line-height:1.5;
  font-size:13px
}

.counters{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--line);
  padding-top:12px;
  text-align:center
}

.counters b{
  display:block;
  color:var(--gold);
  font-size:24px
}

.counters span{
  font-size:9px;
  color:var(--muted);
  letter-spacing:.1em
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.buttons button{
  padding:13px 10px;
  border:2px solid var(--line);
  background:#171a18;
  color:var(--text);
  font-weight:900;
  cursor:pointer
}

.buttons button:hover,.buttons button.active{
  border-color:var(--gold);
  background:#241f05
}

.buttons .primary{
  background:var(--gold);
  color:#111;
  border-color:var(--gold)
}

.buttons .peaceBtn{
  grid-column:1/-1
}

.buttons button:disabled{
  opacity:.4;
  cursor:not-allowed
}

.rules h3,.army h3{
  margin:0 0 10px;
  color:var(--gold);
  font-size:13px;
  letter-spacing:.12em
}

.rules ul{
  margin:0;
  padding-left:18px;
  color:var(--muted);
  font-size:13px;
  line-height:1.6
}

.rules li{
  margin-bottom:7px
}

.rules b{
  color:var(--text)
}

.pink{
  color:var(--pink)!important
}

.army p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

.armyRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  border-top:1px dashed var(--line);
  padding:9px 0;
  font-size:13px
}

.armyRow span{
  color:var(--gold);
  font-weight:900
}

.logWrap{
  max-width:1280px;
  margin:0 auto
}

.logHead{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  align-items:baseline;
  justify-content:space-between
}

.logHead h2{
  margin:0;
  color:var(--gold);
  font-size:18px
}

.logHead span{
  color:var(--muted);
  font-size:12px
}

.log{
  margin-top:12px;
  max-height:220px;
  overflow:auto;
  border:1px solid var(--line);
  background:#07080a;
  padding:8px
}

.logRow{
  font-family:"Courier New",monospace;
  font-size:12px;
  line-height:1.7;
  border-bottom:1px solid #1a1c16;
  padding:2px 4px
}

.wasteRow{
  background:#2a1b0a;
  color:#ffc069
}

.maneRow{
  background:#2b0a1b;
  color:#ffb0d1
}

.empty{
  color:var(--muted);
  font-size:13px
}

footer{
  max-width:1280px;
  margin:18px auto 0;
  color:var(--muted);
  font-size:11px;
  text-align:center
}

@media(max-width:820px){
  .shell{
    padding-left:10px;
    padding-right:10px
  }

  .top{
    align-items:flex-start;
    flex-direction:column
  }

  .homeBadge{
    align-self:stretch
  }

  .layout{
    grid-template-columns:1fr
  }

  .control{
    order:2
  }

  .boardShell{
    grid-template-columns:16px 1fr
  }

  .fileLabels{
    margin-left:20px
  }

  .buttons{
    grid-template-columns:1fr 1fr
  }

  .piece small{
    display:none
  }

  .homeTag{
    font-size:6px
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#05050a;
    --surface:#0d0f12;
    --text:#f3eed8
  }
}
