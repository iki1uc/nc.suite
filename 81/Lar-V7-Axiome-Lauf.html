:root {
  --bg: #08090d;
  --surface: #111319;
  --surface-2: #171a23;
  --line: #282c38;
  --text: #f4f1e8;
  --muted: #a5aab8;
  --gold: #f5c542;
  --cyan: #38e8ff;
  --pink: #ff4fc3;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
}

button {
  font: inherit;
}

.app-shell {
  min-height: 100vh;
  width: 100%;
  overflow-x: clip;
  padding: var(--safe-area-inset-top) 0 0;
  background: radial-gradient(circle at 15% 0, rgba(245,197,66,.10), transparent 30%), radial-gradient(circle at 85% 10%, rgba(56,232,255,.09), transparent 28%), radial-gradient(circle at 50% 65%, rgba(255,79,195,.07), transparent 35%), var(--bg);
}

.topbar {
  max-width: 1240px;
  margin: 0 auto;
  padding: 16px 24px 0;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: .06em;
}

.bridge b {
  color: var(--gold);
}

.spin {
  display: inline-block;
  animation: spin 6s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.live {
  display: flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
}

.live i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 12px var(--cyan);
}

.hero {
  max-width: 1240px;
  margin: 0 auto;
  padding: 58px 24px 34px;
}

.eyebrow {
  color: var(--gold);
  font-size: 12px;
  letter-spacing: .22em;
  font-weight: 700;
}

.hero h1 {
  font-size: clamp(46px, 8vw, 106px);
  line-height: .92;
  letter-spacing: -.07em;
  margin: 18px 0 16px;
  font-weight: 800;
}

.hero h1 span {
  color: var(--gold);
}

.hero-line {
  font-size: clamp(18px, 3vw, 34px);
  letter-spacing: -.04em;
}

.hero-line em {
  font-style: normal;
  color: var(--muted);
  padding: 0 10px;
}

.hero-line .cyan {
  color: var(--cyan);
}

.hero-line .pink {
  color: var(--pink);
}

.hero-sub {
  color: var(--muted);
  margin: 20px 0 26px;
  line-height: 1.6;
}

.hero-sub span {
  color: var(--text);
  border: 1px solid var(--line);
  padding: 4px 8px;
  margin-left: 8px;
}

.hero-actions, .run-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}

.primary {
  border: 0;
  background: var(--gold);
  color: #171203;
  font-weight: 800;
  padding: 13px 18px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
}

.primary:hover {
  background: #ffd75e;
  transform: translateY(-1px);
}

.primary:disabled {
  opacity: .55;
  cursor: default;
  transform: none;
}

.ghost {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--line);
  padding: 12px 15px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.ghost:hover {
  border-color: var(--cyan);
  color: var(--cyan);
}

.section {
  max-width: 1240px;
  margin: 0 auto;
  padding: 48px 24px 8px;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 24px;
  margin-bottom: 22px;
}

.section-head h2 {
  margin: 8px 0 0;
  font-size: clamp(28px, 4vw, 48px);
  letter-spacing: -.04em;
}

.section-head p {
  color: var(--muted);
  max-width: 380px;
  line-height: 1.5;
  margin: 0;
}

.num {
  color: var(--gold);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .18em;
}

.axiom-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.axiom-card {
  text-align: left;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 22px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: .2s;
  min-height: 350px;
}

.axiom-card:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
}

.axiom-card.is-active {
  border: 2px solid var(--accent);
  background: linear-gradient(180deg, var(--soft), var(--surface) 55%);
  box-shadow: 0 18px 55px rgba(0,0,0,.28);
}

.axiom-card.is-helper {
  opacity: .76;
  transform: scale(.985);
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modul {
  color: var(--accent);
  font-weight: 800;
  font-size: 18px;
}

.state {
  font-size: 10px;
  letter-spacing: .12em;
  color: var(--muted);
}

.funktion {
  font-size: clamp(31px, 3vw, 46px);
  line-height: 1;
  font-weight: 800;
  letter-spacing: -.06em;
  margin: 52px 0 10px;
  color: var(--accent);
}

.verb {
  font-size: 20px;
  font-weight: 700;
}

.axiom-card p {
  color: var(--muted);
  line-height: 1.55;
  min-height: 48px;
}

.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  border-top: 1px solid var(--line);
  padding-top: 16px;
  margin-top: 24px;
}

.meta-grid label {
  display: block;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .14em;
  margin-bottom: 3px;
}

.meta-grid b {
  font-size: 13px;
}

.card-foot {
  display: flex;
  justify-content: space-between;
  margin-top: 18px;
  color: var(--muted);
  font-size: 11px;
}

.role {
  color: var(--accent);
  font-weight: 800;
}

.active-line {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--accent);
  color: #111;
  font-weight: 800;
  font-size: 11px;
  letter-spacing: .12em;
  padding: 8px 22px;
}

.three-one {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.formula-mini {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  padding: 10px 14px;
  border-radius: 99px;
  font-size: 12px;
}

.formula-mini b {
  font-size: 22px;
}

.active-mini {
  border-color: var(--accent);
  color: var(--accent);
}

.mini-arrow {
  color: var(--gold);
}

.helper-note {
  color: var(--muted);
  font-size: 13px;
}

.identical-note {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-top: 16px;
  border: 1px dashed rgba(245,197,66,.5);
  background: rgba(245,197,66,.06);
  padding: 13px 15px;
  border-radius: 9px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.55;
}

.identical-note b {
  color: var(--text);
}

.count-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}

.count-strip span {
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 7px 12px;
  font-size: 12px;
  color: var(--muted);
}

.count-strip b {
  color: var(--gold);
  font-size: 16px;
  margin-right: 4px;
}

.wurzel-section {
  padding-top: 60px;
}

.wurzel-box {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(245,197,66,.07), var(--surface));
  padding: 28px;
}

.wurzel-eq {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 10px;
  font-size: clamp(26px, 4.5vw, 52px);
  font-weight: 800;
  letter-spacing: -.04em;
}

.wurzel-eq em {
  color: var(--muted);
  font-style: normal;
  font-size: .7em;
}

.w-gold {
  color: var(--gold);
}

.w-cyan {
  color: var(--cyan);
}

.w-pink {
  color: var(--pink);
}

.wurzel-eq strong {
  color: var(--gold);
  font-size: 1.35em;
}

.wurzel-sub {
  color: var(--muted);
  line-height: 1.6;
  max-width: 720px;
}

.two-structures {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 22px;
}

.two-structures > div {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  background: var(--surface-2);
}

.two-structures label {
  display: block;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .16em;
  margin-bottom: 6px;
}

.two-structures b {
  display: block;
  font-size: 18px;
  margin-bottom: 6px;
}

.two-structures span {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  display: block;
}

.two-structures .diff {
  border-color: rgba(255,79,195,.45);
}

.chain-panel {
  margin-top: 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #0e1016;
  padding: 24px;
}

.chain-head {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  align-items: start;
}

.chain-head h3 {
  margin: 8px 0 6px;
  font-size: 26px;
}

.chain-head p {
  color: var(--muted);
  line-height: 1.55;
  margin: 0;
  max-width: 620px;
}

.essenz-value {
  text-align: right;
  border: 1px solid var(--gold);
  border-radius: 10px;
  padding: 12px 16px;
  min-width: 130px;
}

.essenz-value small, .essenz-value span {
  display: block;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .14em;
}

.essenz-value b {
  font-size: 36px;
  color: var(--gold);
  line-height: 1.1;
}

.chain-track {
  display: flex;
  align-items: stretch;
  gap: 6px;
  margin-top: 22px;
  flex-wrap: wrap;
}

.chain-node {
  flex: 1;
  min-width: 110px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 9px;
  padding: 13px 10px;
  text-align: left;
  cursor: pointer;
}

.chain-node:hover {
  border-color: var(--cyan);
}

.chain-node.active {
  background: var(--gold);
  color: #181201;
  border-color: var(--gold);
}

.chain-node.active small {
  color: #5a460e;
}

.chain-node.passed {
  color: var(--cyan);
}

.chain-node b {
  display: block;
  font-size: 22px;
}

.chain-node span {
  display: block;
  font-size: 10px;
  letter-spacing: .12em;
  margin: 4px 0;
}

.chain-node small {
  color: var(--muted);
  font-size: 11px;
  display: block;
  line-height: 1.4;
}

.chain-arrow {
  align-self: center;
  color: var(--muted);
  font-size: 11px;
}

.chain-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
}

.chain-actions .ghost:disabled {
  opacity: .35;
}

.chain-msg {
  color: var(--muted);
  font-size: 13px;
}

.fifteen-box {
  margin-top: 14px;
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 18px;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 24px;
  background: var(--surface);
}

.fifteen-box h3 {
  margin: 8px 0 8px;
  font-size: 26px;
}

.fifteen-box p {
  color: var(--muted);
  line-height: 1.6;
  margin: 0;
}

.fifteen-eq {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px;
  margin-top: 16px;
}

.fifteen-eq b {
  font-size: 30px;
  color: var(--gold);
}

.fifteen-eq span {
  color: var(--muted);
  font-size: 13px;
}

.rounds {
  display: grid;
  gap: 8px;
}

.round {
  display: grid;
  grid-template-columns: 70px repeat(3, 1fr);
  gap: 8px;
  align-items: center;
}

.round span {
  color: var(--muted);
  font-size: 11px;
}

.round b {
  border-radius: 6px;
  padding: 10px;
  font-size: 12px;
  text-align: center;
}

.r-gold {
  background: rgba(245,197,66,.15);
  color: var(--gold);
}

.r-cyan {
  background: rgba(56,232,255,.13);
  color: var(--cyan);
}

.r-pink {
  background: rgba(255,79,195,.14);
  color: var(--pink);
}

.proof-bar {
  border: 1px solid rgba(255,79,195,.4);
  border-radius: 12px;
  background: rgba(255,79,195,.05);
  padding: 16px;
  margin-bottom: 14px;
}

.proof-toggle {
  width: 100%;
  background: none;
  border: 0;
  color: var(--text);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  padding: 0;
  text-align: left;
}

.proof-toggle span {
  color: var(--muted);
  font-size: 12px;
}

.proof-grid {
  display: grid;
  grid-template-columns: 1fr 28px 1fr 1fr;
  gap: 12px;
  margin-top: 16px;
  align-items: stretch;
}

.proof-col {
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 14px;
  background: var(--surface);
}

.proof-col span {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .14em;
}

.proof-col b {
  display: block;
  margin: 7px 0;
}

.proof-col p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  margin: 0 0 10px;
}

.proof-col code {
  font-size: 11px;
  color: var(--cyan);
  line-height: 1.5;
}

.proof-col-2 b {
  color: var(--pink);
}

.proof-arrow {
  align-self: center;
  text-align: center;
  color: var(--gold);
  font-size: 22px;
}

.proof-result {
  border: 1px solid var(--gold);
  border-radius: 9px;
  padding: 14px;
  text-align: center;
  background: rgba(245,197,66,.08);
}

.proof-result small, .proof-result span {
  display: block;
  color: var(--muted);
  font-size: 11px;
}

.proof-result b {
  display: block;
  font-size: 22px;
  color: var(--gold);
  margin: 6px 0;
}

.proof-status {
  margin-top: 14px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}

.gang small.gone {
  color: var(--muted);
  font-style: italic;
}

.final-lines {
  display: grid;
  gap: 6px;
  margin-top: 16px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}

.final-lines b {
  color: var(--text);
}

.whirl-section {
  padding-top: 60px;
}

.whirl-code {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #0b0d12;
  padding: 15px 18px;
  font-size: 13px;
}

.whirl-code b {
  color: var(--gold);
}

.whirl-live {
  color: var(--cyan);
  font-weight: 800;
  letter-spacing: .1em;
  font-size: 11px;
}

.whirl-grid {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: 14px;
  margin-top: 14px;
  align-items: start;
}

.whirl-stage, .whirl-controls {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  padding: 22px;
}

.vortex {
  position: relative;
  height: 230px;
  display: grid;
  place-items: center;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: radial-gradient(circle, rgba(56,232,255,.14), transparent 62%);
}

.vortex-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px dashed rgba(56,232,255,.55);
  animation: spin var(--spin) linear infinite;
}

.vortex-ring.r1 {
  width: calc(var(--radius) * 2);
  height: calc(var(--radius) * 2);
}

.vortex-ring.r2 {
  width: calc(var(--radius) * 1.45);
  height: calc(var(--radius) * 1.45);
  border-color: rgba(245,197,66,.55);
  animation-duration: calc(var(--spin) * 1.7);
  animation-direction: reverse;
}

.vortex-ring.r3 {
  width: calc(var(--radius) * 0.9);
  height: calc(var(--radius) * 0.9);
  border-color: rgba(255,79,195,.55);
  animation-duration: calc(var(--spin) * 0.6);
}

.vortex-core {
  position: relative;
  z-index: 2;
  text-align: center;
  background: #08090d;
  border: 1px solid var(--cyan);
  border-radius: 50%;
  width: 92px;
  height: 92px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--cyan);
}

.vortex-core span {
  font-size: 8px;
  letter-spacing: .12em;
  color: var(--muted);
}

.vortex-core b {
  font-size: 10px;
  color: var(--text);
}

.corridor-preview {
  margin-top: 16px;
}

.corridor-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .08em;
}

.corridor-head span:first-child {
  color: var(--gold);
  font-weight: 800;
}

.corridor-cells {
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: 5px;
  margin: 12px 0;
}

.corridor-cells span {
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 12px;
}

.corridor-cells .cell-gold {
  border-color: rgba(245,197,66,.5);
  color: var(--gold);
}

.corridor-cells .cell-center {
  background: var(--gold);
  color: #181201;
  font-weight: 800;
  border-color: var(--gold);
}

.corridor-preview p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.55;
  margin: 0;
}

.whirl-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 16px;
}

.whirl-msg {
  margin-top: 14px;
  border-top: 1px solid var(--line);
  padding-top: 12px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  min-height: 38px;
}

.whirl-controls {
  display: grid;
  gap: 18px;
}

.param-head {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}

.param label {
  font-weight: 800;
  font-size: 13px;
}

.param b {
  color: var(--gold);
}

.param input[type="range"] {
  width: 100%;
  accent-color: var(--gold);
}

.param span {
  display: block;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  margin-top: 5px;
}

.whirl-block {
  border-top: 1px solid var(--line);
  padding-top: 14px;
}

.whirl-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  letter-spacing: .14em;
  color: var(--muted);
  font-weight: 800;
}

.axis-row, .zone-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 12px 0 8px;
}

.axis, .zone {
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text);
  border-radius: 6px;
  padding: 8px 10px;
  cursor: pointer;
  font-size: 12px;
}

.axis.active, .zone.active {
  background: var(--cyan);
  color: #06222a;
  border-color: var(--cyan);
  font-weight: 800;
}

.whirl-block p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.55;
  margin: 0;
}

.whirl-block p b {
  color: var(--text);
}

.rar-bars {
  display: grid;
  gap: 8px;
  margin: 12px 0 8px;
}

.rar-bars > div {
  display: grid;
  grid-template-columns: 52px 1fr 42px;
  gap: 8px;
  align-items: center;
  font-size: 12px;
}

.rar-bars span {
  color: var(--muted);
}

.rar-track {
  height: 8px;
  background: #242833;
  border-radius: 99px;
  overflow: hidden;
}

.rar-track i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--pink));
}

.station-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin: 12px 0 8px;
  font-size: 12px;
  font-weight: 800;
}

.station-on {
  color: var(--cyan);
}

.station-off {
  color: var(--muted);
}

.grey-note {
  display: flex;
  gap: 6px;
  align-items: flex-start;
}

.grey-note svg {
  flex-shrink: 0;
  margin-top: 2px;
  color: var(--muted);
}

.scale-eq {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 12px 0 6px;
  font-size: 28px;
  font-weight: 800;
}

.scale-eq span {
  font-size: 13px;
  color: var(--muted);
}

.scale-nine {
  color: var(--pink);
}

.steps-section {
  padding-top: 64px;
}

.step-track {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}

.step {
  min-width: 104px;
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 8px;
  padding: 14px 10px;
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.step:hover {
  border-color: var(--cyan);
}

.step.active {
  background: var(--gold);
  color: #181201;
  border-color: var(--gold);
}

.step.done {
  color: var(--cyan);
}

.step-index {
  font-size: 10px;
  opacity: .7;
}

.step-arrow {
  color: var(--gold);
}

.step-detail {
  margin-top: 14px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 28px;
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 36px;
  align-items: center;
}

.big-step {
  font-size: clamp(46px, 7vw, 88px);
  font-weight: 800;
  letter-spacing: -.07em;
  color: var(--gold);
}

.big-step span {
  display: block;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: .16em;
}

.step-detail h3 {
  font-size: clamp(24px, 3vw, 38px);
  margin: 0 0 10px;
}

.step-detail p {
  color: var(--muted);
  line-height: 1.6;
  margin: 0;
}

.step-nav {
  display: flex;
  gap: 10px;
  margin-top: 22px;
}

.step-nav button {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--text);
  padding: 9px 14px;
  border-radius: 5px;
  cursor: pointer;
}

.step-nav button:disabled {
  opacity: .35;
}

.run-panel {
  border: 1px solid var(--line);
  border-radius: 16px;
  background: #0e1016;
  padding: 24px;
  overflow: hidden;
}

.run-head {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 20px;
}

.run-label {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .15em;
}

.run-head strong {
  display: block;
  font-size: clamp(28px, 4vw, 48px);
  margin-top: 7px;
  color: var(--cyan);
}

.counter b {
  font-size: 44px;
  color: var(--gold);
}

.counter span {
  color: var(--muted);
}

.progress {
  height: 8px;
  background: #242833;
  margin-top: 22px;
  border-radius: 99px;
  overflow: hidden;
}

.progress span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--cyan), var(--pink));
  transition: width .5s;
}

.progress-labels {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .12em;
  margin: 9px 0 20px;
}

.gang-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}

.gang {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 13px;
  min-height: 72px;
  position: relative;
  background: var(--surface);
}

.gang span {
  display: block;
  color: var(--muted);
  font-size: 10px;
}

.gang b {
  display: block;
  margin-top: 6px;
}

.gang.passed {
  border-color: rgba(56,232,255,.45);
  color: var(--cyan);
}

.gang.now {
  background: var(--gold);
  color: #171203;
  border-color: var(--gold);
}

.gang.now span {
  color: #5a460e;
}

.gang.return-gang {
  border-color: var(--pink);
}

.gang small {
  color: var(--pink);
  font-size: 10px;
}

.gang em {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 10px;
  font-style: normal;
}

.run-actions {
  margin-top: 20px;
}

.text-btn {
  background: none;
  border: 0;
  color: var(--muted);
  cursor: pointer;
  text-decoration: underline;
}

.finish {
  margin-top: 18px;
  border: 1px solid rgba(245,197,66,.5);
  background: rgba(245,197,66,.1);
  padding: 14px;
  border-radius: 8px;
  font-weight: 800;
}

.finish span {
  display: block;
  font-weight: 400;
  color: var(--muted);
  font-size: 13px;
  margin-top: 3px;
}

.log {
  margin-top: 18px;
  border-top: 1px solid var(--line);
  padding-top: 14px;
  max-height: 280px;
  overflow-y: auto;
}

.log-line {
  display: flex;
  gap: 10px;
  padding: 6px 0;
  font-size: 13px;
}

.log-line span {
  color: var(--muted);
  white-space: nowrap;
}

.log-line.return {
  color: var(--pink);
}

.log-line.done {
  color: var(--gold);
  font-weight: 800;
}

.formula {
  max-width: 1240px;
  margin: 54px auto 0;
  padding: 38px 24px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 30px;
  align-items: center;
}

.formula h2 {
  margin: 8px 0 6px;
  font-size: 34px;
}

.formula p {
  color: var(--muted);
  line-height: 1.6;
}

.math {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.math > div {
  text-align: center;
}

.math small {
  display: block;
  color: var(--muted);
  font-size: 11px;
}

.math strong {
  font-size: clamp(18px, 2.5vw, 30px);
}

.math .result strong {
  color: var(--gold);
}

.equals {
  color: var(--cyan);
  font-size: 28px;
}

footer {
  max-width: 1240px;
  margin: 0 auto;
  padding: 24px;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 12px;
}

footer span {
  display: flex;
  align-items: center;
  gap: 6px;
}

@media (max-width: 760px) {
  .topbar {
    padding-left: 16px;
    padding-right: 16px;
  }

  .topbar .live {
    display: none;
  }

  .hero {
    padding: 42px 16px 24px;
  }

  .hero-sub span {
    display: inline-block;
    margin: 8px 0 0;
  }

  .hero-actions .primary, .hero-actions .ghost {
    flex: 1;
    justify-content: center;
  }

  .section {
    padding: 34px 16px 4px;
  }

  .section-head {
    flex-direction: column;
    align-items: start;
  }

  .section-head p {
    max-width: none;
  }

  .axiom-grid {
    grid-template-columns: 1fr;
  }

  .axiom-card {
    min-height: auto;
    padding-bottom: 40px;
  }

  .funktion {
    margin-top: 34px;
  }

  .three-one {
    align-items: flex-start;
  }

  .helper-note {
    width: 100%;
  }

  .step {
    min-width: calc(50% - 4px);
    flex: none;
  }

  .step-arrow {
    display: none;
  }

  .step-detail {
    grid-template-columns: 1fr;
    padding: 22px;
    gap: 10px;
  }

  .run-panel {
    padding: 16px;
  }

  .two-structures {
    grid-template-columns: 1fr;
  }

  .chain-head {
    flex-direction: column;
  }

  .essenz-value {
    text-align: left;
  }

  .chain-node {
    min-width: calc(50% - 4px);
    flex: none;
  }

  .chain-arrow {
    display: none;
  }

  .fifteen-box {
    grid-template-columns: 1fr;
  }

  .round {
    grid-template-columns: 1fr;
  }

  .round span {
    margin-top: 4px;
  }

  .proof-grid {
    grid-template-columns: 1fr;
  }

  .proof-arrow {
    transform: rotate(90deg);
  }

  .whirl-grid {
    grid-template-columns: 1fr;
  }

  .whirl-stage, .whirl-controls {
    padding: 16px;
  }

  .corridor-head span:last-child {
