        :root{ --bg:#050509; --gold:#ffcc80; --teal:#80cbc4; --purple:#ce93d8; --line:rgba(255,255,255,.14); --panel:rgba(10,10,18,.78); }
        *{ box-sizing:border-box; }
        html,body{ margin:0; padding:0; background:var(--bg); }
