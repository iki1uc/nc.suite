:root{
  --bg:#03050C;
  --surface:#0a0f1c;
  --line:#1c2f4a;
  --line2:#3a3a52;
  --gold:#F2C94C;
  --cyan:#22d3ee;
  --green:#46FFB4;
  --red:#FF3B24;
  --orange:#FF8A00;
  --blue:#4DA3FF;
  --violet:#ce93d8;
  --text:#eaf6ff;
  --muted:#8fa8c0;
}

*{
  box-sizing:border-box
}

html,body{
  background:var(--bg);
  color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace
}

body{
  margin:0
}

button{
  font-family:inherit
}

input[type=range]{
  accent-color:var(--cyan);
  width:100%
}

input[type=number]{
  background:#000;
  border:1px solid var(--line);
  color:var(--text);
  border-radius:6px;
  padding:8px 10px;
  width:104px;
  font:inherit;
  font-weight:900;
  outline:none
}

input[type=number]:focus{
  border-color:var(--cyan)
}

.terminal-scroll::-webkit-scrollbar{
  width:6px
}

.terminal-scroll::-webkit-scrollbar-thumb{
  background:#1c2f4a;
  border-radius:99px
}

@keyframes spin{
  to{
    transform:rotate(360deg)
  }
}

.spin{
  animation:spin 2s linear infinite
}

@keyframes pulseGlow{
  0%,100%{
    opacity:.55
  }

  50%{
    opacity:1
  }
}

.glow{
  animation:pulseGlow 1.8s ease-in-out infinite
}
