:root {
  --bg: #000;
  --surface: #020808;
  --surface-2: #031313;
  --line: #0ff;
  --line-dim: rgba(0, 255, 255, .28);
  --ink: #d9ffff;
  --muted: #72b8b8;
  --cyan: #0ff;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000;
    --surface: #020808;
    --ink: #d9ffff;
  }
}

* {
  box-sizing: border-box;
}

html {
  background: #000;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible, input:focus-visible {
  outline: 2px solid #fff;
  outline-offset: 3px;
}

.app-shell {
  min-height: 100vh;
  width: 100%;
  padding: var(--safe-area-inset-top) 0 0;
  background:
    linear-gradient(rgba(0,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,.025) 1px, transparent 1px),
    #000;
  background-size: 28px 28px;
  position: relative;
  overflow-x: clip;
}

.scanline {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .08;
  background: repeating-linear-gradient(0deg, transparent 0 3px, #0ff 4px);
}

.page {
  width: min(1020px, calc(100% - 32px));
  margin: 0 auto;
  padding: 28px 0 28px;
  position: relative;
}

.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 18px;
}

.eyebrow, .label, .status-label, .field-label {
  font-size: 10px;
  letter-spacing: .22em;
  color: #0ff;
  font-weight: 800;
  margin: 0 0 8px;
}

.topbar h1 {
  font-size: clamp(26px, 5vw, 44px);
  line-height: .98;
  letter-spacing: -.06em;
  margin: 0;
  text-transform: uppercase;
}

.topbar h1 span {
  color: #0ff;
}

.sub {
  color: var(--muted);
  font-size: 12px;
  margin: 10px 0 0;
}

.home-mark {
  flex: 0 0 auto;
  border: 1px solid #0ff;
  width: 88px;
  height: 88px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 5px 5px 0 #0ff;
}

.home-mark span {
  font-size: 10px;
  letter-spacing: .2em;
}

.home-mark strong {
  font-size: 34px;
  line-height: 1;
}

.neustand {
  margin-top: 18px;
  border: 1px solid var(--line);
  display: grid;
  grid-template-columns: 1.1fr .9fr;
  background: var(--surface);
}

.neustand-left {
  padding: 24px;
  border-right: 1px solid var(--line);
}

.neustand-left h2 {
  font-size: 44px;
  line-height: 1;
  margin: 0 0 16px;
  letter-spacing: -.06em;
}

.equation {
  margin: 0;
  font-size: 14px;
}

.equation span {
  color: var(--muted);
}

.fixpoint {
  margin: 14px 0 0;
  padding-top: 14px;
  border-top: 1px dashed var(--line-dim);
  font-size: 13px;
}

.fixpoint em {
  color: #0ff;
  font-style: normal;
  font-weight: 900;
}

.neustand-right {
  padding: 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: rgba(0,255,255,.055);
}

.status {
  font-size: 16px;
  line-height: 1.5;
  font-weight: 900;
  margin: 0;
}

.status-note {
  color: var(--muted);
  font-size: 12px;
  margin: 8px 0 18px;
}

.mini-stats {
  border-top: 1px solid var(--line-dim);
  padding-top: 14px;
  display: flex;
  gap: 18px;
  font-size: 10px;
  color: var(--muted);
}

.mini-stats b {
  color: #0ff;
  font-size: 13px;
  display: block;
  margin-bottom: 2px;
}

.console {
  margin-top: 18px;
  border: 1px solid var(--line);
  padding: 22px;
  background: var(--surface-2);
}

.console-head {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  letter-spacing: .18em;
  color: #0ff;
  margin-bottom: 20px;
}

.console-head p {
  margin: 0;
  display: flex;
  gap: 8px;
  align-items: center;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #0ff;
  display: inline-block;
  box-shadow: 0 0 10px #0ff;
}

.input-row {
  display: flex;
  align-items: center;
  border: 1px solid #0ff;
  background: #000;
  padding: 0 12px;
}

.prompt {
  color: #0ff;
  font-size: 20px;
}

.input-row input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: #0ff;
  padding: 16px 10px;
  font-size: 17px;
}

.input-row input::-moz-placeholder {
  color: rgba(0,255,255,.45);
}

.input-row input::placeholder {
  color: rgba(0,255,255,.45);
}

.clear {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .1em;
  white-space: nowrap;
}

.example-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-top: 12px;
  color: var(--muted);
  font-size: 10px;
}

.example-row button {
  border: 1px solid var(--line-dim);
  background: transparent;
  color: #a8eeee;
  padding: 5px 8px;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
}

.primary, .secondary {
  border: 1px solid #0ff;
  padding: 12px 18px;
  font-weight: 900;
  letter-spacing: .04em;
  display: inline-flex;
  gap: 8px;
  align-items: center;
}

.primary {
  background: #0ff;
  color: #000;
  box-shadow: 4px 4px 0 rgba(0,255,255,.28);
}

.secondary {
  background: #111;
  color: #0ff;
}

.action-note {
  margin: 0;
  font-size: 10px;
  color: var(--muted);
}

.output-wrap {
  margin-top: 20px;
  border: 1px solid var(--line-dim);
}

.output-head {
  display: flex;
  justify-content: space-between;
  padding: 9px 12px;
  font-size: 9px;
  letter-spacing: .18em;
  color: #0ff;
  border-bottom: 1px solid var(--line-dim);
}

pre {
  margin: 0;
  padding: 20px;
  min-height: 174px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #9efafa;
  font-size: 13px;
  line-height: 1.75;
  background: #000;
}

.modules {
  margin-top: 18px;
  border-top: 1px solid var(--line);
  padding-top: 20px;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 20px;
}

.section-heading h2 {
  margin: 0;
  font-size: 26px;
  letter-spacing: -.04em;
}

.section-heading > p {
  color: var(--muted);
  font-size: 11px;
  margin: 0;
  text-align: right;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 18px;
}

.chip {
  background: #000;
  color: #c9ffff;
  border: 1px solid var(--line-dim);
  padding: 9px 10px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
}

.chip span {
  color: #0ff;
  font-size: 9px;
}

.chip:hover, .example-row button:hover {
  border-color: #0ff;
  background: rgba(0,255,255,.1);
}

.chip.active {
  background: #0ff;
  color: #000;
  border-color: #0ff;
}

.chip.active span {
  color: #000;
}

.triad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 18px;
}

.triad article {
  border: 1px solid var(--line-dim);
  background: var(--surface);
  padding: 20px;
  min-height: 180px;
  display: flex;
  flex-direction: column;
}

.card-no {
  font-size: 9px;
  color: #0ff;
  letter-spacing: .18em;
}

.triad h3 {
  font-size: 21px;
  margin: 34px 0 8px;
  letter-spacing: -.03em;
}

.triad h3 small {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
  font-weight: 400;
}

.triad p {
  color: #b9d9d9;
  font-size: 12px;
  line-height: 1.65;
  margin: 0;
}

.card-foot {
  margin-top: auto;
  padding-top: 20px;
  color: #0ff;
  font-size: 10px;
  display: flex;
  align-items: center;
  gap: 3px;
}

footer {
  margin-top: 26px;
  border-top: 1px solid var(--line);
  padding: 18px 0 0;
  display: flex;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 10px;
}

@media (max-width: 600px) {
  .page {
    width: calc(100% - 24px);
    padding-top: 18px;
  }

  .topbar {
    align-items: flex-start;
  }

  .home-mark {
    width: 66px;
    height: 66px;
  }

  .home-mark strong {
    font-size: 26px;
  }

  .sub {
    font-size: 10px;
  }

  .neustand, .triad {
    grid-template-columns: 1fr;
  }

  .neustand-left {
    border-right: 0;
    border-bottom: 1px solid var(--line);
    padding: 20px;
  }

  .neustand-right, .console {
    padding: 18px;
  }

  .neustand-left h2 {
    font-size: 38px;
  }

  .section-heading {
    align-items: flex-start;
    flex-direction: column;
    gap: 5px;
  }

  .section-heading > p {
    text-align: left;
  }

  .actions {
    flex-direction: column;
    align-items: stretch;
  }

  .primary, .secondary {
    justify-content: center;
  }

  .action-note {
    text-align: center;
  }

  .mini-stats {
    gap: 12px;
  }

  pre {
    padding: 16px;
    min-height: 200px;
  }

  .clear {
    font-size: 9px;
  }

  .input-row input {
    font-size: 15px;
  }

  footer {
    flex-direction: column;
    gap: 5px;
  }
}
</style>
