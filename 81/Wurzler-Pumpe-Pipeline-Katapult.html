:root{
  --bg:#050a10;
  --surface:#0a1520;
  --surface2:#101e2c;
  --line:#24394c;
  --gold:#ffd34d;
  --cyan:#00e5ff;
  --magenta:#ff3ea5;
  --ink:#edf7ff;
  --muted:#9fb7c8
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Consolas,"Courier New",monospace
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

.shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 18px 18px;
  background:radial-gradient(circle at 10% 0%,rgba(0,229,255,.13),transparent 28%),radial-gradient(circle at 90% 10%,rgba(255,62,165,.13),transparent 30%),linear-gradient(180deg,#071019,#04070b)
}

.top{
  max-width:1460px;
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  gap:24px;
  padding:18px 0 14px;
  border-bottom:1px solid var(--line)
}

.eyebrow{
  color:var(--cyan);
  font-size:11px;
  letter-spacing:.24em
}

.top h1{
  font-size:clamp(24px,3.2vw,44px);
  line-height:1.05;
  margin:8px 0;
  letter-spacing:-.04em
}

.top h1 span{
  color:var(--gold)
}

.top p{
  color:var(--muted);
  max-width:720px;
  margin:0;
  line-height:1.5
}

.meta{
  min-width:270px
}

.energy{
  display:flex;
  align-items:center;
  gap:12px;
  background:#0c1c2a;
  border:1px solid #2b4a61;
  padding:12px 14px;
  border-radius:10px;
  color:var(--gold)
}

.energy small,.energy strong{
  display:block
}

.energy strong{
  font-size:28px;
  line-height:1
}

.live{
  margin-left:auto;
  color:#59ff9f;
  font-size:10px
}

.clocks{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:9px;
  color:var(--muted);
  font-size:12px
}

.clocks span{
  display:flex;
  align-items:center;
  gap:5px
}

.controls{
  max-width:1460px;
  margin:14px auto;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap
}

.controls button,.stage button{
  border:1px solid #35526a;
  background:#122636;
  color:white;
  border-radius:8px;
  padding:11px 14px;
  font-weight:800
}

.controls .primary{
  background:var(--gold);
  color:#171000;
  border-color:var(--gold)
}

.controls .keys{
  color:var(--muted);
  font-size:12px
}

.controls .keys b{
  color:var(--gold)
}

.chain{
  max-width:1460px;
  margin:16px auto;
  display:grid;
  grid-template-columns:1fr 28px 1fr 28px 1fr 28px 1fr;
  align-items:stretch
}

.stage{
  background:linear-gradient(180deg,var(--surface),#071019);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  min-width:0;
  box-shadow:0 18px 50px rgba(0,0,0,.25)
}

.stageHead{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:13px
}

.stageHead svg{
  margin-left:auto;
  color:var(--cyan)
}

.num{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border:1px solid var(--gold);
  color:var(--gold);
  border-radius:50%
}

.stageHead h2{
  font-size:19px;
  margin:0
}

.stageHead small{
  color:var(--muted);
  letter-spacing:.14em
}

.connector{
  display:grid;
  place-items:center;
  color:var(--gold);
  font-size:10px;
  writing-mode:vertical-rl;
  letter-spacing:.2em
}

.roots{
  width:100%;
  height:180px
}

.rootBox{
  background:#060d14;
  border:1px solid #22384b;
  border-radius:10px;
  padding:4px
}

.rootMeta{
  display:flex;
  justify-content:space-between;
  padding:7px 5px;
  color:var(--muted);
  font-size:12px
}

.rootMeta b{
  color:#fff
}

.meter{
  display:flex;
  justify-content:space-between;
  margin:13px 0 6px;
  font-size:12px
}

.bar{
  height:9px;
  background:#17293a;
  border-radius:99px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--gold),var(--magenta));
  transition:.4s
}

.bar .cyan{
  background:var(--cyan)
}

.stage button{
  width:100%;
  margin-top:12px
}

.stage .gold{
  background:var(--gold);
  color:#171000;
  border-color:var(--gold)
}

.stage .cyanBtn{
  background:var(--cyan);
  color:#04222a;
  border-color:var(--cyan)
}

.stage .magenta{
  background:var(--magenta);
  color:#280312;
  border-color:var(--magenta)
}

.hint{
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
  margin:10px 0 0
}

.btnRow{
  display:grid;
  grid-template-columns:1fr 1fr 1.5fr;
  gap:7px
}

.btnRow button{
  padding:10px 6px;
  font-size:12px
}

.gauge{
  display:flex;
  gap:10px;
  align-items:center
}

.gauge svg{
  width:150px;
  flex:none
}

.scale{
  font-size:11px;
  color:var(--muted);
  line-height:1.5
}

.scale b{
  display:block;
  color:white;
  font-size:12px
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  margin:12px 0
}

.stats div{
  background:#0d1d2c;
  border:1px solid #23394d;
  border-radius:8px;
  padding:8px
}

.stats span,.stats b{
  display:block;
  font-size:10px
}

.stats b{
  font-size:13px;
  margin-top:3px
}

.stats svg{
  color:var(--cyan)
}

.toggle{
  display:flex!important;
  align-items:center;
  justify-content:center;
  gap:8px
}

.toggle span{
  width:28px;
  height:15px;
  border-radius:99px;
  background:#334b5f;
  position:relative
}

.toggle span:after{
  content:"";
  position:absolute;
  width:11px;
  height:11px;
  border-radius:50%;
  background:#fff;
  left:2px;
  top:2px
}

.toggle.on span{
  background:var(--magenta)
}

.toggle.on span:after{
  left:15px
}

.pipe{
  background:#060d14;
  border:1px solid #22384b;
  border-radius:10px;
  padding:14px 10px
}

.pipeLine{
  height:28px;
  border:2px solid #49718d;
  border-radius:99px;
  position:relative;
  overflow:hidden;
  background:#0a1723
}

.pipeProgress{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(0,229,255,.2),rgba(255,62,165,.3))
}

.particle{
  position:absolute;
  top:9px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--gold);
  animation:flow linear infinite
}

.steps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin-top:11px
}

.steps span{
  font-size:9px;
  padding:6px 4px;
  background:#101f2d;
  color:#7890a1;
  border-radius:5px;
  text-align:center
}

.steps .on{
  background:#ff3ea5;
  color:white
}

.flowStats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin:12px 0
}

.flowStats div{
  background:#0d1d2c;
  padding:8px;
  border-radius:8px
}

.flowStats span{
  display:block;
  font-size:9px;
  color:var(--muted)
}

.flowStats b{
  font-size:14px
}

@keyframes flow{
  from{
    left:-4%
  }

  to{
    left:104%
  }
}

.throwBox{
  background:#060d14;
  border:1px solid #22384b;
  border-radius:10px;
  padding:5px
}

.throwSvg{
  width:100%;
  height:130px
}

.score{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 8px
}

.score span{
  font-size:10px;
  color:var(--muted)
}

.score b{
  color:var(--gold);
  font-size:22px
}

.slider{
  display:block;
  margin-top:13px;
  font-size:11px
}

.slider b{
  float:right
}

.slider input{
  width:100%;
  accent-color:var(--gold)
}

.organizers{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin-top:10px
}

.organizers button{
  padding:8px 4px!important;
  margin:0!important;
  font-size:11px
}

.organizers .on{
  background:var(--magenta)!important;
  border-color:var(--magenta)!important
}

.bottom{
  max-width:1460px;
  margin:16px auto;
  display:grid;
  grid-template-columns:360px 1fr;
  gap:14px
}

.wheelCard,.logCard{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  min-width:0
}

.wheelHead{
  display:flex;
  align-items:center;
  gap:10px
}

.wheelHead h3{
  margin:0;
  font-size:14px
}

.wheelHead span{
  font-size:11px;
  color:var(--muted)
}

.wheelHead b{
  margin-left:auto;
  color:var(--gold)
}

.wheelWrap{
  display:flex;
  align-items:center;
  gap:16px;
  margin-top:14px
}

.wheel{
  width:130px;
  height:130px;
  flex:none;
  border-radius:50%;
  border:4px solid var(--gold);
  background:conic-gradient(from 0deg,#132b3d,#07131d,#213b50,#07131d);
  position:relative;
  touch-action:none;
  cursor:grab;
  -webkit-user-select:none;
     -moz-user-select:none;
          user-select:none
}

.wheel b{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font-size:28px;
  color:var(--gold)
}

.spoke{
  position:absolute;
  font-size:11px;
  font-weight:900;
  color:var(--cyan)
}

.s1{
  top:10px;
  left:55px
}

.s2{
  top:60px;
  left:8px
}

.s3{
  bottom:10px;
  left:50px
}

.s4{
  top:60px;
  right:10px;
  color:var(--magenta)
}

.wheelWrap p{
  color:var(--muted);
  font-size:12px;
  line-height:1.5
}

.logHead{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  letter-spacing:.15em
}

.logHead .dot{
  color:#59ff9f
}

.log{
  height:156px;
  overflow-y:auto;
  border:1px solid #203748;
  background:#050c13;
  padding:10px;
  margin-top:10px;
  font-size:12px;
  line-height:1.55
}

.log p{
  margin:0 0 5px;
  color:#a8c1d3
}

.log .new{
  color:white;
  background:#172e41;
  padding:3px 5px;
  border-radius:4px
}

.logFoot{
  font-size:11px;
  color:var(--muted)
}

footer{
  max-width:1460px;
  margin:0 auto;
  padding:10px 0 8px;
  color:var(--muted);
  font-size:11px;
  text-align:center
}

@media(max-width:1100px){
  .chain{
    grid-template-columns:1fr 1fr
  }

  .connector{
    display:none
  }

  .stage:nth-child(2){
    display:none
  }
}

@media(max-width:650px){
  .shell{
    padding-left:12px;
    padding-right:12px
  }

  .top{
    flex-direction:column
  }

  .meta{
    min-width:0
  }

  .chain{
    grid-template-columns:1fr
  }

  .bottom{
    grid-template-columns:1fr
  }

  .controls .keys{
    width:100%
  }

  .wheelWrap{
    flex-direction:column;
    align-items:flex-start
  }

  .btnRow{
    grid-template-columns:1fr 1fr
  }

  .btnRow button:last-child{
    grid-column:1/-1
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#040910;
    --surface:#0a1520
  }
}
