:root{

    --panel:#0b1720;
    --text:#d8fff6;
  }

*{
  box-sizing:border-box;
}

html,body,#root{
  min-height:100%;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.mono{
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

.display{
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  letter-spacing:-.02em;
  font-weight:800;
}

.chrome{
  border:1px solid var(--line);
  background:linear-gradient(180deg,#0b1720,#050a0f);
  box-shadow: inset 0 1px 0 rgba(0,255,208,.15), 0 10px 40px rgba(0,0,0,.6);
}

.inner-grid{
  background-image: linear-gradient(rgba(0,255,208,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,208,.06) 1px, transparent 1px);
  background-size:18px 18px;
}

.leem{
  width:14px;
  height:18px;
  position:relative;
  animation: leemWalk 1.2s steps(4) infinite;
}

.leem-head{
  width:10px;
  height:7px;
  background:#eafff8;
  position:absolute;
  top:0;
  left:2px;
  box-shadow:1px 1px 0 #000;
}

.leem-body{
  width:8px;
  height:7px;
  background:#22ff88;
  position:absolute;
  top:7px;
  left:3px;
  border:1px solid #000;
}

.leem-legs{
  width:8px;
  height:3px;
  background:#002b22;
  position:absolute;
  top:14px;
  left:3px;
  display:flex;
  gap:2px;
}

.leem-legs::before,.leem-legs::after{
  content:'';
  width:3px;
  height:3px;
  background:#00ff88;
  display:block;
  animation: leg .3s alternate infinite;
}

.frag{
  width:16px;
  height:20px;
  position:relative;
  animation: fragDance .9s ease-in-out infinite;
}

.frag-hair{
  width:14px;
  height:6px;
  background:#ff2d95;
  position:absolute;
  top:0;
  left:1px;
  border-radius:4px 4px 0 0;
}

.frag-face{
  width:10px;
  height:6px;
  background:#ffe9a8;
  position:absolute;
  top:6px;
  left:3px;
}

.frag-body{
  width:12px;
  height:8px;
  background:#6b7cff;
  position:absolute;
  top:12px;
  left:2px;
  border:1px solid #000;
}

.geist{
  width:18px;
  height:22px;
  position:relative;
  animation: geistFloat 2.2s ease-in-out infinite;
}

.geist-top{
  width:16px;
  height:14px;
  border-radius:8px 8px 2px 2px;
  border:1px solid #000;
  position:absolute;
  top:0;
  left:1px;
}

.geist.engel .geist-top{
  background:#fff8e0;
  box-shadow:0 0 10px rgba(255,204,51,.8);
}

.geist.teufel .geist-top{
  background:#ff2a2a;
}

.geist-eyes{
  position:absolute;
  top:5px;
  left:3px;
  display:flex;
  gap:5px;
}

.geist-eyes span{
  width:3px;
  height:3px;
  background:#000;
  border-radius:50%;
  display:block;
}

.geist-zack{
  position:absolute;
  top:13px;
  left:1px;
  width:16px;
  height:8px;
  clip-path: polygon(0 0, 20% 100%, 40% 0, 60% 100%, 80% 0, 100% 100%, 100% 0);
  opacity:.95;
}

.geist.engel{
  color:#fff8e0;
}

.geist.teufel{
  color:#ff2a2a;
}

.geist.engel .geist-zack{
  background:#fff8e0;
}

.geist.teufel .geist-zack{
  background:#ff2a2a;
}

.halo{
  width:10px;
  height:3px;
  border:1.5px solid var(--gold);
  border-radius:50%;
  position:absolute;
  top:-4px;
  left:4px;
  box-shadow:0 0 6px var(--gold);
}

.paused .leem, .paused .frag, .paused .geist{
  animation-play-state:paused;
}

@keyframes leemWalk{
  0%{
    transform:translateX(0)
  }

  50%{
    transform:translateX(3px)
  }

  100%{
    transform:translateX(0)
  }
}

@keyframes leg{
  from{
    transform:translateY(0)
  }

  to{
    transform:translateY(1px)
  }
}

@keyframes fragDance{
  0%,100%{
    transform:translateY(0) rotate(-2deg) scale(1)
  }

  50%{
    transform:translateY(-3px) rotate(2deg) scale(1.05)
  }
}

@keyframes geistFloat{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-6px)
  }
}

@keyframes scan{
  0%{
    transform:translateY(-100%)
  }

  100%{
    transform:translateY(100%)
  }
}

@keyframes ticker{
  0%{
    transform:translateX(0)
  }

  100%{
    transform:translateX(-50%)
  }
}
