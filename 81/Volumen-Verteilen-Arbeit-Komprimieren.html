  --surface:#060c14;
  --mint:#8cf0d0;
  --gold:#e8c547;
  --purple:#b388ff;
  --dim:#456658;
  --text:#b8ccc4;
  --line:rgba(140,240,208,.12);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#04070e;
    --surface:#060c14;
    --text:#b8ccc4;
  }
}

*{
  box-sizing:border-box;
}

html,body,#root{
  min-height:100%;
  background:var(--bg);
}

body{
  margin:0;
  font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color:var(--text);
  overflow-x:clip;
}

button{
  font-family:inherit;
}

.hover\:border-\[rgba\(140\2c 240\2c 208\2c \.28\)\]:hover {
  border-color: rgba(140,240,208,.28);
}

.hover\:border-\[rgba\(232\2c 197\2c 71\2c \.35\)\]:hover {
  border-color: rgba(232,197,71,.35);
}

.hover\:text-\[\#8cf0d0\]:hover {
  --tw-text-opacity: 1;
  color: rgb(140 240 208 / var(--tw-text-opacity, 1));
}

.hover\:text-\[\#e8c547\]:hover {
  --tw-text-opacity: 1;
  color: rgb(232 197 71 / var(--tw-text-opacity, 1));
}

@media (min-width: 640px) {
  .sm\:block {
    display: block;
  }

  .sm\:inline {
    display: inline;
  }

  .sm\:hidden {
    display: none;
  }

  .sm\:h-\[96px\] {
    height: 96px;
  }

  .sm\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:justify-center {
    justify-content: center;
  }

  .sm\:gap-3 {
    gap: 0.75rem;
  }

  .sm\:p-4 {
    padding: 1rem;
  }

  .sm\:px-4 {
    padding-left: 1rem;
    padding-right: 1rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pb-4 {
    padding-bottom: 1rem;
  }

  .sm\:pt-6 {
    padding-top: 1.5rem;
  }

  .sm\:text-\[13px\] {
    font-size: 13px;
  }

  .sm\:text-\[36px\] {
    font-size: 36px;
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-\[1\.1fr_1\.6fr\] {
    grid-template-columns: 1.1fr 1.6fr;
  }
}
