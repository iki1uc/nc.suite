  line-height: 0.95;
}

.leading-\[1\.65\] {
  line-height: 1.65;
}

.leading-relaxed {
  line-height: 1.625;
}

.leading-tight {
  line-height: 1.25;
}

.tracking-\[0\.22em\] {
  letter-spacing: 0.22em;
}

.tracking-\[0\.28em\] {
  letter-spacing: 0.28em;
}

.tracking-widest {
  letter-spacing: 0.1em;
}

.text-black {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.text-white {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.accent-\[\#e8c87a\] {
  accent-color: #e8c87a;
}

.outline-none {
  outline: 2px solid transparent;
  outline-offset: 2px;
}

.blur {
  --tw-blur: blur(8px);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.filter {

}

:root{
  --bg:#05080c;
  --surface:#0a1018;
  --surface2:#0f1722;
  --line:#263244;
  --gold:#e8c87a;
  --ink:#f3ead3;
  --muted:#9fb0c3;
  --purple:#8000FF;
  --blue:#0080FF;
  --green:#00C878;
  --yellow:#FFD200;
  --red:#FF4040;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#05080c;
    --surface:#0a1018;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink)
}

body{
  font-family:Georgia, "Times New Roman", serif
}

.mono{
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace
}

button{
  font-family:inherit
}

input,textarea{
  font-family:ui-monospace, Menlo, monospace
}

.grid81{
  display:grid;
  grid-template-columns:repeat(9,1fr);
  gap:4px
}

.cell{
  aspect-ratio:1/1;
  border:1px solid rgba(255,255,255,.14);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  line-height:1;
  cursor:pointer;
  position:relative;
  border-radius:4px;
  transition:transform .12s, box-shadow .12s
}

.cell:hover{
  transform:translateY(-1px);
  box-shadow:0 4px 16px rgba(0,0,0,.45)
}

.cell.selected{
  outline:2px solid var(--gold);
  outline-offset:2px
}

.path-cell{
  outline:2px solid #fff;
  outline-offset:1px;
  box-shadow:0 0 0 3px rgba(232,200,122,.45)
}

.ring-step{
  transition:all .25s
}

.ring-step.active{
  background:var(--gold);
  color:#111;
  border-color:var(--gold);
  transform:scale(1.08)
}

.corridor-box{
  transition:all .2s
}

@keyframes spinSlow{
  from{
    transform:rotate(0)
  }

  to{
    transform:rotate(360deg)
  }
}

.spin{
  animation:spinSlow 2.2s linear infinite
}

@keyframes pulseGold{
  0%,100%{
    box-shadow:0 0 0 0 rgba(232,200,122,.45)
  }

  50%{
    box-shadow:0 0 0 10px rgba(232,200,122,0)
  }
}

.pulse{
  animation:pulseGold 1.6s infinite
}

.last\:border-0:last-child {
  border-width: 0px;
}

.focus\:border-yellow-300:focus {
  --tw-border-opacity: 1;
  border-color: rgb(253 224 71 / var(--tw-border-opacity, 1));
}

.disabled\:opacity-60:disabled {
  opacity: 0.6;
}

@media (min-width: 640px) {
  .sm\:-mx-6 {
    margin-left: -1.5rem;
    margin-right: -1.5rem;
  }

  .sm\:block {
    display: block;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:grid-cols-\[90px_160px_1fr_170px\] {
    grid-template-columns: 90px 160px 1fr 170px;
  }

  .sm\:p-4 {
    padding: 1rem;
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:text-4xl {
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .sm\:text-\[58px\] {
    font-size: 58px;
  }

  .sm\:text-\[64px\] {
    font-size: 64px;
  }

  .sm\:text-xl {
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:sticky {
    position: sticky;
  }

  .lg\:top-20 {
    top: 5rem;
  }

  .lg\:grid-cols-\[1fr_290px\] {
    grid-template-columns: 1fr 290px;
  }

  .lg\:grid-cols-\[1fr_330px\] {
    grid-template-columns: 1fr 330px;
  }

  .lg\:grid-cols-\[340px_1fr\] {
    grid-template-columns: 340px 1fr;
  }
}
