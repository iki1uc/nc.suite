  --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(2px + var(--tw-ring-offset-width)) var(--tw-ring-color);
  box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
}

.ring-\[\#a33\] {
  --tw-ring-opacity: 1;
  --tw-ring-color: rgb(170 51 51 / var(--tw-ring-opacity, 1));
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.backdrop-blur {
  --tw-backdrop-blur: blur(8px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}

.transition {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --parchment:#f2e8cf;
  --parchment2:#e8d9b0;
  --parchment3:#f8f0d8;
  --ink:#3a2a12;
  --ink2:#6b4f22;
  --red:#a33333;
  --red2:#8a2626;
  --gold:#b89a2a;
  --gold2:#8a6f14;
  --line:rgba(58,42,18,.28);
}

@media (prefers-color-scheme: dark){
  :root{
    --parchment:#2a2113;
    --parchment2:#231b0e;
    --parchment3:#332813;
    --ink:#f2e8cf;
    --ink2:#d9c795;
    --red:#d97a6a;
    --gold:#d4b93a;
    --line:rgba(242,232,207,.28);
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--parchment2);
  color:var(--ink);
  font-family:"Cormorant Garamond",Georgia,serif
}

.font-hand{
  font-family:"Caveat",cursive
}

.font-mono2{
  font-family:"Special Elite","Courier New",monospace
}

.parchment-bg{
  background:
    radial-gradient(ellipse at 18% 8%, rgba(184,154,42,.18), transparent 42%),
    radial-gradient(ellipse at 88% 92%, rgba(163,51,51,.10), transparent 38%),
    linear-gradient(180deg, var(--parchment) 0%, var(--parchment2) 62%, #e6d3a0 100%);
}

.paper-card{
  background:linear-gradient(180deg, var(--parchment3), var(--parchment));
  border:1px solid var(--line);
  box-shadow:0 1px 0 rgba(58,42,18,.12), 0 10px 28px rgba(58,42,18,.10);
}

.ink-line{
  border-color:var(--line)
}

.mirror{
  transform:scaleX(-1)
}

.notebook{
  transition:transform .45s ease
}

input[type=range]{
  accent-color:var(--red)
}

textarea{
  font-family:"Special Elite",monospace
}

::-moz-selection{
  background:var(--gold);
  color:#fff
}

::selection{
  background:var(--gold);
  color:#fff
}

::-webkit-scrollbar{
  width:8px;
  height:8px
}

::-webkit-scrollbar-thumb{
  background:#c9b47a;
  border-radius:99px
}

.hover\:border-\[\#b89a2a\]:hover {
  --tw-border-opacity: 1;
  border-color: rgb(184 154 42 / var(--tw-border-opacity, 1));
}

.hover\:bg-\[\#8a2626\]:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(138 38 38 / var(--tw-bg-opacity, 1));
}

.hover\:bg-\[\#a33\]:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(170 51 51 / var(--tw-bg-opacity, 1));
}

.hover\:bg-\[\#a33\]\/10:hover {
  background-color: rgb(170 51 51 / 0.1);
}

.hover\:bg-\[\#e8d9b0\]:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(232 217 176 / var(--tw-bg-opacity, 1));
}

.hover\:bg-black\/5:hover {
  background-color: rgb(0 0 0 / 0.05);
}

.hover\:text-white:hover {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.focus\:border-\[\#a33\]:focus {
  --tw-border-opacity: 1;
  border-color: rgb(170 51 51 / var(--tw-border-opacity, 1));
}

@media (min-width: 640px) {
  .sm\:ml-4 {
    margin-left: 1rem;
  }

  .sm\:inline {
    display: inline;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:grid-cols-6 {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }

  .sm\:grid-cols-\[1\.15fr_1fr\] {
    grid-template-columns: 1.15fr 1fr;
  }

  .sm\:p-4 {
    padding: 1rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:text-\[17px\] {
    font-size: 17px;
  }

  .sm\:text-\[36px\] {
    font-size: 36px;
  }
}

@media (min-width: 768px) {
  .md\:inline {
    display: inline;
  }
}

@media (min-width: 1024px) {
  .lg\:col-span-5 {
    grid-column: span 5 / span 5;
  }

  .lg\:col-span-7 {
    grid-column: span 7 / span 7;
  }
}
