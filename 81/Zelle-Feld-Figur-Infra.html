  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.outline{
  outline-style: solid;
}

:root{
  --bg:#050508;
  --surface:#0a0a12;
  --surface-2:#0e0e18;
  --line:rgba(46,230,255,.22);
  --line-soft:rgba(255,255,255,.08);
  --text:#eceef6;
  --muted:#9aa0b3;
  --dim:#6b6f7a;
  --cyan:#2ee6ff;
  --red:#ff3b3b;
  --yellow:#ffd21f;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#050508;
    --surface:#0a0a12;
  }
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
}

body{
  font-family:"Space Grotesk", system-ui, sans-serif;
}

.mono{
  font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
}

.grid-bg{
  background-image:
    linear-gradient(rgba(46,230,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(46,230,255,.045) 1px, transparent 1px);
  background-size:32px 32px;
}

.cell{
  background:#08080f;
  border:1px solid rgba(46,230,255,.28);
  position:relative;
  min-height:0;
}

.cell-home{
  background:#ff3b3b;
  border-color:#ff6a6a;
  color:#050508;
  box-shadow:0 0 0 2px rgba(255,59,59,.35), 0 0 32px rgba(255,59,59,.35);
}

.mode-btn{
  transition:background .18s ease, color .18s ease, border-color .18s ease;
}

.mode-btn.active{
  background:var(--text);
  color:#050508;
  border-color:var(--text);
}

.stage-card{
  transition:border-color .18s ease, background .18s ease;
}

.hover\:border-white\/50:hover{
  border-color: rgb(255 255 255 / 0.5);
}

@media (min-width: 640px){
  .sm\:block{
    display: block;
  }

  .sm\:w-\[420px\]{
    width: 420px;
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:items-center{
    align-items: center;
  }

  .sm\:justify-between{
    justify-content: space-between;
  }

  .sm\:p-1\.5{
    padding: 0.375rem;
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pt-12{
    padding-top: 3rem;
  }

  .sm\:text-\[11px\]{
    font-size: 11px;
  }

  .sm\:text-\[15px\]{
    font-size: 15px;
  }

  .sm\:text-\[72px\]{
    font-size: 72px;
  }

  .sm\:text-\[9px\]{
    font-size: 9px;
  }

  .sm\:text-xl{
    font-size: 1.25rem;
    line-height: 1.75rem;
  }

  .sm\:text-xs{
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 1024px){
  .lg\:grid-cols-\[minmax\(0\2c 1fr\)_300px\]{
    grid-template-columns: minmax(0,1fr) 300px;
  }

  .lg\:gap-8{
    gap: 2rem;
  }

  .lg\:px-8{
    padding-left: 2rem;
    padding-right: 2rem;
  }
}
