:root {
  --bg: #050805;
  --surface: #0a100b;
  --surface2: #101a10;
  --line: #243425;
  --gold: #f2c94c;
  --cyan: #35e6ff;
  --green: #7ee787;
  --ink: #f4f0df;
  --muted: #aab8a9;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
}

button, a {
  font: inherit;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
}

.shell {
  min-height: 100vh;
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: var(--safe-area-inset-top) 20px 0;
  background: radial-gradient(circle at 88% 8%, rgba(53,230,255,.10), transparent 28%), radial-gradient(circle at 5% 28%, rgba(242,201,76,.08), transparent 25%), var(--bg);
  overflow-x: clip;
}

.topbar {
  min-height: 66px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  letter-spacing: .14em;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
}

.dot {
  width: 11px;
  height: 11px;
  background: var(--green);
  box-shadow: 0 0 18px var(--green);
  border-radius: 50%;
}

.top-note b {
  color: var(--gold);
}

.hero {
  padding: 64px 0 54px;
  border-bottom: 1px solid var(--line);
}

.eyebrow, .section-head > span, .kicker {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  letter-spacing: .18em;
  color: var(--cyan);
  text-transform: uppercase;
}

.hero h1 {
  font-size: clamp(46px, 8vw, 88px);
  line-height: .92;
  letter-spacing: -.055em;
  margin: 20px 0 20px;
  font-weight: 400;
}

.hero h1 span {
  color: var(--gold);
  font-style: italic;
}

.lede {
  max-width: 680px;
  font-size: 20px;
  line-height: 1.5;
  color: #d7dfd3;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 30px 0 28px;
}

.hero-actions a {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--gold);
  color: #171203;
  padding: 13px 18px;
  text-decoration: none;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-weight: 800;
  font-size: 13px;
  border: 1px solid var(--gold);
}

.hero-actions a.ghost {
  background: transparent;
  color: var(--ink);
  border-color: var(--line);
}

.hero-marks {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.hero-marks span {
  padding: 14px 20px 14px 0;
  margin-right: 20px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  color: var(--muted);
}

.hero-marks b {
  color: var(--ink);
  font-size: 18px;
  margin-right: 5px;
}

.section {
  padding: 68px 0;
  border-bottom: 1px solid var(--line);
}

.section-head {
  max-width: 760px;
  margin-bottom: 30px;
}

.section-head h2 {
  font-size: clamp(32px, 5vw, 52px);
  line-height: 1.03;
  letter-spacing: -.03em;
  margin: 14px 0 12px;
  font-weight: 400;
}

.section-head h2 em {
  color: var(--gold);
  font-weight: 400;
}

.section-head p {
  color: var(--muted);
  font-size: 18px;
  line-height: 1.55;
  margin: 0;
}

.circuit {
  display: grid;
  grid-template-columns: 1fr 18px 1fr 18px 1fr 18px 1fr;
  align-items: stretch;
  gap: 8px;
}

.part {
  min-height: 180px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--ink);
  text-align: left;
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  transition: .2s;
}

.part:hover {
  border-color: var(--gold);
  transform: translateY(-2px);
}

.part.selected {
  border-color: var(--gold);
  background: #171507;
  box-shadow: inset 0 0 0 1px var(--gold);
}

.part-index {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--muted);
}

.part-icon {
  color: var(--cyan);
  margin: 26px 0 14px;
}

.part strong {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  line-height: 1.4;
}

.part small {
  color: var(--muted);
  margin-top: 8px;
  line-height: 1.45;
}

.arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold);
  font-size: 20px;
}

.active-detail {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 16px;
  padding: 17px;
  background: #0e180f;
  border-left: 3px solid var(--green);
}

.active-detail > div {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.active-detail strong {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
}

.active-detail span {
  color: var(--muted);
  font-size: 14px;
}

.complete {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--green);
}

.rules {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-top: 14px;
}

.rules article {
  border: 1px solid var(--line);
  padding: 15px;
  display: flex;
  gap: 10px;
  background: var(--surface);
}

.rules article svg {
  color: var(--green);
  flex: 0 0 auto;
}

.rules h3 {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  margin: 0 0 7px;
}

.rules p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}

.forms-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.form-card {
  text-align: left;
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--line);
  padding: 24px;
  min-height: 330px;
  display: flex;
  flex-direction: column;
  transition: .2s;
}

.form-card:hover {
  transform: translateY(-3px);
  border-color: #5f6d5e;
}

.form-card.active {
  border-color: var(--cyan);
  background: #07161a;
  box-shadow: inset 0 0 0 1px var(--cyan);
}

.form-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.letter {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 22px;
  font-weight: 800;
}

.shape-icon {
  color: var(--cyan);
}

.form-card h3 {
  font-size: 32px;
  margin: 36px 0 4px;
  letter-spacing: -.02em;
}

.shape {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--gold);
  font-size: 12px;
  line-height: 1.5;
}

.form-card > p {
  color: var(--muted);
  line-height: 1.5;
}

.mini-scores {
  display: flex;
  gap: 18px;
  margin-top: auto;
  padding-top: 22px;
  border-top: 1px solid var(--line);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--muted);
}

.mini-scores b {
  color: var(--ink);
}

.choose {
  margin-top: 14px;
  color: var(--cyan);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
}

.selection-panel {
  margin-top: 14px;
  border: 1px solid var(--line);
  background: var(--surface2);
  display: grid;
  grid-template-columns: 1.2fr .8fr;
}

.selection-copy {
  padding: 28px;
}

.selection-copy h3 {
  font-size: 30px;
  margin: 10px 0;
}

.selection-copy p {
  color: var(--muted);
  line-height: 1.5;
}

.verdict {
  display: inline-block;
  margin-top: 12px;
  color: var(--gold);
}

.selection-scores {
  padding: 28px;
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.score-head {
  display: flex;
  justify-content: space-between;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  letter-spacing: .1em;
  margin-bottom: 8px;
}

.track {
  height: 8px;
  background: #050805;
  overflow: hidden;
}

.track span {
  display: block;
  height: 100%;
  transition: width .45s ease;
}

.balance {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 14px;
}

.burro-section {
  background: linear-gradient(90deg, rgba(242,201,76,.04), transparent);
}

.burro-grid {
  display: grid;
  grid-template-columns: 1.35fr .65fr;
  border: 1px solid var(--line);
  background: #080d08;
}

.burro-visual {
  padding: 34px;
  border-right: 1px solid var(--line);
  text-align: center;
}

.donkey {
  font-size: 84px;
  line-height: 1;
  filter: drop-shadow(0 0 20px rgba(242,201,76,.2));
}

.fold-number {
  margin: 18px 0 20px;
}

.fold-number span {
  display: block;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: clamp(58px, 10vw, 92px);
  color: var(--gold);
  line-height: 1;
  letter-spacing: -.08em;
}

.fold-number small {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--muted);
  letter-spacing: .15em;
  font-size: 11px;
}

.fold-chain {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

.fold-chain span {
  padding: 7px 10px;
  border: 1px solid var(--line);
  color: var(--muted);
}

.fold-chain span.now {
  color: #111;
  background: var(--gold);
  border-color: var(--gold);
}

.fold-chain span.passed {
  color: var(--green);
}

.fold-actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 24px;
}

.fold-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--gold);
  border: 1px solid var(--gold);
  color: #171203;
  padding: 13px 20px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-weight: 800;
}

.fold-btn:disabled {
  opacity: .65;
}

.reset {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
  padding: 13px 16px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

.home-callout {
  margin: 22px auto 0;
  max-width: 460px;
  border: 1px solid var(--green);
  padding: 15px;
  display: flex;
  gap: 14px;
  text-align: left;
  align-items: center;
}

.home-callout span {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--green);
  font-weight: 800;
}

.home-callout p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}

.math {
  padding: 30px;
}

.math h3 {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  letter-spacing: .15em;
  color: var(--cyan);
  margin: 0;
}

.equation {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 40px;
  margin: 18px 0;
  color: var(--gold);
}

.equation small {
  color: var(--muted);
}

.math > p {
  line-height: 1.6;
  color: var(--muted);
}

.math > p b {
  color: var(--ink);
}

.math ul {
  list-style: none;
  padding: 0;
  margin: 24px 0;
  border-top: 1px solid var(--line);
}

.math li {
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  line-height: 1.5;
  color: var(--muted);
}

.math li b {
  color: var(--ink);
}

.math code {
  color: var(--cyan);
}

.scale {
  background: #0e1510;
  padding: 15px;
  font-size: 13px;
  line-height: 1.5;
}

.scale span {
  display: block;
  color: var(--muted);
}

.scale strong {
  color: var(--green);
}

.parts-list {
  border-top: 1px solid var(--line);
}

.parts-row {
  display: grid;
  grid-template-columns: 45px 160px 1fr 30px;
  align-items: center;
  gap: 16px;
  padding: 18px 4px;
  border-bottom: 1px solid var(--line);
}

.parts-row > span:first-child {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--gold);
}

.parts-row strong {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
}

.parts-row > span:nth-child(3) {
  color: var(--muted);
}

.parts-row svg {
  color: var(--green);
}

.summary-strip {
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 30px;
  padding: 18px;
  border: 1px solid var(--line);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  color: var(--muted);
}

.summary-strip b {
  color: var(--gold);
  margin-left: 6px;
}

footer {
  padding: 32px 0 40px;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  align-items: center;
}

footer span {
  color: var(--muted);
}

.footer-math {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--gold);
}

.footer-math i {
  color: var(--muted);
  font-style: normal;
}

@media (max-width: 700px) {
  .shell {
    padding-left: 14px;
    padding-right: 14px;
  }

  .top-note {
    display: none;
  }

  .hero {
    padding-top: 44px;
  }

  .section {
    padding: 52px 0;
  }

  .circuit {
    grid-template-columns: 1fr 1fr;
  }

  .arrow {
    display: none;
  }

  .part {
    min-height: 165px;
  }

  .rules {
    grid-template-columns: 1fr 1fr;
  }

  .forms-grid, .selection-panel, .burro-grid {
    grid-template-columns: 1fr;
  }

  .form-card {
    min-height: 300px;
  }

  .selection-scores {
    border-left: 0;
    border-top: 1px solid var(--line);
  }

  .burro-visual {
    border-right: 0;
    border-bottom: 1px solid var(--line);
    padding: 28px 16px;
  }

  .active-detail {
    align-items: flex-start;
  }

  .complete {
    display: none;
  }

  .parts-row {
    grid-template-columns: 34px 1fr 24px;
  }

  .parts-row > span:nth-child(3) {
    grid-column: 2 / 3;
  }

  footer {
    flex-direction: column;
    align-items: flex-start;
  }
}

@media (max-width: 430px) {
  .rules {
    grid-template-columns: 1fr;
  }

  .circuit {
    grid-template-columns: 1fr;
  }

  .parts-row {
    grid-template-columns: 30px 1fr 22px;
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050805;
    --surface: #0a100b;
    --ink: #f4f0df;
  }
}
