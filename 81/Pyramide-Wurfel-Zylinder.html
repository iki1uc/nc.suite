:root{
  --bg:#05070d;
  --surface:#0a101d;
  --surface2:#111a2c;
  --line:#22304d;
  --text:#f4f7ff;
  --muted:#9aa9c5;
  --cyan:#00e5ff;
  --magenta:#ff2ea6;
  --yellow:#ffe600;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Space Grotesk",system-ui,sans-serif
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

a{
  color:inherit
}

.app{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  background:radial-gradient(circle at 15% 5%,rgba(0,229,255,.12),transparent 30%),radial-gradient(circle at 90% 25%,rgba(255,46,166,.11),transparent 28%),var(--bg);
  overflow-x:clip
}

header{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  height:64px;
  padding:0 5vw;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  background:rgba(5,7,13,.9);
  backdrop-filter:blur(12px)
}

.logo{
  font-family:"Archivo Black",sans-serif;
  letter-spacing:.08em
}

.logo span{
  color:var(--cyan)
}

nav{
  display:flex;
  gap:26px;
  font-family:"JetBrains Mono",monospace;
  font-size:11px;
  letter-spacing:.12em
}

nav a{
  text-decoration:none
}

.live{
  font-family:"JetBrains Mono",monospace;
  font-size:11px;
  color:var(--cyan);
  border:1px solid var(--cyan);
  padding:7px 10px;
  border-radius:99px
}

main{
  max-width:1280px;
  margin:auto;
  padding:0 5vw 70px
}

.hero{
  padding:62px 0 38px
}

.eyebrow,.kicker{
  font-family:"JetBrains Mono",monospace;
  color:var(--cyan);
  font-size:12px;
  letter-spacing:.16em;
  font-weight:700
}

.hero h1{
  font-family:"Archivo Black",sans-serif;
  font-size:clamp(48px,9vw,118px);
  line-height:.86;
  letter-spacing:-.04em;
  margin:18px 0
}

.hero h1 span{
  color:transparent;
  -webkit-text-stroke:2px var(--yellow)
}

.hero-sub{
  max-width:700px;
  color:var(--muted);
  font-size:18px;
  line-height:1.55
}

.hero-buttons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:32px
}

.hero-btn{
  min-height:138px;
  border:1px solid var(--line);
  background:var(--surface);
  color:white;
  text-align:left;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:6px;
  transition:.2s
}

.hero-btn:hover,.hero-btn.active{
  border-color:var(--c);
  box-shadow:0 0 0 1px var(--c),0 0 30px color-mix(in srgb,var(--c) 25%,transparent);
  transform:translateY(-2px)
}

.hero-btn svg{
  color:var(--c)
}

.hero-btn span{
  font-family:"Archivo Black",sans-serif;
  font-size:24px
}

.hero-btn small{
  font-family:"JetBrains Mono",monospace;
  font-size:10px;
  color:var(--muted)
}

.hero-strip{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:18px;
  font-family:"JetBrains Mono",monospace;
  font-size:12px
}

.hero-strip span{
  border:1px solid var(--line);
  padding:8px 12px;
  background:#080d17
}

.section-head{
  display:flex;
  justify-content:space-between;
  gap:30px;
  align-items:end;
  margin:50px 0 20px
}

.section-head h2,.compare h2,.build h2,.hardware h2{
  font-family:"Archivo Black",sans-serif;
  font-size:clamp(34px,5vw,62px);
  line-height:.9;
  margin:10px 0
}

.section-head h2 span,.compare h2,.build h2{
  color:var(--yellow)
}

.section-head>p{
  color:var(--muted);
  max-width:330px
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:14px
}

.tab{
  border:1px solid var(--line);
  background:#0a101d;
  color:white;
  padding:12px 18px;
  display:flex;
  gap:8px;
  align-items:center
}

.tab.active{
  background:var(--c);
  color:#05070d;
  font-weight:800
}

.panel{
  border:1px solid var(--c);
  display:grid;
  grid-template-columns:1.1fr .9fr;
  background:#080d17;
  box-shadow:0 0 45px color-mix(in srgb,var(--c) 12%,transparent)
}

.panel-left{
  padding:22px;
  border-right:1px solid var(--line)
}

.stage-top{
  display:flex;
  justify-content:space-between;
  font-family:"JetBrains Mono",monospace;
  font-size:11px;
  color:var(--muted);
  margin-bottom:10px
}

.stage-top span:first-child{
  display:flex;
  gap:6px;
  align-items:center
}

.viewport{
  height:300px;
  border:1px solid var(--line);
  position:relative;
  overflow:hidden;
  background:#04070f;
  display:grid;
  place-items:center;
  touch-action:none;
  cursor:grab
}

.viewport:active{
  cursor:grabbing
}

.grid-bg{
  position:absolute;
  inset:0;
  background-image:linear-gradient(rgba(0,229,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.07) 1px,transparent 1px);
  background-size:28px 28px
}

.axis{
  position:absolute;
  bottom:10px;
  left:10px;
  font-family:"JetBrains Mono",monospace;
  font-size:11px;
  color:var(--muted);
  z-index:2
}

.stage-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
  gap:10px
}

.stage-actions button,.controls-head button{
  border:1px solid var(--line);
  background:var(--surface);
  color:white;
  padding:9px 11px;
  display:flex;
  align-items:center;
  gap:7px;
  font-family:"JetBrains Mono",monospace;
  font-size:11px
}

.zoom{
  display:flex;
  align-items:center;
  gap:8px
}

.zoom button{
  padding:7px
}

.zoom span{
  font-family:"JetBrains Mono",monospace;
  font-size:10px
}

.hint{
  font-family:"JetBrains Mono",monospace;
  font-size:10px
}

.voice{
  display:flex;
  gap:12px;
  margin-top:18px;
  padding:16px;
  background:var(--surface);
  border-left:3px solid var(--c);
  min-height:88px
}

.voice svg{
  color:var(--c);
  flex:none
}

.voice small{
  font-family:"JetBrains Mono",monospace;
  color:var(--muted)
}

.voice p{
  margin:5px 0;
  line-height:1.45
}

.understand{
  width:100%;
  margin-top:12px;
  border:0;
  background:var(--c);
  color:#05070d;
  padding:14px;
  font-weight:800;
  display:flex;
  justify-content:center;
  gap:8px
}

.panel-right{
  padding:22px
}

.controls-head{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.controls-head h3{
  font-family:"Archivo Black",sans-serif;
  margin:0
}

.sliders{
  display:grid;
  gap:17px;
  margin-top:20px
}

.slider span{
  display:flex;
  justify-content:space-between;
  font-size:13px
}

.slider input{
  width:100%;
  accent-color:var(--c);
  margin:7px 0 2px
}

.slider small{
  font-family:"JetBrains Mono",monospace;
  color:var(--muted);
  font-size:10px
}

.formulas{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:20px 0
}

.formulas div{
  border:1px solid var(--line);
  padding:11px
}

.formulas small{
  display:block;
  color:var(--muted);
  font-family:"JetBrains Mono",monospace
}

.formulas strong{
  font-size:14px
}

.results{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.big{
  border:1px solid var(--c);
  padding:14px;
  background:color-mix(in srgb,var(--c) 8%,transparent)
}

.big small{
  display:block;
  color:var(--muted);
  font-family:"JetBrains Mono",monospace
}

.big strong{
  font-size:23px
}

.big span{
  font-size:13px
}

.meta-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:12px 0
}

.meta-grid div{
  border:1px solid var(--line);
  padding:10px;
  text-align:center
}

.meta-grid b{
  display:block;
  font-size:14px
}

.meta-grid span{
  font-family:"JetBrains Mono",monospace;
  font-size:9px;
  color:var(--muted)
}

.fit{
  border-top:1px solid var(--line);
  padding-top:16px
}

.fit-title{
  display:flex;
  gap:8px;
  align-items:center
}

.fit-title h4{
  margin:0
}

.fit p{
  color:#cbd6ec;
  line-height:1.5;
  font-size:14px
}

.fit-bar{
  height:24px;
  background:#14203a;
  position:relative;
  margin-top:12px
}

.fit-bar i{
  display:block;
  height:100%;
  background:var(--c)
}

.fit-bar span{
  position:absolute;
  left:8px;
  top:4px;
  font-family:"JetBrains Mono",monospace;
  font-size:10px;
  color:#05070d;
  font-weight:700
}

.compare{
  padding-top:70px
}

.compare-note{
  color:var(--muted);
  max-width:680px
}

.compare-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:24px
}

.compare-card{
  border:1px solid var(--line);
  background:var(--surface);
  padding:20px
}

.compare-card:hover{
  border-color:var(--c)
}

.cc-top{
  display:flex;
  gap:10px;
  align-items:center;
  color:var(--c);
  font-weight:800
}

.cc-vol{
  padding:22px 0;
  border-bottom:1px solid var(--line)
}

.cc-vol small{
  display:block;
  color:var(--muted);
  font-family:"JetBrains Mono",monospace
}

.cc-vol strong{
  font-size:28px
}

.cc-rows{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  padding:16px 0;
  font-size:13px
}

.cc-rows span{
  color:var(--muted)
}

.compare-card button{
  width:100%;
  border:1px solid var(--c);
  color:var(--c);
  background:transparent;
  padding:11px;
  font-weight:800
}

.insight{
  margin-top:16px;
  border:1px solid var(--yellow);
  padding:16px;
  background:rgba(255,230,0,.06)
}

.build{
  padding-top:70px
}

.build-grid{
  display:grid;
  grid-template-columns:.9fr 1.1fr;
  gap:18px;
  margin-top:22px
}

.tower-wrap{
  border:1px solid var(--line);
  background:#070c16;
  min-height:420px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  padding:20px
}

.tower{
  width:220px;
  display:flex;
  flex-direction:column;
  align-items:center
}

.tower-layer{
  width:100%;
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  font-family:"JetBrains Mono",monospace;
  font-weight:700
}

.tower-layer button{
  position:absolute;
  right:5px;
  top:5px;
  border:0;
  background:#05070d;
  color:white;
  width:24px;
  height:24px
}

.tower-layer.zylinder{
  background:linear-gradient(90deg,#3a0a24,#ff2ea6,#3a0a24);
  border-radius:40px / 18px;
  border:2px solid #ff2ea6
}

.tower-layer.wurfel{
  background:rgba(0,229,255,.18);
  border:2px solid #00e5ff
}

.tower-layer.pyramide{
  width:150px;
  background:#ffe600;
  color:#05070d;
  clip-path:polygon(50% 0,100% 100%,0 100%)
}

.tower-layer.pyramide span{
  margin-top:24px
}

.tower-base{
  width:270px;
  height:10px;
  background:#263553;
  margin-top:8px;
  text-align:center;
  font-size:9px;
  font-family:"JetBrains Mono",monospace
}

.build-controls{
  border:1px solid var(--line);
  padding:22px;
  background:var(--surface)
}

.build-controls>p{
  color:var(--muted);
  line-height:1.6
}

.add-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:18px 0
}

.add-row button{
  border:1px solid var(--c);
  background:transparent;
  color:white;
  padding:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-weight:800
}

.tower-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}

.tower-stats div{
  border:1px solid var(--line);
  padding:14px
}

.tower-stats small{
  display:block;
  color:var(--muted);
  font-family:"JetBrains Mono",monospace
}

.tower-stats strong{
  font-size:20px
}

.build-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:14px 0
}

.build-actions button{
  border:1px solid var(--line);
  background:#0a101d;
  color:white;
  padding:11px;
  display:flex;
  gap:7px
}

.build-tip{
  border-left:3px solid var(--yellow);
  padding:12px;
  background:rgba(255,230,0,.06);
  line-height:1.5
}

.hardware{
  padding-top:70px
}

.hardware h2{
  color:white
}

.hw-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:22px
}

.hw{
  padding:24px;
  border:1px solid var(--line);
  background:var(--surface)
}

.hw.cyan{
  border-top:4px solid var(--cyan)
}

.hw.magenta{
  border-top:4px solid var(--magenta)
}

.hw.yellow{
  border-top:4px solid var(--yellow)
}

.hw svg{
  color:var(--cyan)
}

.hw.magenta svg{
  color:var(--magenta)
}

.hw.yellow svg{
  color:var(--yellow)
}

.hw-form{
  display:block;
  margin:14px 0 2px;
  font-family:"JetBrains Mono",monospace;
  font-size:11px;
  color:var(--muted)
}

.hw h3{
  font-family:"Archivo Black",sans-serif;
  margin:0 0 10px
}

.hw p{
  color:var(--muted);
  line-height:1.6
}

.chips{
  display:flex;
  gap:7px;
  flex-wrap:wrap
}

.chips span{
  border:1px solid var(--line);
  padding:5px 8px;
  font-family:"JetBrains Mono",monospace;
  font-size:10px
}

.hw-note{
  margin-top:16px;
  border:1px solid var(--line);
  padding:18px;
  line-height:1.6;
  background:#0a101d
}

.footnote{
  color:var(--muted);
  font-size:13px;
  margin-top:28px
}

@media(max-width:760px){
  nav{
    display:none
  }

  .live{
    display:none
  }

  .hero{
    padding-top:38px
  }

  .hero-buttons{
    grid-template-columns:1fr
  }

  .hero-btn{
    min-height:100px
  }

  .section-head{
    align-items:flex-start;
    flex-direction:column
  }

  .section-head>p{
    max-width:none
  }

  .panel{
    grid-template-columns:1fr
  }

  .panel-left{
    border-right:0;
    border-bottom:1px solid var(--line);
    padding:14px
  }

  .panel-right{
    padding:16px
  }

  .stage-actions{
    flex-wrap:wrap
  }

  .hint{
    width:100%
  }

  .compare-grid,.hw-grid{
    grid-template-columns:1fr
  }

  .build-grid{
    grid-template-columns:1fr
  }

  .tower-wrap{
    min-height:360px
  }

  .add-row{
    grid-template-columns:1fr
  }

  .tower-stats{
    grid-template-columns:1fr
  }

  .meta-grid{
    grid-template-columns:repeat(2,1fr)
  }

  .formulas{
    grid-template-columns:1fr
  }

  .tabs{
    overflow-x:auto;
    padding-bottom:4px
  }

  .tab{
    white-space:nowrap
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#05070d
  }
}
