:root {
  --bg: #050805;
  --surface: #0c140e;
  --surface2: #111e13;
  --ink: #fffdf2;
  --muted: #b9c4b9;
  --gold: #f2c94c;
  --cyan: #35e6ff;
  --purple: #a855f7;
  --line: #26382a;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
}

button {
  font-family: "Courier New", Courier, monospace;
}

.page-shell {
  min-height: 100vh;
  width: 100%;
  padding: var(--safe-area-inset-top) 14px 28px;
  background: radial-gradient(circle at 15% 5%, rgba(168,85,247,.18), transparent 30%), radial-gradient(circle at 85% 10%, rgba(53,230,255,.13), transparent 28%), var(--bg);
  overflow-x: clip;
}

.app {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
}

.hero {
  text-align: center;
  padding: 28px 8px 24px;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--gold);
  font-family: "Courier New", monospace;
  font-size: 12px;
  letter-spacing: .16em;
  font-weight: 800;
  border: 1px solid #4d4020;
  padding: 7px 12px;
  border-radius: 999px;
  background: rgba(242,201,76,.08);
}

.hero h1 {
  font-family: "Courier New", monospace;
  font-size: clamp(32px, 7vw, 64px);
  line-height: .98;
  letter-spacing: -.06em;
  margin: 20px 0 16px;
  text-transform: uppercase;
}

.hero h1 span {
  display: block;
}

.cyan-text {
  color: var(--cyan);
  text-shadow: 0 0 24px rgba(53,230,255,.45);
}

.purple-text {
  color: #d29bff;
  text-shadow: 0 0 24px rgba(168,85,247,.5);
}

.gold-text {
  color: var(--gold);
  text-shadow: 0 0 28px rgba(242,201,76,.5);
}

.plus, .equals {
  font-size: .58em;
  color: #fff;
  opacity: .85;
  margin: 3px 0;
}

.hero p {
  color: var(--muted);
  font-size: 18px;
  line-height: 1.55;
  max-width: 760px;
  margin: 0 auto;
}

.hero p strong {
  color: #fff;
}

.hero-chips {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 18px;
}

.hero-chips span {
  font-family: "Courier New", monospace;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .1em;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #0d170f;
}

.arena {
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, #0b170e, #081009);
  border: 2px solid #314a33;
  border-radius: 22px;
  padding: 16px;
  box-shadow: 0 24px 70px rgba(0,0,0,.45);
}

.arena-label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-family: "Courier New", monospace;
  font-size: 11px;
  letter-spacing: .12em;
  color: #9bb09c;
  padding: 2px 3px 15px;
}

.ghost-stage {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 52px 1fr;
  gap: 10px;
  align-items: stretch;
  min-height: 430px;
}

.ghost-card {
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px;
  background: #101e12;
  position: relative;
  transition: transform .9s ease, opacity .5s ease;
  overflow: hidden;
}

.du-card {
  border-top: 5px solid var(--cyan);
}

.ich-card {
  border-top: 5px solid var(--purple);
}

.card-tag {
  font-family: "Courier New", monospace;
  font-size: 10px;
  letter-spacing: .14em;
  color: #8f9f90;
}

.ghost-card h2 {
  font-family: "Courier New", monospace;
  font-size: 23px;
  margin: 10px 0 8px;
  line-height: 1.05;
}

.card-sub {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.45;
  margin: 0 0 14px;
}

.word-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
}

.word-cloud span {
  background: #071009;
  border: 1px solid #355039;
  color: #e7f5e9;
  padding: 5px 8px;
  border-radius: 999px;
  font-family: "Courier New", monospace;
  font-size: 11px;
  font-weight: 700;
}

.traits {
  margin: 0 0 16px;
  padding-left: 18px;
  color: #dbe7db;
  line-height: 1.65;
  font-size: 14px;
}

.math-line {
  font-family: "Courier New", monospace;
  font-weight: 900;
  font-size: 18px;
  color: #e6d5ff;
  margin: 12px 0;
}

.math-line b {
  color: var(--gold);
  padding: 0 2px;
}

.math-line em {
  font-style: normal;
  color: var(--gold);
  font-size: 24px;
}

.eich {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 18px;
}

.eich strong {
  color: var(--gold);
}

.stats {
  border-top: 1px dashed #3a4f3c;
  padding-top: 14px;
}

.stat {
  margin-bottom: 10px;
}

.stat-top {
  display: flex;
  justify-content: space-between;
  font-family: "Courier New", monospace;
  font-size: 11px;
  margin-bottom: 5px;
}

.stat-top span {
  color: #aab8aa;
  letter-spacing: .08em;
}

.stat-track {
  height: 8px;
  background: #060c07;
  border-radius: 99px;
  overflow: hidden;
}

.stat-fill {
  height: 100%;
  border-radius: 99px;
}

.home-line {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 14px;
  padding: 9px 11px;
  background: #07100a;
  border: 1px solid #344b35;
  border-radius: 8px;
  font-family: "Courier New", monospace;
}

.home-line strong {
  color: var(--gold);
  font-size: 22px;
}

.merge-symbol {
  align-self: center;
  text-align: center;
  z-index: 2;
}

.merge-symbol span {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  margin: auto;
  border: 2px solid var(--gold);
  color: var(--gold);
  border-radius: 50%;
  font-family: "Courier New", monospace;
  font-size: 28px;
  background: #181204;
}

.merge-symbol small {
  display: block;
  margin-top: 7px;
  font-family: "Courier New", monospace;
  font-size: 9px;
  color: #b8b9a0;
}

.ghost-face {
  width: 104px;
  height: 92px;
  background: #e9fff0;
  border-radius: 48px 48px 10px 10px;
  position: relative;
  margin: 15px auto 10px;
  box-shadow: 0 0 28px rgba(255,255,255,.16);
}

.ghost-ich {
  background: #eadbff;
  box-shadow: 0 0 28px rgba(168,85,247,.4);
}

.ghost-one {
  background: #fff6bf;
  box-shadow: 0 0 45px rgba(242,201,76,.8);
}

.ghost-eye {
  position: absolute;
  width: 15px;
  height: 22px;
  background: #071009;
  border-radius: 50%;
  top: 30px;
}

.ghost-eye:first-of-type {
  left: 25px;
}

.ghost-eye:nth-of-type(2) {
  right: 25px;
}

.ghost-mouth {
  position: absolute;
  left: 50%;
  top: 54px;
  transform: translateX(-50%);
  color: #071009;
  font-size: 20px;
}

.ghost-wave {
  position: absolute;
  bottom: -9px;
  width: 30px;
  height: 16px;
  background: inherit;
  border-radius: 0 0 50% 50%;
}

.w1 {
  left: 3px;
}

.w2 {
  left: 36px;
}

.w3 {
  right: 3px;
}

.ghost-big {
  width: 140px;
  height: 124px;
}

.ghost-big .ghost-eye {
  width: 20px;
  height: 30px;
  top: 42px;
}

.ghost-big .ghost-eye:first-of-type {
  left: 34px;
}

.ghost-big .ghost-eye:nth-of-type(2) {
  right: 34px;
}

.ghost-big .ghost-mouth {
  top: 76px;
  font-size: 28px;
}

.ghost-big .ghost-wave {
  width: 42px;
  height: 22px;
}

.ghost-big .w2 {
  left: 48px;
}

.move-right {
  transform: translateX(56%) scale(.9);
}

.move-left {
  transform: translateX(-56%) scale(.9);
}

.hidden-ghost {
  opacity: 0;
  pointer-events: none;
}

.one-card {
  grid-column: 1 / -1;
  text-align: center;
  padding: 18px 14px 12px;
  border: 2px solid var(--gold);
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(242,201,76,.17), rgba(168,85,247,.2), rgba(53,230,255,.13));
  animation: pop .5s ease;
}

@keyframes pop {
  from {
    transform: scale(.85);
    opacity: 0;
  }

  to {
    transform: scale(1);
    opacity: 1;
  }
}

.one-badge {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  color: #111;
  background: var(--gold);
  padding: 6px 10px;
  border-radius: 99px;
  font-family: "Courier New", monospace;
  font-size: 11px;
  font-weight: 900;
}

.one-card h2 {
  font-family: "Courier New", monospace;
  font-size: 38px;
  margin: 8px 0 3px;
  color: var(--gold);
}

.one-title {
  color: #fff;
  font-family: "Courier New", monospace;
  font-size: 12px;
  letter-spacing: .12em;
}

.one-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  text-align: left;
  margin: 20px 0 12px;
}

.one-grid div {
  background: rgba(5,8,5,.72);
  border: 1px solid #4c4c35;
  border-radius: 10px;
  padding: 11px;
}

.one-grid dt {
  font-family: "Courier New", monospace;
  font-size: 10px;
  color: #b9bfae;
  text-transform: uppercase;
  letter-spacing: .1em;
}

.one-grid dd {
  margin: 5px 0 0;
  font-weight: 700;
  font-size: 14px;
  line-height: 1.3;
}

.one-quote {
  color: #fff2bb;
  font-size: 16px;
  font-style: italic;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 16px;
}

.controls button {
  border: 0;
  cursor: pointer;
  border-radius: 12px;
  min-height: 48px;
  font-weight: 900;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.weld-btn {
  flex: 1 1 280px;
  background: var(--gold);
  color: #111;
  font-size: 16px;
  box-shadow: 0 8px 0 #9b7610, 0 12px 24px rgba(242,201,76,.2);
}

.weld-btn:active {
  transform: translateY(4px);
  box-shadow: 0 4px 0 #9b7610;
}

.weld-btn:disabled {
  opacity: .86;
  cursor: default;
}

.secondary-btn {
  background: #16271b;
  color: var(--cyan);
  border: 1px solid #296b78 !important;
}

.gang-btn {
  background: var(--purple);
  color: white;
}

.gang-alert {
  margin-top: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: #f2c94c;
  color: #111;
  padding: 13px 15px;
  border-radius: 12px;
  animation: pop .3s ease;
}

.alert-emoji {
  font-size: 28px;
}

.gang-alert div {
  display: flex;
  flex-direction: column;
}

.gang-alert div span {
  font-size: 13px;
}

.alert-live {
  margin-left: auto;
  font-family: "Courier New", monospace;
  font-size: 11px;
  font-weight: 900;
}

.sparks {
  text-align: center;
  color: var(--gold);
  letter-spacing: .6em;
  margin-top: 10px;
  animation: flicker .3s infinite alternate;
}

@keyframes flicker {
  from {
    opacity: .5;
  }

  to {
    opacity: 1;
  }
}

.confetti {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 4;
}

.confetti i {
  position: absolute;
  top: -10px;
  width: 8px;
  height: 16px;
  display: block;
  animation: fall 2.2s ease-in forwards;
}

@keyframes fall {
  to {
    transform: translateY(520px) rotate(720deg);
    opacity: 0;
  }
}

.log-section {
  margin-top: 22px;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px;
  background: #0b150d;
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.kicker {
  font-family: "Courier New", monospace;
  color: var(--cyan);
  font-size: 11px;
  letter-spacing: .16em;
  font-weight: 800;
}

.section-head h2 {
  margin: 5px 0 0;
  font-family: "Courier New", monospace;
  font-size: 26px;
}

.eye-icon {
  color: var(--gold);
}

.log-box {
  height: 158px;
  overflow-y: auto;
  margin-top: 16px;
  background: #050a06;
  border: 1px solid #26382a;
  border-radius: 12px;
  padding: 14px;
  font-family: "Courier New", monospace;
  font-size: 13px;
  line-height: 1.7;
}

.log-line {
  margin: 0;
  color: #d7e0d7;
}

.log-line.gold {
  color: var(--gold);
  font-weight: 800;
}

.log-line.cyan {
  color: var(--cyan);
}

.log-line.purple {
  color: #d59cff;
}

.open-channels {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 15px;
}

.open-channels span {
  font-family: "Courier New", monospace;
  font-size: 12px;
  font-weight: 800;
  padding: 8px 10px;
  border-radius: 99px;
  background: #182615;
  border: 1px solid #355039;
  color: #f0f3d8;
}

.channels-note {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 0;
}

.power-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 14px;
}

.power-grid article {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  background: #0d180f;
}

.power-grid svg {
  color: var(--gold);
}

.power-grid h3 {
  font-family: "Courier New", monospace;
  font-size: 14px;
  margin: 10px 0 5px;
}

.power-grid p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
}

footer {
  text-align: center;
  padding: 30px 10px 5px;
}

footer strong {
  display: block;
  color: var(--gold);
  font-family: "Courier New", monospace;
  font-size: 18px;
}

footer span {
  display: block;
  color: var(--muted);
  margin-top: 8px;
  font-size: 14px;
}

@media (max-width: 620px) {
  .page-shell {
    padding-left: 10px;
    padding-right: 10px;
  }

  .hero {
    padding-top: 18px;
  }

  .desktop-break {
    display: none;
  }

  .hero p {
    font-size: 16px;
  }

  .arena {
    padding: 12px;
  }

  .arena-label span:last-child {
    display: none;
  }

  .ghost-stage {
    grid-template-columns: 1fr 34px 1fr;
    min-height: 0;
  }

  .ghost-card {
    padding: 13px 11px;
  }

  .ghost-card h2 {
    font-size: 17px;
  }

  .card-sub {
    display: none;
  }

  .word-cloud span {
    font-size: 10px;
    padding: 4px 6px;
  }

  .traits {
    padding-left: 14px;
    font-size: 12px;
  }

  .math-line {
    font-size: 14px;
  }

  .ghost-face {
    width: 76px;
    height: 68px;
  }

  .ghost-eye {
    width: 11px;
    height: 17px;
    top: 23px;
  }

  .ghost-eye:first-of-type {
    left: 18px;
  }

  .ghost-eye:nth-of-type(2) {
    right: 18px;
  }

  .ghost-mouth {
    top: 40px;
    font-size: 15px;
  }

  .ghost-wave {
    width: 22px;
    height: 11px;
  }

  .w2 {
    left: 26px;
  }

  .merge-symbol span {
    width: 30px;
    height: 30px;
    font-size: 20px;
  }

  .merge-symbol small {
    font-size: 7px;
  }

  .move-right {
    transform: translateX(42%) scale(.9);
  }

  .move-left {
    transform: translateX(-42%) scale(.9);
  }

  .controls button {
    flex: 1 1 100%;
  }

  .secondary-btn, .gang-btn {
    flex: 1 1 45%;
  }

  .one-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .one-card h2 {
    font-size: 31px;
  }

  .power-grid {
    grid-template-columns: 1fr;
  }

  .gang-alert {
    align-items: flex-start;
  }

  .alert-live {
    display: none;
  }

  .section-head h2 {
    font-size: 22px;
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050805;
    --surface: #0c140e;
    --ink: #fffdf2;
  }
}
