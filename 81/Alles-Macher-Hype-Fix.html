}

.font-bold {
  font-weight: 700;
}

.leading-\[0\.95\] {
  line-height: 0.95;
}

.leading-\[1\.7\] {
  line-height: 1.7;
}

.leading-none {
  line-height: 1;
}

.leading-relaxed {
  line-height: 1.625;
}

.leading-snug {
  line-height: 1.375;
}

.tracking-\[0\.15em\] {
  letter-spacing: 0.15em;
}

.tracking-\[0\.16em\] {
  letter-spacing: 0.16em;
}

.tracking-\[0\.22em\] {
  letter-spacing: 0.22em;
}

.tracking-\[0\.28em\] {
  letter-spacing: 0.28em;
}

.tracking-\[0\.2em\] {
  letter-spacing: 0.2em;
}

.tracking-tight {
  letter-spacing: -0.025em;
}

.tracking-widest {
  letter-spacing: 0.1em;
}

.text-\[\#a9b0c2\] {
  --tw-text-opacity: 1;
  color: rgb(169 176 194 / var(--tw-text-opacity, 1));
}

.text-\[var\(--cyan\)\] {
  color: var(--cyan);
}

.text-\[var\(--gold\)\] {
  color: var(--gold);
}

.text-\[var\(--muted\)\] {
  color: var(--muted);
}

.text-\[var\(--orange\)\] {
  color: var(--orange);
}

.text-black {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.text-cyan-300 {
  --tw-text-opacity: 1;
  color: rgb(103 232 249 / var(--tw-text-opacity, 1));
}

.text-emerald-200 {
  --tw-text-opacity: 1;
  color: rgb(167 243 208 / var(--tw-text-opacity, 1));
}

.text-emerald-300 {
  --tw-text-opacity: 1;
  color: rgb(110 231 183 / var(--tw-text-opacity, 1));
}

.text-orange-300 {
  --tw-text-opacity: 1;
  color: rgb(253 186 116 / var(--tw-text-opacity, 1));
}

.text-pink-400 {
  --tw-text-opacity: 1;
  color: rgb(244 114 182 / var(--tw-text-opacity, 1));
}

.text-red-400 {
  --tw-text-opacity: 1;
  color: rgb(248 113 113 / var(--tw-text-opacity, 1));
}

.text-white {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.accent-\[\#f5c542\] {
  accent-color: #f5c542;
}

.opacity-50 {
  opacity: 0.5;
}

.outline-none {
  outline: 2px solid transparent;
  outline-offset: 2px;
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.transition {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --bg:#06070b;
  --surface:#0d1017;
  --surface2:#141826;
  --line:#262c3d;
  --text:#f7f0da;
  --muted:#a9b0c2;
  --gold:#f5c542;
  --orange:#ff6b1a;
  --cyan:#2fe3d8;
  --pink:#ff3d8a;
  --green:#4ade80;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#06070b;
    --surface:#0d1017;
    --surface2:#141826;
    --text:#f7f0da;
    --muted:#a9b0c2;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:ui-sans-system,system-ui,-apple-system,Segoe UI,sans-serif
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) scale(1)
  }

  50%{
    transform:translateY(-8px) scale(1.04)
  }
}

@keyframes hypeJump{
  0%{
    transform:translateY(0) scale(1)
  }

  30%{
    transform:translateY(-22px) scale(1.12) rotate(-3deg)
  }

  60%{
    transform:translateY(2px) scale(.96)
  }

  100%{
    transform:translateY(0) scale(1)
  }
}

@keyframes pulseRing{
  0%{
    opacity:.9;
    transform:scale(.96)
  }

  100%{
    opacity:.15;
    transform:scale(1.12)
  }
}

@keyframes fall{
  0%{
    transform:translateY(-10px) rotate(0);
    opacity:1
  }

  100%{
    transform:translateY(420px) rotate(540deg);
    opacity:.1
  }
}

@keyframes ticker{
  from{
    transform:translateX(0)
  }

  to{
    transform:translateX(-50%)
  }
}

@keyframes glowPulse{
  0%,100%{
    box-shadow:0 0 0 rgba(245,197,66,.25)
  }

  50%{
    box-shadow:0 0 34px rgba(245,197,66,.55)
  }
}

.burro{
  animation:floaty 2.6s ease-in-out infinite
}

.burro.jump{
  animation:hypeJump .62s ease
}

.bar{
  transition:width .55s ease, background .3s
}

.logscroll::-webkit-scrollbar{
  width:8px
}

.logscroll::-webkit-scrollbar-thumb{
  background:#2c344a;
  border-radius:99px
}

.hover\:-translate-y-0\.5:hover {
  --tw-translate-y: -0.125rem;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.focus\:border-\[var\(--cyan\)\]:focus {
  border-color: var(--cyan);
}

.active\:cursor-grabbing:active {
  cursor: grabbing;
}

.disabled\:opacity-50:disabled {
  opacity: 0.5;
}

@media (min-width: 640px) {
  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:text-\[48px\] {
    font-size: 48px;
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-\[minmax\(300px\2c 460px\)_1fr\] {
    grid-template-columns: minmax(300px,460px) 1fr;
  }
}
