:root{
  --bg:#000;
  --surface:#060806;
  --surface-2:#0a0f0b;
  --line:#1f3a26;
  --text:#e8ffe9;
  --muted:#86a48a;
  --green:#00ff66;
  --cyan:#00aaff;
  --red:#ff0033;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#000;
    --surface:#060806;
    --surface-2:#0a0f0b;
    --text:#e8ffe9;
  }
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  min-width:0;
  background:var(--bg);
  color:var(--text)
}

body{
  font-family:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  line-height:1.5
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

.app-shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  background:radial-gradient(circle at 88% 8%, rgba(0,170,255,.10), transparent 28%), var(--bg);
  overflow-x:clip
}

.topbar{
  max-width:1440px;
  margin:0 auto;
  padding:24px 28px 18px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:24px;
  border-bottom:2px solid var(--green)
}

.brand{
  display:flex;
  gap:16px;
  align-items:center;
  min-width:0
}

.brand-mark{
  width:58px;
  height:58px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border:2px solid var(--green);
  color:var(--green);
  font-size:25px;
  font-weight:900;
  box-shadow:0 0 24px rgba(0,255,102,.22)
}

.eyebrow{
  margin:0 0 4px;
  color:var(--cyan);
  font-size:11px;
  letter-spacing:.18em;
  font-weight:800
}

h1{
  margin:0;
  font-size:clamp(25px,4vw,50px);
  line-height:.96;
  letter-spacing:-.055em;
  text-transform:uppercase
}

h1 span{
  color:var(--green);
  display:block;
  font-size:.62em;
  letter-spacing:-.03em
}

.header-status{
  color:var(--green);
  font-size:12px;
  white-space:nowrap;
  display:flex;
  align-items:center;
  gap:8px
}

.dot{
  width:9px;
  height:9px;
  background:var(--green);
  border-radius:50%;
  box-shadow:0 0 12px var(--green)
}

main{
  max-width:1440px;
  margin:0 auto;
  padding:28px
}

.intro{
  display:grid;
  grid-template-columns:1.35fr .65fr;
  gap:32px;
  align-items:end;
  padding:10px 0 34px;
  border-bottom:1px solid var(--line)
}

.big-line{
  margin:0;
  font-size:clamp(28px,4vw,54px);
  line-height:1.02;
  letter-spacing:-.045em;
  font-weight:800
}

.big-line em{
  color:var(--cyan);
  font-style:normal
}

.intro-note{
  margin:0;
  color:var(--muted);
  font-size:14px
}

.intro-note b{
  color:var(--green)
}

.layout{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:16px;
  margin-top:18px
}

.panel{
  border:1px solid var(--line);
  background:var(--surface);
  padding:20px;
  min-width:0;
  position:relative
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.14em;
  font-weight:800;
  border-bottom:1px solid var(--line);
  padding-bottom:11px
}

.panel-head>span:first-child{
  display:flex;
  align-items:center;
  gap:7px
}

.panel-tag{
  color:var(--cyan)
}

.panel h2{
  font-size:20px;
  line-height:1.1;
  margin:16px 0 8px;
  letter-spacing:-.02em
}

.control-panel{
  grid-column:span 3
}

.elevator-panel{
  grid-column:span 3;
  grid-row:span 2
}

.result-panel{
  grid-column:span 3
}

.counter-panel{
  grid-column:span 3
}

.log-panel{
  grid-column:span 3
}

.code-panel{
  grid-column:span 3;
  grid-row:span 2
}

.table-panel{
  grid-column:span 3
}

label{
  display:block;
  margin:18px 0 7px;
  color:var(--muted);
  font-size:12px
}

input{
  width:100%;
  background:#000;
  color:var(--green);
  border:1px solid #2b6a3e;
  padding:14px 13px;
  outline:none;
  font-size:15px
}

input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 2px rgba(0,255,102,.16)
}

.preset-label{
  margin:18px 0 8px;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.14em
}

.presets{
  display:flex;
  flex-wrap:wrap;
  gap:7px
}

.preset{
  border:1px solid #294a33;
  background:#071009;
  color:#c8decb;
  padding:8px 10px;
  font-size:12px;
  overflow-wrap:anywhere
}

.preset:hover,.preset.active{
  border-color:var(--green);
  color:var(--green)
}

.actions{
  display:flex;
  gap:9px;
  margin-top:18px
}

.primary{
  flex:1;
  background:var(--green);
  color:#00180a;
  border:0;
  padding:13px 12px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px
}

.ghost{
  border:1px solid var(--line);
  background:transparent;
  color:var(--text);
  padding:12px 14px;
  display:flex;
  align-items:center;
  gap:7px
}

.formula{
  margin-top:18px;
  border-top:1px dashed var(--line);
  padding-top:14px;
  color:var(--muted);
  font-size:12px
}

.formula b{
  color:var(--text)
}

.formula code{
  display:block;
  color:var(--cyan);
  margin-top:6px;
  overflow-wrap:anywhere;
  line-height:1.5
}

.hint{
  color:var(--muted);
  font-size:13px;
  margin:0 0 16px
}

.hint code{
  color:var(--cyan)
}

.shaft{
  position:relative;
  padding-left:22px
}

.shaft-line{
  position:absolute;
  left:6px;
  top:8px;
  bottom:8px;
  width:2px;
  background:#23452c
}

.floor{
  position:relative;
  display:grid;
  grid-template-columns:42px 1fr auto;
  gap:10px;
  align-items:start;
  padding:13px 0;
  border-bottom:1px dashed #203724
}

.floor:last-child{
  border-bottom:0
}

.floor-no{
  color:var(--muted);
  font-size:11px;
  font-weight:900;
  padding-top:2px
}

.cur{
  color:var(--text);
  font-size:13px;
  overflow-wrap:anywhere;
  line-height:1.35
}

.l-line{
  display:flex;
  gap:5px;
  align-items:center;
  color:var(--muted);
  font-size:11px;
  margin-top:5px
}

.l-line span{
  color:var(--cyan);
  overflow-wrap:anywhere
}

.pass{
  color:var(--muted);
  font-size:10px;
  padding-top:3px
}

.floor.halt{
  background:rgba(255,0,51,.09);
  margin:0 -12px;
  padding-left:12px;
  padding-right:12px;
  border:1px solid var(--red)
}

.floor.halt .floor-no{
  color:var(--red)
}

.floor.halt .cur{
  color:#fff;
  font-weight:800
}

.halt-badge{
  background:var(--red);
  color:#fff;
  font-size:10px;
  font-weight:900;
  padding:4px 6px;
  white-space:nowrap
}

.result-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  margin-top:14px
}

.result-grid>div{
  background:#040705;
  padding:14px
}

dt{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.12em
}

dd{
  margin:4px 0 0;
  font-size:16px;
  overflow-wrap:anywhere;
  color:var(--cyan)
}

dd.red{
  color:var(--red);
  font-weight:900
}

dd.green{
  color:var(--green)
}

.json{
  margin-top:14px;
  border:1px solid var(--green);
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:6px
}

.json span{
  font-size:10px;
  color:var(--green);
  letter-spacing:.15em
}

.json code{
  color:var(--text);
  overflow-wrap:anywhere;
  line-height:1.5
}

.counter-panel h2 span{
  color:var(--green)
}

.counter-panel>p{
  color:var(--muted);
  font-size:13px
}

.bars{
  margin-top:20px
}

.bar-row{
  display:grid;
  grid-template-columns:42px 1fr 72px;
  gap:10px;
  align-items:center;
  margin-bottom:12px
}

.bar-row>span{
  color:var(--muted);
  font-size:12px
}

.bar-track{
  height:12px;
  background:#101a12;
  border:1px solid #203724
}

.bar-fill{
  height:100%;
  background:var(--cyan)
}

.bar-row.final{
  border:1px solid var(--green);
  padding:8px;
  margin:16px -8px 0;
  background:rgba(0,255,102,.08)
}

.bar-row.final>span{
  color:var(--green);
  font-weight:900
}

.final-fill{
  background:var(--green)
}

.bar-row strong{
  font-size:11px;
  color:var(--green)
}

.counter-foot{
  margin-top:18px;
  border-top:1px solid var(--line);
  padding-top:12px;
  font-size:12px;
  display:flex;
  gap:6px;
  align-items:center;
  color:var(--green)
}

.counter-foot span{
  color:var(--muted)
}

.log{
  height:266px;
  overflow:auto;
  background:#020402;
  border:1px solid var(--line);
  padding:12px;
  font-size:11px;
  line-height:1.7
}

.log p{
  margin:0 0 5px;
  color:#a9c6ac;
  overflow-wrap:anywhere
}

.log .log-halt{
  color:var(--green)
}

.code-panel pre{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  background:#020402;
  border:1px solid var(--line);
  padding:16px;
  color:#c9f5d3;
  font-size:11px;
  line-height:1.6;
  max-height:560px;
  overflow:auto
}

blockquote{
  margin:16px 0 0;
  padding-left:14px;
  border-left:3px solid var(--red);
  color:#fff;
  font-size:14px;
  line-height:1.5
}

.table-wrap{
  overflow-x:auto
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:14px;
  font-size:13px
}

th,td{
  border-bottom:1px solid var(--line);
  padding:11px 8px;
  text-align:left
}

thead th{
  color:var(--muted);
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase
}

tbody th{
  color:var(--green)
}

td.yes{
  color:var(--green);
  font-weight:800
}

td.no{
  color:var(--red);
  font-weight:800
}

.table-note{
  color:var(--muted);
  font-size:12px;
  line-height:1.6
}

footer{
  max-width:1440px;
  margin:0 auto;
  padding:18px 28px 30px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.12em
}

@media(max-width:820px){
  .topbar{
    padding:20px 16px 14px;
    align-items:flex-start
  }

  .header-status{
    display:none
  }

  main{
    padding:20px 14px
  }

  .intro{
    grid-template-columns:1fr;
    gap:12px
  }

  .layout{
    grid-template-columns:1fr
  }

  .panel{
    grid-column:span 1!important;
    grid-row:auto!important;
    padding:16px
  }

  .brand-mark{
    width:46px;
    height:46px;
    font-size:20px
  }

  .actions{
    flex-direction:column
  }

  .floor{
    grid-template-columns:34px 1fr
  }

  .pass,.halt-badge{
    grid-column:2
  }

  .log{
    height:220px
  }

  footer{
    padding:16px
  }
}

@media(max-width:390px){
  h1{
    font-size:26px
  }

  .brand{
    gap:10px
  }

  .bar-row{
    grid-template-columns:32px 1fr 58px
  }

  .result-grid{
    grid-template-columns:1fr 1fr
  }

  table{
    font-size:11px
  }
}
