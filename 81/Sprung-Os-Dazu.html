:root{
  --bg:#050805;
  --panel:#0a0f0a;
  --panel2:#0d140d;
  --line:#23301f;
  --gold:#f2c94c;
  --green:#7ee787;
  --muted:#9db39a;
  --text:#f3f0dd;
  --red:#ff6b6b;
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace
}

button{
  font-family:inherit
}

.mono{
  font-family:'JetBrains Mono',monospace
}

.display{
  font-family:'Archivo Black','JetBrains Mono',sans-serif;
  letter-spacing:-.02em
}

.grid-bg{
  background-image:linear-gradient(rgba(242,201,76,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(242,201,76,.05) 1px,transparent 1px);
  background-size:28px 28px
}

.tile{
  transition:transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease
}

.tile:hover{
  transform:translateY(-2px)
}

@keyframes pulseGold{
  0%,100%{
    box-shadow:0 0 0 0 rgba(242,201,76,.45)
  }

  50%{
    box-shadow:0 0 0 10px rgba(242,201,76,0)
  }
}

@keyframes land{
  0%{
    transform:scale(1.5);
    box-shadow:0 0 0 0 rgba(126,231,135,.7)
  }

  100%{
    transform:scale(1);
    box-shadow:0 0 0 14px rgba(126,231,135,0)
  }
}

@keyframes fillGap{
  0%{
    opacity:.25;
    transform:scale(.92)
  }

  50%{
    opacity:1;
    transform:scale(1.04)
  }

  100%{
    opacity:1;
    transform:scale(1)
  }
}

@keyframes ticker{
  from{
    transform:translateX(0)
  }

  to{
    transform:translateX(-50%)
  }
}

@keyframes blink{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.25
  }
}

.jump-dot{
  will-change:left,top;
  filter:drop-shadow(0 0 12px rgba(242,201,76,.9))
}

.land-flash{
  animation:land .6s ease-out
}

.fill-anim{
  animation:fillGap .7s ease both
}

.marquee{
  animation:ticker 22s linear infinite
}

.blink{
  animation:blink 1.1s infinite
}

::-webkit-scrollbar{
  width:8px;
  height:8px
}

::-webkit-scrollbar-thumb{
  background:#2a3a28;
  border-radius:99px
}

::-webkit-scrollbar-track{
  background:#0a0f0a
}

.hover\:opacity-90:hover {
  opacity: 0.9;
}

@media (min-width: 640px) {
  .sm\:bottom-3 {
    bottom: 0.75rem;
  }

  .sm\:right-3 {
    right: 0.75rem;
  }

  .sm\:mt-2 {
    margin-top: 0.5rem;
  }

  .sm\:mt-4 {
    margin-top: 1rem;
  }

  .sm\:block {
    display: block;
  }

  .sm\:inline-block {
    display: inline-block;
  }

  .sm\:gap-3 {
    gap: 0.75rem;
  }

  .sm\:rounded-2xl {
    border-radius: 1rem;
  }

  .sm\:p-4 {
    padding: 1rem;
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:pt-6 {
    padding-top: 1.5rem;
  }

  .sm\:text-\[11px\] {
    font-size: 11px;
  }

  .sm\:text-\[13\.5px\] {
    font-size: 13.5px;
  }

  .sm\:text-\[13px\] {
    font-size: 13px;
  }

  .sm\:text-\[15px\] {
    font-size: 15px;
  }

  .sm\:text-\[22px\] {
    font-size: 22px;
  }

  .sm\:text-\[38px\] {
    font-size: 38px;
  }

  .sm\:text-\[62px\] {
    font-size: 62px;
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-\[1\.35fr_1fr\] {
    grid-template-columns: 1.35fr 1fr;
  }

  .lg\:grid-cols-\[1\.55fr_1fr\] {
    grid-template-columns: 1.55fr 1fr;
  }

  .lg\:text-\[76px\] {
    font-size: 76px;
  }
}
