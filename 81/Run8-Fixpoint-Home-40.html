*{
  box-sizing:border-box
}

html,body{
  margin:0;

}

  line-height:1.35
}

@keyframes pulseHome{
  0%,100%{
    transform:scale(1);
    box-shadow:0 0 0 0 rgba(255,64,64,.55)
  }

  50%{
    transform:scale(1.04);
    box-shadow:0 0 0 7px rgba(255,64,64,0)
  }
}

@keyframes blink{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.25
  }
}

.home-pulse{
  animation:pulseHome 1.6s ease-in-out infinite
}

.blink{
  animation:blink 1.1s steps(2) infinite
}

.grid-cell{
  transition:transform .12s ease, filter .12s ease
}

.grid-cell:hover{
  transform:scale(1.08);
  filter:brightness(1.25);
  z-index:2
}

.node-btn{
  transition:transform .15s ease, filter .15s ease
}

.node-btn:hover{
  transform:translate(-50%,-50%) scale(1.12);
  filter:brightness(1.3)
}

input,textarea{
  outline:none
}

textarea:focus{
  border-color:var(--violet)!important;
  box-shadow:0 0 0 3px rgba(128,0,255,.22)
}

.hover\:text-white:hover {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

@media (min-width: 640px) {
  .sm\:block {
    display: block;
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:py-5 {
    padding-top: 1.25rem;
    padding-bottom: 1.25rem;
  }

  .sm\:text-\[11px\] {
    font-size: 11px;
  }

  .sm\:text-\[18px\] {
    font-size: 18px;
  }

  .sm\:text-\[34px\] {
    font-size: 34px;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-5 {
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[minmax\(0\2c 1\.35fr\)_minmax\(0\2c 1fr\)\] {
    grid-template-columns: minmax(0,1.35fr) minmax(0,1fr);
  }
}
