:root{
  --w-bg:#fff;
  --w-fg:#0a0a0a;
  --w-muted:#6b6b6b;
  --w-border:#e8e8e8;
  --w-surface:#f6f6f3;
  --w-surface-2:#efefea
}

@media (prefers-color-scheme: dark){
  :root{
    --w-bg:#0f0f0e;
    --w-fg:#f2f2ee;
    --w-muted:#9a9a95;
    --w-border:#232322;
    --w-surface:#171715;
    --w-surface-2:#1e1e1c
  }
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--w-bg);
  color:var(--w-fg);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.wahrheit-shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top)
}

.w-topbar{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  background:color-mix(in srgb,var(--w-bg) 82%,transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--w-border)
}

.w-topbar,.w-main{
  max-width:1280px;
  margin:0 auto;
  padding-left:20px;
  padding-right:20px
}

.w-topbar{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.w-brand{
  display:flex;
  align-items:center;
  gap:12px
}

.w-mark{
  width:28px;
  height:28px;
  border:1px solid var(--w-fg);
  display:grid;
  place-items:center;
  font-family:ui-monospace,monospace;
  font-weight:700;
  font-size:11px
}

.w-kicker{
  font-family:ui-monospace,monospace;
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--w-muted)
}

.w-live{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:ui-monospace,monospace;
  font-size:10px;
  color:var(--w-muted)
}

.w-dot{
  width:6px;
  height:6px;
  border-radius:999px;
  background:#10b981
}

.w-hero{
  max-width:720px;
  padding:40px 0 32px
}

.w-hero h1{
  font-size:clamp(32px,5vw,44px);
  line-height:.95;
  letter-spacing:-.03em;
  margin:0;
  font-weight:650
}

.w-hero>p{
  color:var(--w-muted);
  font-size:17px;
  line-height:1.45;
  max-width:520px
}

.w-sharp{
  font-family:ui-monospace,monospace!important;
  font-size:12px!important;
  color:var(--w-fg)!important
}

.w-grid{
  display:grid;
  grid-template-columns:1.05fr 1.2fr;
  border:1px solid var(--w-border);
  background:var(--w-bg)
}

.w-col{
  display:flex;
  flex-direction:column;
  min-width:0
}

.w-col:first-child{
  border-right:1px solid var(--w-border)
}

.w-panel-head{
  padding:20px 28px;
  border-bottom:1px solid var(--w-border);
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px
}

.w-panel-head h2{
  font-family:ui-monospace,monospace;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  margin:0
}

.w-panel-head p{
  font-family:ui-monospace,monospace;
  font-size:11px;
  color:var(--w-muted);
  margin:4px 0 0
}

.w-tag{
  font-family:ui-monospace,monospace;
  font-size:10px;
  color:var(--w-muted);
  border:1px solid var(--w-border);
  padding:4px 8px
}

.w-status{
  width:8px;
  height:8px;
  border-radius:999px;
  background:var(--w-border);
  flex:none
}

.w-status.on{
  background:var(--w-fg)
}

.w-body{
  padding:20px 28px;
  display:flex;
  flex-direction:column;
  gap:20px;
  flex:1
}

.w-text-wrap{
  position:relative
}

.w-text-wrap textarea{
  width:100%;
  min-height:340px;
  background:var(--w-surface);
  border:1px solid var(--w-border);
  padding:16px;
  font-family:ui-monospace,monospace;
  font-size:13px;
  line-height:1.6;
  outline:none;
  resize:vertical;
  color:var(--w-fg)
}

.w-text-wrap textarea:focus{
  border-color:var(--w-fg)
}

.w-text-badges{
  position:absolute;
  right:12px;
  bottom:12px;
  display:flex;
  gap:6px
}

.w-text-badges span{
  font-family:ui-monospace,monospace;
  font-size:9px;
  padding:2px 6px;
  background:var(--w-bg);
  border:1px solid var(--w-border);
  color:var(--w-muted)
}

.w-chips{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}

.w-chip{
  border:1px solid var(--w-border);
  background:var(--w-surface);
  padding:10px
}

.w-chip-top{
  display:flex;
  justify-content:space-between;
  font-family:ui-monospace,monospace;
  font-size:10px
}

.w-chip-name{
  font-family:ui-monospace,monospace;
  font-size:10px;
  line-height:1.25;
  margin-top:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.w-chip-label{
  font-family:ui-monospace,monospace;
  font-size:9px;
  color:var(--w-muted);
  margin-top:2px
}

.w-empty-inline{
  font-family:ui-monospace,monospace;
  font-size:11px;
  color:var(--w-muted);
  grid-column:1/-1
}

.w-actions{
  margin-top:auto;
  display:flex;
  flex-wrap:wrap;
  gap:8px
}

.w-primary{
  flex:1;
  min-width:220px;
  height:48px;
  background:var(--w-fg);
  color:var(--w-bg);
  border:0;
  font-family:ui-monospace,monospace;
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px
}

.w-secondary{
  height:48px;
  padding:0 14px;
  background:transparent;
  color:var(--w-fg);
  border:1px solid var(--w-border);
  font-family:ui-monospace,monospace;
  font-size:11px
}

.w-meta{
  font-family:ui-monospace,monospace;
  font-size:10px;
  color:var(--w-muted);
  line-height:1.6
}

.w-empty{
  aspect-ratio:1/1;
  background:var(--w-surface);
  border:1px dashed var(--w-border);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:32px
}

.w-empty-circle{
  width:48px;
  height:48px;
  border:1px solid var(--w-border);
  border-radius:999px;
  display:grid;
  place-items:center;
  color:var(--w-muted);
  font-size:18px;
  margin-bottom:16px
}

.w-empty p{
  font-family:ui-monospace,monospace;
  font-size:11px;
  color:var(--w-muted);
  max-width:260px
}

.w-empty p strong{
  color:var(--w-fg);
  font-size:12px;
  text-transform:uppercase
}

.w-canvas{
  position:relative;
  aspect-ratio:1/1;
  background:var(--w-surface);
  border:1px solid var(--w-border);
  overflow:hidden
}

.w-canvas svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%
}

.w-corner{
  position:absolute;
  width:8px;
  height:8px;
  border-color:var(--w-fg);
  opacity:.3
}

.w-corner.tl{
  left:8px;
  top:8px;
  border-left:1px solid;
  border-top:1px solid
}

.w-corner.tr{
  right:8px;
  top:8px;
  border-right:1px solid;
  border-top:1px solid
}

.w-corner.bl{
  left:8px;
  bottom:8px;
  border-left:1px solid;
  border-bottom:1px solid
}

.w-corner.br{
  right:8px;
  bottom:8px;
  border-right:1px solid;
  border-bottom:1px solid
}

.w-canvas-label{
  position:absolute;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--w-bg);
  border:1px solid var(--w-border);
  padding:4px 8px;
  font-family:ui-monospace,monospace;
  font-size:9px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--w-muted);
  white-space:nowrap
}

.w-pulse{
  width:6px;
  height:6px;
  border-radius:999px;
  background:var(--w-fg);
  animation:pulse 2s infinite
}

@keyframes pulse{
  50%{
    opacity:.5
  }
}

.w-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.w-stats>div{
  border:1px solid var(--w-border);
  padding:12px
}

.w-stats span{
  display:block;
  font-family:ui-monospace,monospace;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--w-muted)
}

.w-stats strong{
  display:block;
  margin-top:4px;
  font-family:ui-monospace,monospace;
  font-size:12px;
  line-height:1.25
}

.w-json-box{
  border:1px solid var(--w-border)
}

.w-json-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 12px;
  border-bottom:1px solid var(--w-border);
  background:var(--w-surface);
  font-family:ui-monospace,monospace;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase
}

.w-json-head button{
  font-family:ui-monospace,monospace;
  font-size:10px;
  border:1px solid var(--w-border);
  padding:4px 8px;
  background:var(--w-bg);
  color:var(--w-fg);
  min-width:72px
}

.w-json-box textarea{
  width:100%;
  height:220px;
  border:0;
  background:var(--w-surface);
  padding:16px;
  font-family:ui-monospace,monospace;
  font-size:11px;
  line-height:1.6;
  outline:none;
  resize:vertical;
  color:var(--w-fg)
}

.w-two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.w-vector{
  background:var(--w-surface);
  border:1px solid var(--w-border);
  padding:12px
}

.w-small-label{
  display:block;
  font-family:ui-monospace,monospace;
  font-size:9px;
  text-transform:uppercase;
  color:var(--w-muted);
  margin-bottom:8px
}

.w-vector-row{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-family:ui-monospace,monospace;
  font-size:11px;
  padding:3px 0
}

.w-vector-row span:first-child{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.w-vector-row span:last-child{
  color:var(--w-muted)
}

.w-water{
  background:var(--w-fg);
  color:var(--w-bg);
  padding:12px
}

.w-water .w-small-label{
  color:rgba(255,255,255,.6)
}

.w-water p{
  font-size:13px;
  line-height:1.4;
  margin:0
}

.w-water>span{
  display:block;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid rgba(255,255,255,.15);
  font-size:10px;
  opacity:.6
}

.w-col-foot{
  margin-top:auto;
  border-top:1px solid var(--w-border);
  padding:16px;
  display:flex;
  justify-content:space-between;
  font-family:ui-monospace,monospace;
  font-size:9px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--w-muted)
}

.w-notes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin:24px 0 80px;
  font-family:ui-monospace,monospace;
  font-size:10px;
  line-height:1.5;
  color:var(--w-muted)
}

@media(max-width:1024px){
  .w-grid{
    grid-template-columns:1fr
  }

  .w-col:first-child{
    border-right:0;
    border-bottom:1px solid var(--w-border)
  }
}

@media(max-width:640px){
  .w-topbar,.w-main{
    padding-left:20px;
    padding-right:20px
  }

  .w-live{
    display:none
  }

  .w-kicker{
    font-size:9px
  }

  .w-panel-head,.w-body{
    padding:16px
  }

  .w-chips{
    grid-template-columns:1fr 1fr
  }

  .w-stats,.w-two{
    grid-template-columns:1fr
  }

  .w-notes{
    grid-template-columns:1fr
  }

  .w-text-wrap textarea{
    min-height:300px
  }

  .w-primary{
    min-width:0;
    width:100%
  }

  .w-actions .w-secondary{
    flex:1
  }

  .w-json-head{
    flex-direction:column;
    align-items:flex-start;
    gap:8px
  }

  .w-canvas-label{
    font-size:8px
  }
}
