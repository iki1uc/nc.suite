:root{
  --bg:#050509;
  --surface:#0b0b17;
  --surface-2:#12121f;
  --line:#26263a;
  --gold:#F2C94C;
  --cyan:#4DA3FF;
  --green:#3dff8e;
  --ink:#f7f8ff;
  --muted:#a9aec9;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#050509;
    --surface:#0b0b17;
  }
}

*{
  box-sizing:border-box;
}

html{
  background:var(--bg);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Space Grotesk", system-ui, sans-serif;
}

button{
  font:inherit;
}

.mono{
  font-family:"JetBrains Mono", ui-monospace, monospace;
}

.gold{
  color:var(--gold);
}

.cyan{
  color:var(--cyan);
}

.panel{
  background:linear-gradient(160deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
  border:1px solid var(--line);
}

@keyframes glowPulse{
  0%,100%{
    box-shadow:0 0 0 rgba(61,255,142,0), 0 0 24px rgba(61,255,142,.18);
  }

  50%{
    box-shadow:0 0 0 2px rgba(61,255,142,.55), 0 0 46px rgba(61,255,142,.45);
  }
}

@keyframes wordPop{
  0%{
    transform:scale(.78) translateY(8px);
    opacity:.25;
    filter:blur(2px);
  }

  35%{
    transform:scale(1.12);
    opacity:1;
    filter:none;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }
}

@keyframes confettiFall{
  0%{
    transform:translateY(-20px) rotate(0deg);
    opacity:1;
  }

  100%{
    transform:translateY(340px) rotate(720deg);
    opacity:0;
  }
}

@keyframes fogDrift{
  0%{
    transform:translateX(-20%) scale(1);
    opacity:.25;
  }

  50%{
    transform:translateX(18%) scale(1.15);
    opacity:.65;
  }

  100%{
    transform:translateX(-12%) scale(1);
    opacity:0;
  }
}

@keyframes flashPop{
  0%{
    opacity:0;
  }

  18%{
    opacity:.92;
  }

  100%{
    opacity:0;
  }
}

@keyframes breathe{
  0%,100%{
    opacity:.55;
  }

  50%{
    opacity:1;
  }
}

@keyframes riseIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.rise{
  animation:riseIn .45s ease both;
}

.word-pop{
  animation:wordPop .5s ease both;
}

.breathe{
  animation:breathe 2.2s ease-in-out infinite;
}

.confetti{
  position:absolute;
  top:0;
  width:9px;
  height:15px;
  border-radius:2px;
  animation:confettiFall 2.4s cubic-bezier(.2,.7,.3,1) forwards;
  pointer-events:none;
}

.fog{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.fog i{
  position:absolute;
  width:190px;
  height:62px;
  border-radius:999px;
  background:radial-gradient(ellipse, rgba(77,163,255,.55), transparent 70%);
  filter:blur(8px);
  animation:fogDrift 1.8s ease forwards;
  display:block;
}

.flash{
  position:absolute;
  inset:0;
  background:radial-gradient(circle, rgba(255,255,255,.96), rgba(242,201,76,.35) 42%, transparent 72%);
  animation:flashPop 1s ease forwards;
  pointer-events:none;
}

.px-on{
  border-color:var(--cyan)!important;
  box-shadow:0 0 0 1px var(--cyan), 0 0 38px rgba(77,163,255,.38), inset 0 0 34px rgba(77,163,255,.12);
}

.ben-on{
  border-color:var(--gold)!important;
  box-shadow:0 0 0 1px var(--gold), 0 0 38px rgba(242,201,76,.35), inset 0 0 34px rgba(242,201,76,.12);
}

.ready{
  animation:glowPulse 1.5s ease-in-out infinite;
  border-color:var(--green)!important;
}

.corner-btn{
  cursor:pointer;
  transition:.2s;
}

.corner-btn:hover{
  transform:scale(1.08);
}

.corner-btn:focus-visible{
  outline:3px solid var(--gold);
  outline-offset:3px;
}

.card-btn:focus-visible, .main-btn:focus-visible{
  outline:3px solid var(--gold);
  outline-offset:3px;
}
