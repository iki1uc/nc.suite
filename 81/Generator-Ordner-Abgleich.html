:root{
  --bg:#050509;
  --surface:#0b0b17;
  --surface2:#121222;
  --line:#2a2a42;
  --ink:#eceaf2;
  --muted:#a9aec9;
  --gold:#F2C94C;
  --cyan:#4DA3FF;
  --violet:#ce93d8;
  --green:#3dff8e;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#050509;
    --surface:#0b0b17;
    --surface2:#121222;
    --line:#2a2a42;
    --ink:#eceaf2;
    --muted:#a9aec9;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace
}

button{
  font-family:inherit
}

input[type=range]{
  accent-color:var(--gold)
}

@keyframes spinSlow{
  from{
    transform:rotate(0deg)
  }

  to{
    transform:rotate(360deg)
  }
}

@keyframes pulseGold{
  0%,100%{
    box-shadow:0 0 0 0 rgba(242,201,76,.45),0 0 32px rgba(242,201,76,.18)
  }

  50%{
    box-shadow:0 0 0 10px rgba(242,201,76,0),0 0 52px rgba(242,201,76,.42)
  }
}

@keyframes magicSpin{
  from{
    transform:rotate(0deg)
  }

  to{
    transform:rotate(720deg)
  }
}

@keyframes sweep{
  from{
    transform:translateX(-55%)
  }

  to{
    transform:translateX(55%)
  }
}

.ring-anim{
  animation:spinSlow 14s linear infinite
}

.ring-magic{
  animation:magicSpin .9s cubic-bezier(.2,.8,.2,1)
}

.home-pulse{
  animation:pulseGold 2.2s ease-in-out infinite
}
