  --magenta:#ff00a0;
  --border:#1a2642;
  --text:#e6e9f0;
  --muted:#7a869e;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);

  :root{
    --bg:#02060a;
    --surface:#080e1a;
    --surface-2:#0e182c;
    --text:#e6e9f0;
    --muted:#7a869e;
    --border:#1a2642;
  }
}

*{
  box-sizing:border-box;
}

html,body{
  background:var(--bg);
  color:var(--text);
  margin:0;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

button, input, textarea{
  font-family:inherit;
}

::-webkit-scrollbar{
  width:6px;
  height:6px;
}

::-webkit-scrollbar-thumb{
  background:var(--border);
  border-radius:999px;
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}

/* Preview templates scoped */

.preview-alt, .preview-neu{
  font-family: ui-monospace, Menlo, monospace;
  padding:18px;
  min-height:100%;
}

.preview-alt{
  background:#02060a;
  color:#ffcc00;
}

.preview-neu{
  background:#080e1a;
  color:#e6e9f0;
}

.preview-alt .top, .preview-neu .top{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #1a2642;
  padding-bottom:10px;
  margin-bottom:14px;
  font-size:10px;
  letter-spacing:.18em;
}

.preview-neu .top{
  border-color:#ffcc00;
}

.preview-alt h1, .preview-neu h1{
  font-size:30px;
  line-height:.9;
  margin:0;
  letter-spacing:-.02em;
  color:#e6e9f0;
}

.preview-alt h1 span{
  color:#00f5ff;
}

.preview-neu h1 span{
  color:#ff00a0;
}

.preview-alt .grid, .preview-neu .grid{
  margin-top:16px;
  display:grid;
  grid-template-columns:repeat(9,1fr);
  gap:1px;
  background:#1a2642;
  border:1px solid #1a2642;
}

.preview-neu .grid{
  background:#ffcc00;
  border-color:#ffcc00;
}

.preview-alt .cell, .preview-neu .cell{
  background:#080e1a;
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:8px;
  color:#7a869e;
}

.preview-neu .cell{
  background:#0e182c;
  color:#00f5ff;
}

.preview-alt .cell.active{
  background:#ffcc00;
  color:#02060a;
}

.preview-neu .cell.active{
  background:#00f5ff;
  color:#02060a;
  font-weight:700;
}

.preview-alt .foot, .preview-neu .foot{
  margin-top:12px;
  display:flex;
  gap:12px;
  font-size:9px;
  color:#7a869e;
  flex-wrap:wrap;
}

.preview-neu .foot{
  color:#ffcc00;
}

@keyframes sparkFall{
  0%{
    transform:translateY(-10px) scale(1);
    opacity:1;
  }

  100%{
    transform:translateY(340px) translateX(18px) scale(.2);
    opacity:0;
  }
}

@keyframes blink{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.25
  }
}

@keyframes bootPulse{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.45
  }
}

.spark{
  animation: sparkFall 2.4s ease-in forwards;
}

.blink{
  animation: blink 1s infinite;
}

.boot-dot{
  animation: bootPulse 1s infinite;
}
