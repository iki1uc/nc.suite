    --accent: #1eff00;
  }
}

* {
  box-sizing: border-box;
}

html, body, #root {
  min-height: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

button {
  font: inherit;
}

.mono {
  font-family: Consolas, "Courier New", ui-monospace, monospace;
}

@keyframes respo-pulse {
  0%,100% {
    opacity: 1;
  }

  50% {
    opacity: .12;
  }
}

@keyframes respo-spin {
  0% {
    transform: rotate(9deg);
  }

  50% {
    transform: rotate(20deg);
  }

  100% {
    transform: rotate(9deg);
  }
}

.blink {
  animation: respo-pulse .53s steps(1) infinite;
}

.golden-spin {
  animation: respo-spin 3.6s ease-in-out infinite;
  transform-origin: 36px 42px;
}

::-moz-selection {
  background: var(--accent);
  color: #000;
}

::selection {
  background: var(--accent);
  color: #000;
}

::-webkit-scrollbar {
  width: 0;
  height: 0;
}

.hover\:border-\[var\(--line-soft\)\]:hover {
  border-color: var(--line-soft);
}

.hover\:bg-\[var\(--accent\)\]:hover {
  background-color: var(--accent);
}

.hover\:bg-opacity-\[0\.03\]:hover {
  --tw-bg-opacity: 0.03;
}

.group:hover .group-hover\:opacity-70 {
  opacity: 0.7;
}

@media (min-width: 640px) {
  .sm\:grid-cols-\[160px_1fr\] {
    grid-template-columns: 160px 1fr;
  }

  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:items-center {
    align-items: center;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-\[280px_1fr\] {
    grid-template-columns: 280px 1fr;
  }

  .md\:p-4 {
    padding: 1rem;
  }

  .md\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .md\:py-10 {
    padding-top: 2.5rem;
    padding-bottom: 2.5rem;
  }

  .md\:text-\[13px\] {
    font-size: 13px;
  }

  .md\:text-\[17px\] {
    font-size: 17px;
  }
}
