  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

.text-white {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.shadow-\[0_0_8px_\#ffaa22\] {
  --tw-shadow: 0 0 8px #ffaa22;
  --tw-shadow-colored: 0 0 8px var(--tw-shadow-color);
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.outline-none {
  outline: 2px solid transparent;
  outline-offset: 2px;
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.backdrop-blur-md {
  --tw-backdrop-blur: blur(12px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);
}

.transition {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --bg:#02060a;
  --surface:#071019;
  --surface2:#0b1b28;
  --border:rgba(0,204,255,.22);
  --c:#00ccff;
  --green:#22ff88;
  --orange:#ffaa22;
  --red:#ff4d5e;
  --text:#dcf4ff;
  --muted:#7ea4b5;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#02060a;
    --surface:#071019;
    --surface2:#0b1b28;
    --text:#dcf4ff;
    --muted:#7ea4b5;
  }
}

*{
  box-sizing:border-box;
}

html,body,#root{
  min-height:100%;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Space Grotesk", system-ui, sans-serif;
}

.mono{
  font-family:"JetBrains Mono", ui-monospace, monospace;
}

.win{
  background:linear-gradient(180deg, var(--surface) 0%, #050d14 100%);
  border:1px solid var(--border);
  box-shadow:0 18px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
}

.dot-grid{
  background-image:radial-gradient(rgba(0,204,255,.14) 1px, transparent 1px);
  background-size:18px 18px;
}

::-webkit-scrollbar{
  width:6px;
  height:6px;
}

::-webkit-scrollbar-thumb{
  background:#123344;
  border-radius:99px;
}

button,select,input{
  font:inherit;
}

button{
  cursor:pointer;
}

select{
  color:var(--text);
}

@media (min-width: 640px) {
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:text-\[64px\] {
    font-size: 64px;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-\[1\.2fr_\.8fr\] {
    grid-template-columns: 1.2fr .8fr;
  }

  .md\:p-5 {
    padding: 1.25rem;
  }

  .md\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .md\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .md\:py-11 {
    padding-top: 2.75rem;
    padding-bottom: 2.75rem;
  }

  .md\:pt-8 {
    padding-top: 2rem;
  }

  .md\:text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .md\:text-4xl {
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .md\:text-\[15px\] {
    font-size: 15px;
  }

  .md\:text-\[86px\] {
    font-size: 86px;
  }

  .md\:text-xl {
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 1024px) {
  .lg\:col-span-5 {
    grid-column: span 5 / span 5;
  }

  .lg\:col-span-7 {
    grid-column: span 7 / span 7;
  }

  .lg\:grid-cols-12 {
    grid-template-columns: repeat(12, minmax(0, 1fr));
  }

  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
