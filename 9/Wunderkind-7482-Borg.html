  color: var(--violet);
}

.text-white {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.transition {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-all {
  transition-property: all;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.transition-transform {
  transition-property: transform;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.duration-700 {
  transition-duration: 700ms;
}

:root{
  --bg:#02060a;
  --panel:#06101c;
  --panel2:#0a1826;
  --line:rgba(240,208,128,.18);
  --line2:rgba(200,216,232,.12);
  --ink:#f2ead2;
  --dim:#9aa8b8;
  --gold:#f0d080;
  --orange:#ff8a2a;
  --cyan:#5cf0ff;
  --green:#39ff88;
  --violet:#b388ff;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#010409;
    --panel:#071120;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg)
}

body{
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color:var(--ink)
}

.font-display{
  font-family: Georgia, "Times New Roman", serif;
  letter-spacing:.04em
}

.mono{
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace
}

@keyframes pulsePoint{
  0%,100%{
    box-shadow:0 0 28px 6px rgba(240,208,128,.75), 0 0 90px 22px rgba(240,208,128,.28);
    transform:scale(1)
  }

  50%{
    box-shadow:0 0 52px 18px rgba(240,208,128,.95), 0 0 150px 42px rgba(240,208,128,.42);
    transform:scale(1.07)
  }
}

@keyframes spinSlow{
  from{
    transform:rotate(0deg)
  }

  to{
    transform:rotate(360deg)
  }
}

@keyframes floatY{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-5px)
  }
}

.point-pulse{
  animation:pulsePoint 2.4s ease-in-out infinite;
}

.spin-slow{
  animation:spinSlow 34s linear infinite;
}

.spin-rev{
  animation:spinSlow 52s linear infinite reverse;
}

.float-y{
  animation:floatY 4s ease-in-out infinite;
}

.ring-transition{
  transition: transform .72s cubic-bezier(.2,.8,.2,1), opacity .55s ease, border-color .3s ease, box-shadow .3s ease, background-color .3s ease;
}

.hover\:bg-white\/5:hover {
  background-color: rgb(255 255 255 / 0.05);
}

.hover\:brightness-110:hover {
  --tw-brightness: brightness(1.1);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.focus\:outline-none:focus {
  outline: 2px solid transparent;
  outline-offset: 2px;
}

.focus\:ring-4:focus {
  --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);
  --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(4px + var(--tw-ring-offset-width)) var(--tw-ring-color);
  box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
}

.focus\:ring-white\/40:focus {
  --tw-ring-color: rgb(255 255 255 / 0.4);
}

@media (min-width: 640px) {
  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:border-4 {
    border-width: 4px;
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:py-5 {
    padding-top: 1.25rem;
    padding-bottom: 1.25rem;
  }

  .sm\:pb-8 {
    padding-bottom: 2rem;
  }

  .sm\:text-\[22px\] {
    font-size: 22px;
  }

  .sm\:text-\[38px\] {
    font-size: 38px;
  }

  .sm\:text-\[54px\] {
    font-size: 54px;
  }

  .sm\:text-\[76px\] {
    font-size: 76px;
  }

  .sm\:text-\[9px\] {
    font-size: 9px;
  }

  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 1024px) {
  .lg\:order-1 {
    order: 1;
  }

  .lg\:order-2 {
    order: 2;
  }

  .lg\:mt-5 {
    margin-top: 1.25rem;
  }

  .lg\:grid-cols-\[230px_minmax\(0\2c 1fr\)_230px\] {
    grid-template-columns: 230px minmax(0,1fr) 230px;
  }

  .lg\:grid-cols-\[minmax\(0\2c 1fr\)_minmax\(0\2c 1\.25fr\)\] {
    grid-template-columns: minmax(0,1fr) minmax(0,1.25fr);
  }
}
