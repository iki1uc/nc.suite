:root {
  --bg: #050505;
  --surface: #0a0a0a;
  --surface-2: #111111;
  --line: #222222;
  --line-2: #333333;
  --text: #f2f2f2;
  --muted: #999999;
  --dim: #666666;
  --green: #0f0;
  --orange: #ffb347;
  --cyan: #6cf;
  --pink: #ff88ff;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050505;
    --surface: #0a0a0a;
  }
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}

button {
  font: inherit;
}

.app-shell {
  min-height: 100vh;
  background: var(--bg);
  padding-top: var(--safe-area-inset-top);
  overflow-x: clip;
}

.topbar {
  position: sticky;
  top: var(--safe-area-inset-top);
  z-index: 20;
  background: rgba(5,5,5,.92);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
}

.topbar-inner {
  max-width: 1240px;
  margin: auto;
  padding: 13px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand {
  font-size: 11px;
  letter-spacing: .14em;
  font-weight: 700;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.brand-dot {
  color: var(--green);
  font-size: 17px;
}

.brand-sep, .muted {
  color: var(--dim);
}

.top-status {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 9px;
  letter-spacing: .18em;
  color: var(--green);
  white-space: nowrap;
}

.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 12px var(--green);
}

main {
  max-width: 1240px;
  margin: 0 auto;
  padding: 30px 16px 40px;
}

.hero {
  border: 1px solid var(--line);
  background: linear-gradient(112deg, #0b0f0b 0%, #050505 58%, #0c070a 100%);
  padding: 30px 22px 24px;
  position: relative;
  overflow: hidden;
}

.hero::after {
  content: "RUN21";
  position: absolute;
  right: -14px;
  bottom: -38px;
  font-size: 124px;
  font-weight: 900;
  letter-spacing: -.08em;
  color: #ffffff07;
  line-height: 1;
  pointer-events: none;
}

.eyebrow {
  color: var(--green);
  font-size: 11px;
  letter-spacing: .18em;
  font-weight: 700;
  margin: 0 0 18px;
}

.eyebrow span {
  color: var(--pink);
}

.hero h1 {
  margin: 0;
  font-size: clamp(42px, 9vw, 88px);
  line-height: .88;
  letter-spacing: -.06em;
  font-weight: 900;
  text-transform: uppercase;
}

.hero h1 em {
  color: var(--green);
  font-style: normal;
}

.hero-line {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 28px;
  max-width: 760px;
}

.hero-line strong {
  font-size: clamp(18px, 4vw, 28px);
  line-height: 1.1;
}

.hero-line strong span {
  color: var(--orange);
}

.hero-line p {
  color: var(--muted);
  margin: 0;
  font-size: 14px;
  line-height: 1.5;
}

.hero-meta {
  margin-top: 26px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  display: flex;
  flex-wrap: wrap;
  gap: 10px 28px;
  font-size: 11px;
  letter-spacing: .1em;
  color: var(--muted);
}

.green {
  color: var(--green);
}

.cyan {
  color: var(--cyan);
}

.orange {
  color: var(--orange);
}

.pink {
  color: var(--pink);
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 24px;
  margin: 54px 0 18px;
  flex-wrap: wrap;
}

.section-label {
  color: var(--green);
  font-size: 10px;
  letter-spacing: .2em;
  margin: 0 0 8px;
  font-weight: 700;
}

.section-head h2, .compare-head h2, .closing h2 {
  margin: 0;
  font-size: clamp(28px, 5vw, 48px);
  line-height: .95;
  letter-spacing: -.04em;
  text-transform: uppercase;
}

.section-note {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
  margin: 0;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  align-items: stretch;
}

.card {
  position: relative;
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 20px 20px 18px;
  cursor: pointer;
  transition: transform .18s ease, border-color .18s ease, background .18s ease;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.card:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
}

.card-active {
  border: 2px solid var(--accent);
  background: #0d0d0d;
  box-shadow: 0 18px 55px rgba(0,0,0,.55);
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.option-badge {
  background: var(--accent);
  color: #050505;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .14em;
  padding: 6px 8px;
}

.card-tag {
  color: var(--dim);
  font-size: 9px;
  letter-spacing: .12em;
  text-align: right;
}

.big-letter {
  color: var(--accent);
  font-size: 62px;
  line-height: .8;
  font-weight: 900;
  margin: 22px 0 12px;
}

.card h3 {
  font-size: 22px;
  line-height: 1.02;
  margin: 0;
  min-height: 46px;
}

.card-subtitle {
  color: var(--accent);
  font-size: 13px;
  line-height: 1.45;
  margin: 12px 0 18px;
  font-weight: 700;
}

.card-body {
  border-top: 1px solid var(--line);
  padding-top: 16px;
  color: #c8c8c8;
  font-size: 13px;
  line-height: 1.65;
}

.card-body p {
  margin: 0 0 10px;
}

.risk-grid {
  margin-top: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding-top: 18px;
}

.risk-grid div {
  border-top: 2px solid var(--accent);
  padding-top: 9px;
}

.risk-grid span {
  display: block;
  font-size: 8px;
  letter-spacing: .18em;
  color: var(--dim);
  margin-bottom: 5px;
}

.risk-grid strong {
  font-size: 11px;
  line-height: 1.3;
  display: block;
}

.card-action {
  margin-top: 18px;
  border: 1px solid var(--accent);
  color: var(--accent);
  background: transparent;
  padding: 11px;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .14em;
  cursor: pointer;
}

.card-action:hover {
  background: var(--accent);
  color: #050505;
}

.active-strip {
  position: absolute;
  top: 0;
  right: 0;
  background: var(--accent);
  color: #050505;
  font-size: 8px;
  font-weight: 900;
  letter-spacing: .12em;
  padding: 5px 7px;
}

.selector {
  margin: 26px 0 0;
  border: 1px solid var(--line);
  background: #080808;
  padding: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
}

.selector-label {
  font-size: 12px;
  letter-spacing: .18em;
  font-weight: 800;
}

.buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.select-btn {
  min-width: 106px;
  border: 1px solid var(--line-2);
  background: #111;
  color: #aaa;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.select-btn span {
  font-size: 24px;
  font-weight: 900;
  color: #eee;
}

.select-btn small {
  font-size: 10px;
  letter-spacing: .14em;
  font-weight: 800;
  text-align: left;
}

.select-btn.selected {
  border-color: var(--accent);
  color: var(--accent);
  background: #111;
  box-shadow: 0 0 0 1px var(--accent);
}

.select-btn.selected span {
  color: var(--accent);
}

.result {
  margin-top: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 24px;
}

.result-head {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 18px;
}

.result-head h2 {
  font-size: clamp(24px, 4vw, 38px);
  line-height: .95;
  margin: 0;
}

.result-icon {
  width: 54px;
  height: 54px;
  flex: 0 0 54px;
  border: 1px solid;
  display: grid;
  place-items: center;
}

.result-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin-top: 24px;
  border-top: 1px solid var(--line);
}

.result-cell {
  padding: 20px 18px 6px 0;
}

.result-cell.middle {
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
  padding-left: 18px;
  padding-right: 18px;
}

.result-num {
  color: var(--green);
  font-size: 10px;
  font-weight: 900;
}

.result-kicker {
  font-size: 10px;
  letter-spacing: .16em;
  color: var(--muted);
  margin: 8px 0 10px;
}

.result-cell strong {
  display: block;
  font-size: 26px;
  line-height: 1.05;
  text-transform: uppercase;
}

.result-cell > p:last-child {
  color: #aaa;
  font-size: 12px;
  line-height: 1.65;
  margin: 12px 0 0;
}

.result-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 22px 0 0;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
}

.compare {
  margin-top: 56px;
}

.compare-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.compare-question {
  display: flex;
  gap: 12px;
  align-items: center;
  color: var(--orange);
}

.compare-question p {
  margin: 0;
  color: #ddd;
  font-size: 15px;
  line-height: 1.35;
}

.compare-question strong {
  color: #fff;
}

.table-wrap {
  border: 1px solid var(--line);
  overflow-x: auto;
  background: var(--surface);
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 560px;
}

th, td {
  text-align: left;
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}

thead th {
  font-size: 11px;
  letter-spacing: .16em;
}

.th-muted {
  color: var(--dim);
}

.th-you {
  color: var(--green);
  background: #0f0;
  color: #050505;
  padding: 5px 9px;
}

tbody th {
  color: var(--muted);
  font-weight: 400;
  width: 22%;
}

tbody td:last-child {
  color: var(--green);
  border-left: 1px solid #0f0;
  background: rgba(0,255,0,.035);
}

tbody td:last-child strong {
  font-size: 16px;
}

.verdict-row th, .verdict-row td {
  border-bottom: 0;
  font-size: 15px;
}

.verdict-row td span {
  color: var(--dim);
  font-size: 12px;
  font-weight: 400;
}

.compare-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 12px;
}

.compare-cards > div {
  border: 1px solid var(--line);
  padding: 16px;
  display: flex;
  gap: 11px;
  align-items: start;
  background: #080808;
  color: var(--cyan);
}

.compare-cards p {
  margin: 0;
  color: #aaa;
  font-size: 12px;
  line-height: 1.6;
}

.compare-cards strong {
  color: #fff;
}

.closing {
  margin-top: 56px;
  border-top: 4px solid var(--green);
  background: #0a0f0a;
  padding: 30px 24px;
}

.closing-small {
  color: var(--green);
  font-size: 11px;
  letter-spacing: .2em;
  font-weight: 900;
  margin: 0 0 12px;
}

.closing h2 span {
  color: var(--green);
}

.closing-text {
  color: #bdbdbd;
  max-width: 820px;
  font-size: 15px;
  line-height: 1.7;
  margin: 18px 0 22px;
}

.closing-actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}

.mini {
  border: 1px solid var(--line-2);
  background: transparent;
  color: #bbb;
  padding: 11px 15px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .12em;
  cursor: pointer;
}

.mini.active {
  background: var(--green);
  color: #050505;
  border-color: var(--green);
}

footer {
  max-width: 1240px;
  margin: 0 auto;
  padding: 24px 16px 36px;
  border-top: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

footer > div {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  color: var(--cyan);
  font-size: 12px;
  letter-spacing: .12em;
}

footer strong {
  color: var(--pink);
  letter-spacing: .16em;
  font-size: 14px;
}

footer p {
  margin: 0;
  color: var(--dim);
  font-size: 10px;
  letter-spacing: .14em;
}

@media (max-width: 900px) {
  .cards {
    grid-template-columns: 1fr;
  }

  .card h3 {
    min-height: 0;
  }

  .compare-cards {
    grid-template-columns: 1fr;
  }

  .top-status {
    display: none;
  }

  main {
    padding: 22px 12px 32px;
  }

  .hero {
    padding: 24px 16px;
  }
}

@media (max-width: 600px) {
  .result {
    padding: 18px 16px;
  }

  .result-grid {
    grid-template-columns: 1fr;
  }

  .result-cell {
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
  }

  .result-cell.middle {
    border-left: 0;
    border-right: 0;
    padding-left: 0;
    padding-right: 0;
  }

  .result-cell:last-child {
    border-bottom: 0;
  }

  .selector {
    align-items: stretch;
    flex-direction: column;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    width: 100%;
  }

  .select-btn {
    min-width: 0;
    padding: 10px 8px;
    justify-content: center;
  }

  .select-btn small {
    display: none;
  }

  .compare-head {
    align-items: start;
    flex-direction: column;
  }

  .card {
    padding: 18px 16px;
  }

  .risk-grid {
    grid-template-columns: 1fr;
  }

  .brand .muted {
    display: none;
  }

  .hero::after {
    font-size: 88px;
    bottom: -26px;
  }

  table {
    min-width: 0;
  }

  th, td {
    padding: 13px 10px;
    font-size: 12px;
  }

  tbody td:last-child strong {
    font-size: 13px;
  }

  .verdict-row td span {
    display: block;
    margin-top: 3px;
  }
}
