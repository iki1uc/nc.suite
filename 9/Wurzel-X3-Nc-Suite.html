:root {
  --bg: #030507;
  --surface: #0a1018;
  --line: #1b2a3a;
  --text: #d7e2ee;
  --muted: #7d90a4;
  --gold: #ffd24a;
  --cyan: #22e6ff;
  --green: #3dffa0;
  --red: #ff5a4d;
  --home: #4da3ff;
  --ort: #f0b429;
  --pruef: #e5534b;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #030507;
    --surface: #0a1018;
    --line: #1b2a3a;
    --text: #d7e2ee;
    --muted: #7d90a4;
    --gold: #ffd24a;
    --cyan: #22e6ff;
    --green: #3dffa0;
    --red: #ff5a4d;
    --home: #4da3ff;
    --ort: #f0b429;
    --pruef: #e5534b;
  }
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Consolas, "Courier New", monospace;
}

button, a {
  font-family: inherit;
}

a {
  color: inherit;
}

.app-shell {
  min-height: 100vh;
  padding-top: var(--safe-area-inset-top);
  background: var(--bg);
  max-width: 1200px;
  margin: auto;
  padding-left: 14px;
  padding-right: 14px;
  padding-bottom: 14px;
  overflow-x: clip;
}

.kopf-zeile {
  position: sticky;
  top: var(--safe-area-inset-top);
  z-index: 9999;
  background: rgba(5, 5, 7, 0.95);
  border-bottom: 2px solid var(--gold);
  margin-bottom: 14px;
}

.kopf-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px;
  flex-wrap: wrap;
}

.kopf-brand {
  color: var(--gold);
  font-weight: 900;
  letter-spacing: 0.08em;
}

.kopf-nav {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.kopf-nav a {
  color: var(--cyan);
  text-decoration: none;
  border: 1px solid var(--line);
  padding: 4px 10px;
  font-size: 12px;
  transition: 0.15s;
}

.kopf-nav a:hover {
  border-color: var(--gold);
}

.kopf-nav a.active {
  background: var(--gold);
  color: #000;
  font-weight: 700;
}

.kopf-state {
  color: var(--green);
  border: 1px solid var(--green);
  padding: 4px 8px;
  font-size: 11px;
  letter-spacing: 0.1em;
  transition: 0.2s;
}

.kopf-state.warn {
  color: var(--gold);
  border-color: var(--gold);
}

.kopf-state.bad {
  color: var(--red);
  border-color: var(--red);
}

.mobile-nav {
  display: none;
  width: 100%;
  padding: 0 10px 10px;
}

#mobile-toggle {
  width: 100%;
  background: #050507;
  color: var(--gold);
  border: 1px solid var(--gold);
  padding: 10px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

#mobile-panel {
  display: none;
  margin-top: 4px;
  border: 1px solid var(--line);
}

#mobile-panel.open {
  display: grid;
}

#mobile-panel a {
  text-decoration: none;
  color: var(--cyan);
  padding: 10px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}

#mobile-panel a:last-child {
  border-bottom: 0;
}

#mobile-panel a.active {
  background: var(--gold);
  color: #000;
  font-weight: 700;
}

main {
  display: block;
}

h1 {
  color: var(--gold);
  margin: 0 0 8px;
  font-size: 24px;
  line-height: 1.2;
}

.sub {
  color: var(--muted);
  margin: 0 0 18px;
  line-height: 1.5;
  font-size: 13px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  align-items: start;
}

.box {
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 16px;
}

.box h2 {
  color: var(--cyan);
  font-size: 12px;
  margin: 0 0 12px;
  letter-spacing: 0.1em;
}

.rooms {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 4px;
}

.rooms button {
  padding: 10px 0;
  border: 1px solid var(--line);
  background: #101a26;
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
  transition: 0.12s;
}

.rooms button:hover {
  border-color: var(--gold);
}

.rooms button.on {
  background: var(--gold);
  color: #000;
  font-weight: 700;
}

#room-node-info {
  margin-top: 12px;
  border: 1px solid var(--green);
  background: rgba(61, 255, 160, 0.08);
  color: var(--green);
  padding: 10px;
  font-size: 13px;
  min-height: 40px;
  display: flex;
  align-items: center;
}

#rinfo {
  margin-top: 8px;
  color: var(--muted);
  font-size: 12px;
}

.action-note {
  margin: 10px 0 0;
  color: var(--cyan);
  font-size: 11px;
  letter-spacing: 0.04em;
}

.core {
  margin-bottom: 16px;
}

.core-val {
  font-size: 32px;
  font-weight: 700;
  color: var(--gold);
  line-height: 1.1;
}

.core-sub {
  color: var(--muted);
  font-size: 13px;
  margin-top: 4px;
  line-height: 1.5;
}

.live-panel {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 12px;
}

.live-panel h3 {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.1em;
  margin: 0 0 8px;
}

.wurzeln-live {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.w-box {
  background: #060b11;
  border: 1px solid var(--line);
  padding: 10px 8px;
  border-radius: 4px;
  text-align: center;
}

.w-box .lbl {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.1em;
}

.w-box .val {
  font-size: 14px;
  font-weight: 700;
  margin-top: 2px;
}

.w-box.home .val {
  color: var(--home);
}

.w-box.ort .val {
  color: var(--ort);
}

.w-box.pruef .val {
  color: var(--pruef);
}

footer {
  margin-top: 30px;
  border-top: 1px solid var(--line);
  padding-top: 12px;
  color: #6e8091;
  font-size: 11px;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

.sync-note {
  color: var(--cyan);
  opacity: 0.7;
}

@media (max-width: 760px) {
  .kopf-nav {
    display: none;
  }

  .mobile-nav {
    display: block;
  }

  .rooms {
    grid-template-columns: repeat(3, 1fr);
  }

  .grid {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: 22px;
  }

  .kopf-inner {
    justify-content: space-between;
  }
}
</style>
