:root{
  --bg:#020402;
  --surface:#061206;
  --panel:#071307;
  --line:rgba(0,255,0,.28);
  --green:#0f0;
  --green2:#39ff88;
  --gold:#ffd700;
  --cyan:#00ccff;
  --orange:#ff8800;
  --pink:#ff2d9a;
  --red:#ff4a2e;
  --text:#d9ffd9;
  --muted:#7ea88a;
  --dim:#5a7a8a;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#020402;
    --surface:#061206;
    --text:#d9ffd9;
  }
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  min-height:100%;
  background:var(--bg)
}

body{
  color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  line-height:1.5
}

button{
  font:inherit
}

.shell{
  width:100%;
  min-height:100vh;
  padding:var(--safe-area-inset-top) 12px 24px;
  background:radial-gradient(circle at 50% -80px,rgba(0,255,0,.12),transparent 42%),var(--bg);
  overflow-x:clip
}

.topbar{
  max-width:1120px;
  margin:0 auto;
  padding:18px 4px 14px
}

.eyebrow{
  font-size:10px;
  letter-spacing:3px;
  color:var(--muted);
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
  display:inline-block
}

.topbar h1{
  font-size:clamp(28px,6vw,56px);
  line-height:.95;
  letter-spacing:-1px;
  margin:14px 0 10px;
  color:#fff;
  text-transform:uppercase
}

.mode-inline{
  color:var(--green);
  text-shadow:0 0 18px rgba(0,255,0,.55)
}

.gold{
  color:var(--gold)
}

.sep{
  color:#3d5a40;
  font-weight:400
}

.subtitle{
  max-width:900px;
  color:#a8c8ae;
  font-size:13px;
  margin:0
}

.subtitle s{
  color:#ff7a6a
}

.panel,.control{
  max-width:1120px;
  margin:12px auto;
  background:linear-gradient(180deg,rgba(0,255,0,.045),rgba(0,0,0,.18));
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px
}

.panel-gold{
  border-color:rgba(255,215,0,.32);
  background:linear-gradient(180deg,rgba(255,215,0,.055),rgba(0,0,0,.18))
}

.kicker{
  font-size:10px;
  letter-spacing:3px;
  color:var(--gold);
  font-weight:900
}

.control-head{
  display:flex;
  justify-content:space-between;
  gap:18px;
  align-items:flex-start
}

.control-head h2{
  font-size:18px;
  line-height:1.25;
  margin:6px 0;
  color:#fff
}

.wisdom{
  max-width:420px;
  font-size:12px;
  color:#c8e4cd;
  border-left:3px solid var(--gold);
  padding-left:10px
}

.btn-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:14px
}

.big{
  border:1px solid var(--line);
  background:#031203;
  color:var(--text);
  border-radius:10px;
  padding:13px;
  display:flex;
  gap:11px;
  align-items:center;
  text-align:left;
  cursor:pointer;
  transition:.15s
}

.big:hover{
  transform:translateY(-1px);
  border-color:var(--green)
}

.big b{
  display:block;
  font-size:13px
}

.big small{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:2px
}

.big .state{
  margin-left:auto;
  font-size:10px;
  font-weight:900;
  white-space:nowrap
}

.big.active.green{
  background:var(--green);
  color:#000
}

.big.active.green small{
  color:#063
}

.big.active.gold{
  background:var(--gold);
  color:#000
}

.big.active.gold small{
  color:#5a4300
}

.big.active.cyan{
  background:var(--cyan);
  color:#000
}

.big.active.cyan small{
  color:#073
}

.big.active.orange{
  background:var(--orange);
  color:#000
}

.big.active.orange small{
  color:#4a2200
}

.legend{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  font-size:11px;
  color:var(--muted);
  margin-top:13px;
  border-top:1px solid rgba(0,255,0,.15);
  padding-top:11px
}

.visual{
  padding:10px 10px 14px
}

.canvas-wrap{
  border:1px solid rgba(0,255,0,.2);
  border-radius:10px;
  overflow:hidden;
  background:#000
}

canvas{
  display:block;
  width:100%;
  height:300px
}

.caption{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  font-size:10px;
  margin:10px 4px;
  color:var(--muted)
}

.caption .dim{
  opacity:.45
}

.caption .on{
  color:#ffb169
}

.status{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin:8px 4px 0
}

.chip{
  padding:5px 8px;
  background:#000;
  border:1px solid #1a2c1e;
  border-radius:999px;
  font-size:9px;
  color:var(--muted)
}

.chip b{
  color:#fff
}

.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  max-width:1120px;
  margin:0 auto
}

.two-col .panel{
  margin:0
}

.panel-title{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center
}

.panel-title>span:first-child{
  font-weight:900;
  font-size:15px
}

.pill{
  font-size:9px;
  letter-spacing:1px;
  border:1px solid var(--line);
  padding:5px 8px;
  border-radius:999px;
  color:var(--green2);
  white-space:nowrap
}

.gold-pill{
  color:var(--gold);
  border-color:rgba(255,215,0,.4)
}

.panel-sub{
  font-size:11px;
  color:var(--muted);
  margin:7px 0 12px
}

.code{
  font-size:10px;
  white-space:pre-wrap;
  background:rgba(0,0,0,.65);
  padding:12px;
  border:1px solid rgba(0,255,0,.15);
  border-radius:8px;
  max-height:320px;
  overflow:auto;
  line-height:1.55;
  color:#b9ffb9
}

.code.cyan-border{
  border-color:var(--cyan);
  color:#b7f2ff
}

.rome-list{
  margin-top:12px;
  display:grid;
  gap:6px
}

.rome{
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid rgba(0,255,0,.14);
  padding:8px;
  border-radius:8px;
  background:#020a03
}

.rome .num{
  font-weight:900;
  color:var(--gold)
}

.rome div{
  display:flex;
  flex-direction:column
}

.rome b{
  font-size:11px
}

.rome span{
  font-size:10px;
  color:var(--muted)
}

.tag{
  margin-left:auto;
  font-size:8px;
  border:1px solid var(--line);
  padding:4px 6px;
  border-radius:999px;
  color:var(--green2)
}

.tag.dim{
  color:#666;
  border-color:#333
}

.runtime-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:10px
}

.runtime-stats>div{
  border:1px solid rgba(0,255,0,.18);
  padding:10px;
  border-radius:9px;
  background:#020a03
}

.runtime-stats label{
  display:block;
  font-size:8px;
  letter-spacing:2px;
  color:var(--muted)
}

.runtime-stats b{
  display:block;
  font-size:20px;
  color:#fff
}

.runtime-stats span{
  font-size:10px;
  color:var(--muted)
}

.log{
  height:160px;
  overflow:auto;
  background:#000;
  border:1px solid #18301c;
  padding:8px;
  font-size:9px;
  line-height:1.65;
  border-radius:8px
}

.log-line{
  color:var(--green2)
}

.log-line.ok{
  color:#fff
}

.log-line.warn{
  color:var(--gold)
}

.runtime-btns{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin:10px 0
}

.cta{
  border:1px solid var(--line);
  background:#031203;
  color:var(--text);
  padding:10px 12px;
  border-radius:8px;
  display:flex;
  gap:6px;
  align-items:center;
  cursor:pointer;
  font-size:11px;
  font-weight:800
}

.cta:hover{
  border-color:var(--green)
}

.cta.gold-bg{
  background:var(--gold);
  color:#000
}

.cta.ghost{
  background:#000
}

.cta:disabled{
  opacity:.45;
  cursor:not-allowed
}

.explain{
  font-size:9px;
  color:#7d9b84;
  background:rgba(0,0,0,.55);
  padding:10px;
  border:1px solid rgba(0,255,0,.12);
  border-radius:8px;
  white-space:pre-wrap
}

.bridge-note{
  margin-top:10px;
  border:1px dashed var(--green2);
  padding:10px;
  font-size:9px;
  color:var(--green2);
  line-height:1.6
}

.bridge-note b{
  display:block
}

.bridge-note span{
  color:#9ecaa8
}

.wrong-right{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:12px 0
}

.wrong-right>div{
  border:1px solid #263024;
  padding:11px;
  border-radius:9px;
  font-size:11px;
  line-height:1.6
}

.wrong-right b{
  display:block;
  margin-bottom:4px
}

.red{
  color:#ff6b57
}

.green{
  color:var(--green2)
}

.stations-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px
}

.station{
  border:1px solid #243424;
  background:#020a03;
  color:var(--text);
  border-radius:9px;
  padding:12px;
  display:flex;
  gap:10px;
  align-items:center;
  text-align:left;
  cursor:pointer
}

.station:hover{
  border-color:var(--tone)
}

.station.active{
  border-color:var(--tone);
  background:#0a160d;
  box-shadow:0 0 0 1px var(--tone)
}

.station svg{
  color:var(--tone);
  flex:0 0 auto
}

.station b{
  display:block;
  font-size:12px
}

.station small{
  font-size:9px;
  color:var(--muted)
}

.station>svg:last-child{
  margin-left:auto;
  color:var(--muted)
}

.station-detail{
  margin-top:12px;
  border:1px solid rgba(255,215,0,.3);
  border-radius:10px;
  padding:14px;
  background:rgba(255,215,0,.04)
}

.station-head{
  display:flex;
  gap:12px;
  align-items:center
}

.station-head h3{
  margin:0;
  font-size:18px;
  color:#fff
}

.station-head p{
  margin:0;
  font-size:11px;
  color:var(--muted)
}

.station-desc{
  font-size:13px;
  line-height:1.65;
  margin:12px 0 8px
}

.station-extra{
  font-size:11px;
  color:var(--muted);
  border-top:1px solid rgba(0,255,0,.15);
  padding-top:10px
}

footer{
  max-width:1120px;
  margin:22px auto 0;
  text-align:center;
  border-top:3px solid var(--gold);
  padding:20px 10px 8px
}

.footer-big{
  font-size:clamp(28px,7vw,56px);
  font-weight:900;
  letter-spacing:4px;
  color:var(--gold);
  line-height:1
}

footer p{
  font-size:13px;
  color:#c9e4cd
}

footer p b{
  color:#fff
}

.footer-meta{
  display:flex;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
  font-size:9px;
  letter-spacing:2px;
  color:var(--muted);
  margin-top:14px
}

.hide-mobile{
  display:inline
}

@media(max-width:820px){
  .shell{
    padding-left:10px;
    padding-right:10px
  }

  .control-head{
    flex-direction:column
  }

  .btn-grid{
    grid-template-columns:1fr
  }

  .two-col{
    grid-template-columns:1fr
  }

  .wrong-right{
    grid-template-columns:1fr
  }

  .stations-grid{
    grid-template-columns:1fr 1fr
  }

  .runtime-stats{
    grid-template-columns:1fr 1fr
  }

  .runtime-stats>div:last-child{
    grid-column:1/-1
  }

  .caption{
    flex-direction:column;
    gap:4px
  }

  .hide-mobile{
    display:none
  }

  .big{
    padding:12px
  }
}

@media(max-width:430px){
  .stations-grid{
    grid-template-columns:1fr
  }

  .runtime-stats{
    grid-template-columns:1fr
  }

  .topbar h1{
    font-size:34px
  }

  .panel,.control{
    padding:13px
  }

  .station-head{
    flex-wrap:wrap
  }

  .footer-meta{
    gap:8px
  }
}
</style>
