:root{
  --bg:#0a0f0c;
  --surface:#111815;
  --surface-2:#17211c;
  --line:#2b372f;
  --line-2:#3a4a3f;
  --text:#e9eee9;
  --muted:#9aa89f;
  --dim:#6f7f74;
  --green:#3ddc84;
  --red:#ff5d5d;
  --yellow:#ffcb3d;
  --font-sans:"Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}

@media (prefers-color-scheme: light){
  :root{
    --bg:#f0f3ef;
    --surface:#ffffff;
    --surface-2:#e8eee9;
    --line:#c7d2c9;
    --line-2:#aebcb2;
    --text:#121815;
    --muted:#526057;
    --dim:#7a887f;
    --green:#0b7a45;
    --red:#c22f2f;
    --yellow:#8a6500;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-sans)
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

.mono{
  font-family:var(--font-mono)
}

.card{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:14px
}

.card-active{
  border-color:var(--green);
  box-shadow:0 0 0 1px var(--green) inset
}

.btn{
  border:1px solid var(--line-2);
  background:var(--surface-2);
  color:var(--text);
  border-radius:999px;
  padding:10px 16px;
  font-weight:750;
  letter-spacing:.02em;
  transition:transform .08s ease,border-color .15s ease,background .15s ease
}

.btn:hover{
  border-color:var(--text)
}

.btn:active{
  transform:translateY(1px) scale(.99)
}

.btn-primary{
  background:var(--green);
  color:#06130c;
  border-color:var(--green)
}

.btn-danger{
  background:transparent;
  color:var(--red);
  border-color:var(--red)
}

.btn-ghost{
  background:transparent
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px 9px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.06em;
  white-space:nowrap
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  flex:none
}

input[type="range"]{
  width:100%;
  accent-color:var(--green)
}

.table-wrap{
  overflow-x:auto;
  overflow-x:clip
}

table{
  width:100%;
  border-collapse:collapse
}

th,td{
  padding:10px 8px;
  text-align:left;
  border-bottom:1px solid var(--line);
  vertical-align:top
}

th{
  font-size:11px;
  letter-spacing:.08em;
  color:var(--muted)
}

.kicker{
  font-size:12px;
  letter-spacing:.14em;
  font-weight:800;
  color:var(--muted)
}

h1,h2,h3{
  line-height:1.05;
  letter-spacing:-.02em
}

:focus-visible{
  outline:2px solid var(--green);
  outline-offset:2px
}

@media (min-width: 640px) {
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));

  }

  .sm\:text-4xl {
    font-size: 2.25rem;

  }

  .sm\:text-lg {
    font-size: 1.125rem;
    line-height: 1.75rem;
  }

  .sm\:text-xl {
    font-size: 1.25rem;

  }
